# halo_vr_dev.cfg -- DEVELOPMENT & TROUBLESHOOTING knobs for the Halo: Campaign Evolved VR
# plugin. Ships with the mod, but NOTHING in it is needed for normal play.
#
# ========================= DO NOT EDIT THIS FILE CASUALLY =========================
# These are internal research and diagnostic knobs. The commented values document the
# tested shipping behaviour; a wrong value here can tank framerate (which in VR means
# nausea), break aim, or quietly invalidate a calibration. Uncomment something only if
# you know exactly what you are doing -- or troubleshooting instructions ask you to.
#
# Player settings belong in halo_vr_user.cfg (catalog: halo_vr_user_reference.txt), NOT
# here. Mod updates OVERWRITE this file (deliberately, so experiments cannot linger),
# while halo_vr_user.cfg and halo_vr_calib.cfg are never touched by an update.
# ==================================================================================
#
# HOW IT WORKS
#   * Read order, every ~2 s while the game runs (later wins for any key set twice):
#       halo_vr.cfg -> halo_vr_user.cfg -> halo_vr_dev.cfg (this file) -> halo_vr_calib.cfg
#     This file beats the user file ON PURPOSE: an uncommented key here is a deliberate,
#     temporary experiment, and the startup log calls it out ("DEV OVERRIDES ACTIVE").
#   * EVERY LINE SHIPS COMMENTED (packaging enforces it). The file changes nothing until a
#     key is uncommented; the value shown on each key is the effective default.
#   * The parser is file-agnostic: any key works from any of the editable files.
#   * [dev build] marks keys whose CODE only exists when compiled with HALO_VR_DEV=1 (see
#     src/DevTools.hpp in the source repo). On the release build they parse and do nothing
#     -- that is expected, not broken.

# =============================================================== WEAPON SCOPE RESEARCH
# The pane's lens width at 1x magnification, deg horizontal (pane fov = scopebase / scopezoom).
#scopebase=70
# ESceneCaptureSource for the pane's capture. 0 = SCS_SceneColorHDR (linear scene colour, no
# exposure dependency -- the shipped choice, paired with the HDR target + emissive lens that
# re-enters the main tonemapper).
# MEASURED 2026-08-14:
#   2 (FinalColorLDR)      orders of magnitude DARK
#   8 (FinalColorHDR)      SOLID BLACK, and still black with the capture's exposure pinned
#   9 (FinalToneCurveHDR)  SOLID BLACK
# CORRECTED 2026-08-16 -- the conclusion drawn from that ("every post-processed source is unusable
# here, changing this key cannot recover anything") is WRONG, and it stood for two days because
# nobody had varied the right thing. The blocker was NOT the source: it was
# bAlwaysPersistRenderingState, which we force TRUE to hold a steady image between manual captures.
# That persistent state is a TEMPORAL HISTORY, and the symptom -- an unrecognisable image that then
# FADES to black -- was that history converging, not a frame rendering black.
#   scopesrc=8 + scopepersist=0  ->  RENDERS. Darker than the main view, but legible.
# Darker is expected and not a defect: source 8 hands over an already-tonemapped image which then
# re-enters the MAIN tonemapper through the pane's emissive lens, so it is tonemapped twice.
# scopebright compensates. Source 0 remains the SHIPPED choice -- this is a research lane, and
# post-processing in the capture has not yet been shown to buy anything the effects care about.
# CORRECTED 2026-08-14: the follow-on claim that "effects live in POST, so they cannot reach the
# scope" is WRONG. UE 5.5 force-disables separate translucency for scene captures precisely so a
# pre-post capture still sees translucency, and scopetest=1 MEASURED a translucent primitive
# rendering into this pane. Whatever keeps shields/tracers out, it is not blending. See
# docs\BLAM_AIM_FINDINGS.md, 2026-08-14 (later).
#scopesrc=2
# scopeautoexposurebias: AutoExposureBias in STOPS (EV). Exposure compensation applied AFTER
# adaptation, so the capture still adapts per scene and the whole result simply lands N stops
# brighter. +1 EV = twice as bright, +2 = four times, -1 = half. Range -16..16, default 0 =
# never written (the capture inherits whatever it would otherwise get).
#
# THIS IS THE ONLY PRE-TONEMAP BRIGHTNESS CONTROL. Added 2026-09-07 because there was none:
# pin_capture_exposure() was the only thing in the plugin that wrote any exposure field, and it
# only runs when scopeexposure > 0 -- so an AUTO-exposed capture (scopeexposure=0, the setting
# that lets it adapt per scene) had nothing but scopebright, which is a tint applied AFTER the
# tonemapper and after quantisation. That stretches an already-compressed signal instead of
# feeding the curve higher, and the measured symptom is a yellow/green cast as bright colours
# reach the tonemapper's shoulder, arriving long before the FX become readable.
#
# Use it INSTEAD of large scopebright values: raise this until the image reads correctly, then
# bring scopebright back toward 1 and use it only for a final trim. Also honoured when the pin is
# ON, so pinned and auto configurations tune with the same key.
#scopeautoexposurebias=2.5
# scopelumen: DynamicGlobalIlluminationMethod + ReflectionMethod on the capture.
#   -1 = leave alone (DEFAULT = the engine's forced-off state)
#    0 = None   1 = Lumen   2 = ScreenSpace   3 = Plugin (GI only)
#
# UE turns Lumen OFF for EVERY scene capture. SceneCaptureRendering.cpp:880-885 sets both methods
# to None and halves LumenSurfaceCacheResolution, commented "By default, Lumen is disabled in scene
# captures, but can be re-enabled with the post process settings in the component." So the main view
# runs Lumen GI and Lumen reflections and the scope runs neither -- same scene, same camera,
# DIFFERENT LIGHTING MODEL.
#
# Reported from a headset as "it is like the lighting is different for the scene through the scope",
# which is exactly what losing indirect bounce and specular reflection looks like: flatter, warmer,
# and darker specifically where the light was indirect. It was chased as a colour cast for hours and
# it is not one -- this is BASE-PASS lighting, upstream of exposure, bloom, tone curve and tint,
# which is why none of those could reach it.
#
# 1 matches the main view. Costs real GPU time (the capture then runs a second Lumen scene), so it
# is opt-in rather than defaulted on. Set -1 to hand it back to the engine.
#scopelumen=-1
# scopeppgrade: copy the game's COLOUR GRADE from its camera onto the capture -- the LUT, white
# balance, the saturation/contrast/gamma/gain/offset sets (base + shadows/midtones/highlights),
# and the film curve, each with its paired bOverride_ bit. 0 = off (default).
#
# MEASURED IN A HEADSET 2026-09-07: the same corridor renders purple-lit in the main view and warm
# TAN through the scope. Not a tint -- a different colour family, i.e. the surfaces' raw albedo
# with the game's stylistic grade missing. Everything else was eliminated first: not exposure, not
# bloom, not double-tonemapping (the compositor quad has ONE tonemapper and still showed it), and
# not Lumen (scopelumen=1 applied with readback GI=1 refl=1 and changed nothing).
#
# WHY A CAPTURE MISSES IT: PostProcess VOLUMES reach a scene capture identically --
# UWorld::AddPostProcessingSettings has no view-type filter. But a capture never goes through
# APlayerCameraManager, so a look configured on the CAMERA COMPONENT'S OWN PostProcessSettings is
# invisible to it, and no downstream knob can put it back.
#
# Distinct from scopeppcopy, which copies BLENDABLES only. scopeppcopy originally memcpy'd the whole
# FPostProcessSettings -- which WOULD have carried the grade -- and was cut back because the struct
# contains a TArray and byte-copying it hands two objects one allocation. The intent was right and
# only the mechanism was wrong; this copies the grading fields individually, every one POD or a
# single object pointer, and each field's SIZE is resolved from the reflected struct rather than
# assumed (FVector4 is four doubles under LWC on some builds and four floats on others).
#
# NOT REVERSIBLE IN-SESSION: the bOverride_ bits stay set once written, so 0 stops re-copying but
# does not undo. A fresh session is what actually reverts it, and the log says so when you try.
#scopeppgrade=0
# scopeaa: DOES NOTHING. Left documented so it is not rediscovered as a lead. It was written to
# force the capture's anti-aliasing method via FPostProcessSettings, but UE 5.5 HAS NO
# AntiAliasingMethod FIELD IN THAT STRUCT at all (grep Engine/Classes/Engine/Scene.h) -- the key is
# inert by construction, not by any quirk of this game. The view's AA is decided in
# FSceneView::SetupAntiAliasingMethod (SceneView.cpp:1067), and a scene-colour capture lands on
# AAM_None regardless because EngineShowFlags.PostProcessing is force-disabled for it. Moving a
# capture's AA would have to go through the ShowFlagSettings array instead.
#scopeaa=-1
# 0 = ALSO pass the left trigger through to Blam while the scope feature is on. Native zoom then
# engages underneath (viewmodel hide, zoom HUD mask, halved look speed) -- research only, for
# watching the native state respond. The dev build logs the Blam zoom state on change
# ("SCOPEDEV blam zoom CHANGED": GetZoomLevelAbsolute/-Magnification on the player's
# BlamUnitComponent) whether or not this is set. [dev build]
#scopeeat=1
# Synthesize the scope's aim ray from the RENDERED VIEW instead of the controller. A FALLBACK for
# headless work, not a requirement: this was written when the null driver never validated a
# controller aim pose, which parked the real ray source. CORRECTED 2026-08-16 -- the scope has
# since been brought up repeatedly under SimVR with this key OFF, so the old claim that "without
# this the scope cannot be exercised headlessly at all" is FALSE. Reach for it only if the ray
# source actually parks. [dev build]
#scopedevray=0
# Hold the scope pane ON with no trigger input. Harness/support diagnostic, and likewise a
# FALLBACK rather than a necessity -- the left trigger has been reaching the toggle under SimVR in
# practice. Still the one automation channel that always works when input cannot get through,
# since the config file is re-read every ~2 s.
#scopeforce=0
# Capture cadence A/B: 0 = manual CaptureScene every scopediv ticks (the shipping perf valve),
# 1 = bCaptureEveryFrame while the pane is shown (render-rate; costlier, smoother).
#scopecapmode=1
# Scope geometry internals (the player face of the scope is in the user catalog). The capture
# camera must sit further out along the aim line than the pane (scopedist), or it films the
# pane's back and the lens goes black.
#scopecamdist=90
# Pane facing trim, degrees -- geometry only, relative to the controller; never for picture
# orientation (that is scopecamroll, user catalog).
#scoperotp=90
#scoperoty=0
#scoperotr=180
# 1 = pane mounted to the controller (default); 0 = the older aim-ray placement, kept as a
# fallback if a controller-relative offset ever sits oddly.
#scopemount=1
# What the scope CAMERA follows once attached to the rig. The PANE is a rigid child either way;
# this only decides what it shows. 0 = re-anchor to the live aim ray every tick (default: the
# in-pane reticle stays truthful, but residual aim jitter is visible and lens-magnified).
# 1 = anchor once and stay rigid like the pane (smoothest image, pure controller motion, but the
# view drifts off the true shot line as the aim-vs-rig delta changes). A/B this if the IMAGE
# still shimmers after the pane itself sits solid.
#scopecamtrack=0
# TRANSLUCENCY PROBE. Spawns a cube parented to the CAPTURE CAMERA (its local +X), so it is in
# frame without any aiming, and simultaneously in the MAIN view in front of the weapon -- which
# is the control. "Visible in the world, absent from the pane" is the whole measurement.
#   0 = off
#   1 = Widget3DPassThrough_Translucent (authored BLEND_Translucent)
#   2 = Widget3DPassThrough_Opaque      (the CONTROL for 1)
#   3 = EmissiveMeshMaterial at BLEND_Additive -- its AUTHORED mode. Additive is in the
#       translucency family and is what plasma/shield/tracer effects use.
#   4 = EmissiveMeshMaterial forced BLEND_Opaque (the CONTROL for 3, and the pane's own recipe)
# Forcing a blend mode at runtime does NOT recompile shaders, so only modes whose cooked shader
# exists are testable -- BLEND_Translucent on this material vanished from the MAIN view too.
# Two independent pairs on purpose: one pair could be defeated by something specific to one
# material. Live -- a mode change destroys and rebuilds the cube. [dev build]
#   5 = WorldGridMaterial -- LIT, OPAQUE, NO PARAMETERS. THE POSITIVE CONTROL. Run this FIRST:
#       modes 1-4 all need a texture parameter bound before they can be seen at all, and every
#       failure of this probe so far has been that binding rather than anything about captures.
#       Mode 5 cannot come out black for a plumbing reason. If it shows in the pane, captures
#       render AND shade our geometry and a null result from another mode means something. If it
#       does not, nothing measured through this probe has ever meant anything.
#   6 = MI_JackalShield -- THE REAL SHIELD MATERIAL, on a cube. The census found this exact
#       material on all 54 live shield primitives; it arrives with its own textures and parameters
#       already set by the game, so there is nothing of OURS to get wrong. This is the mode that
#       actually answers the question -- every other mode tests a stand-in and argues by analogy.
#       Visible in the pane => the material renders in captures fine, and the shields' absence is
#       about something else (ownership, a per-actor flag, a pass gate we have not found).
#       Invisible in the pane but visible in the main view => the material is what captures will
#       not draw, and that is the answer.
# MEASURED 2026-08-16: modes 3 and 4 came out black in the MAIN VIEW as well as the pane, so both
# A/B runs measured NOTHING and neither is citable. CHECK THE MAIN VIEW EVERY TIME -- a cube that
# is black in both is a broken instrument, not a finding.
# The first diagnosis of that -- "WhiteSquareTexture does not resolve, its pointer is in the module
# address range rather than the UObject heap" -- is itself WRONG and is recorded here so it is not
# made again: mode 5's WorldGridMaterial resolves into that same 0x00007FF4 range and
# is_live_uobject FINDS IT IN THE OBJECT ARRAY. On this build that address range is ordinary and
# says nothing about validity. Why the EmissiveMeshMaterial cubes are black is still OPEN (most
# likely the emissive PARAMETER NAME, not the texture object) -- mode 6 sidesteps it entirely.
# The probe now validates every material and texture against the object array and says "THIS RUN
# PROVES NOTHING" in the log rather than quietly drawing a black cube.
#scopetest=0
#scopetestdist=300
# Keep the cube SMALL ENOUGH TO SEE PAST. The engine Cube is 100 cm and the capture's FOV is
# scopebase/scopezoom -- only 7 deg at 10x, where a 50 cm cube at 300 cm subtends 9.5 deg and fills
# the frame completely. "The pane is black" and "the cube is black" are then the same picture. The
# placement log prints the subtended angle and warns when it fills the frame.
#scopetestsize=0.1
# WHICH TEXTURE THE CUBE'S EMISSIVE SAMPLES -- the difference between an instrument and a black
# rectangle. The pane and the cube build their material by an IDENTICAL recipe (same
# EmissiveMeshMaterial, same BlendMode write, same CreateDynamicMaterialInstance, same
# LinearColor/SlateUI binds, same tint). The pane shows its render target perfectly; the cube came
# out black in BOTH views. The only substantive difference was the texture OBJECT.
#   0 = /Engine/EngineResources/WhiteSquareTexture. Resolves to a LIVE UObject -- verified against
#       the object array -- and renders BLACK anyway. An /Engine/EngineResources asset need not
#       carry usable cooked texture data in a shipped build. This was the old default, and it is
#       why scopetest 3 and 4 measured nothing on two separate runs.
#   1 = a solid white render target built and explicitly cleared at runtime (make_color_rt). The
#       SAME OBJECT TYPE the pane proves samples correctly, with content we choose. DEFAULT.
#   2 = the scope's OWN render target. Certain to sample -- it is what the pane displays -- but it
#       feeds the capture back into itself: judge the MAIN VIEW only, the pane image is meaningless.
# ALWAYS CHECK THE MAIN VIEW FIRST. A cube that is black in both views is a broken instrument, not
# a finding about scene captures.
#scopetesttex=1
# ---- THE BLACK-FINAL-COLOUR LEVERS ---------------------------------------------------------
# The scope-FX question reduces to ONE unanswered thing. Scene-colour sources (scopesrc=0) render,
# but the engine FORCE-DISABLES post-processing for them (SceneCaptureRendering.cpp:853), so any
# effect whose look is produced in post cannot arrive. Final-colour sources keep post but come out
# SOLID BLACK here. Answer "why black" and the scope shows everything normally.
# These three are per-capture properties that plausibly cause that black and had never been tested.
# All three were verified as real Blueprint-accessible UPROPERTYs in the UE 5.5 source first, and
# all three log a READBACK -- so a null result means "not the cause", not "the write went nowhere".
# Use them WITH a post-processed source (scopesrc=8 or 2); against source 0 they measure nothing.
#
# bAlwaysPersistRenderingState. Shipped at 1 so exposure/TAA state survives between manual captures
# and a low-rate scope holds a steady image. But that persistent state IS a temporal history, and
# the reported symptom -- an unrecognisable image that then FADES to complete black -- is the
# signature of a history converging to black rather than a frame that renders black. 0 drops it.
#scopepersist=1
# bCameraCutThisFrame, forced every tick (the renderer clears it after each capture, so a one-shot
# write would measure nothing). Invalidates the temporal history every frame -- the same hypothesis
# as scopepersist, from the side that KEEPS the persistent state the exposure pin needs.
#scopecamcut=0
# PostProcessBlendWeight. At 0 the capture's own PostProcessSettings do not blend in at all, so if
# the black survives, nothing WE wrote into those settings caused it -- the control the exposure
# pin never had. -1 leaves the engine default untouched.
#scopeppweight=-1
# ---- SHIELD FX CENSUS ------------------------------------------------------------------------
# One-shot, chunked sweep for the LIVE shield primitives (Elite shield meshes, cover/portable
# shields), logged as "SHIELDFX". Answers why they reach the pane as unshaded outlines:
#   bHiddenInSceneCapture set  -> the game simply hides them from captures; one property write
#                                 fixes it and every other theory here is irrelevant. Checked
#                                 first because it has never been looked at.
#   bRenderCustomDepth set     -> they are drawn by a post-process pass keyed on depth/stencil,
#                                 which CONFIRMS the post-processing explanation outright and
#                                 explains the unlit projectiles in the same stroke.
#   material domain/blend/shading -> whether a capture-only stand-in could ever look right.
# Stand near a shielded enemy before enabling; shields stream in with their owners, so an empty
# result just means none were loaded (it re-sweeps as the object array grows, then stops). [dev build]
#scopeshieldcensus=0
# ---- THE SCOPE AS A GUN-MOUNTED OpenXR QUAD (scopelayer*) -------------------------------------
# Present the scope's render target through the COMPOSITOR instead of on the in-world pane, as a
# quad mounted on the gun. A composition layer is submitted after the whole post chain, so scene
# pre-exposure, the tonemapper and TAA/TSR never touch the one surface in this mod whose job is to
# be read. Reference design: Halo-MCC-VR's shipped zoom screen.
#
# EXPERIMENTAL AND DEFAULT OFF. At 0 nothing in this family runs -- one int test per tick -- and the
# pane behaves exactly as it always has. It also needs xrlayer=1 (it is, by default).
#   0 = off
#   1 = gun-mounted. Orientation comes from the aim ray, so the quad shows the SHOT LINE, not where
#       the weapon mesh points -- the same premise the capture camera is placed on.
#   2 = [dev build] SELF-CHECK: feed the layer the finished VIEW's own forward and up instead of the
#       aim ray's. The layer's UE->XR basis map then converts to identity, so the quad MUST render
#       exactly head-locked and MUST be indistinguishable from arm 3. If our vectors are in a frame
#       we did not think they were, this fails totally and obviously instead of as the near-zero-on-
#       axis error a handedness mistake makes. Needs xrlayer_view_basis() on the layer side; until
#       that lands the arm refuses and says so at the call.
#   3 = [dev build] CONTROL for arm 2: no orientation override at all, i.e. head-oriented.
#scopelayer=1
# Which compositor slot. 0 is the reticule, 1-8 the navpoint markers, 9 the pane slot that exists
# for exactly this. Anything else lands on a marker-sized atlas cell and the source is refused.
#scopelayerslot=9
# GEOMETRY, in CENTIMETRES like every other distance key here (UE's own unit, and the unit the layer
# takes). Defaults are Halo-MCC-VR's field-proven fit converted from metres: width 0.159 m, forward
# 0.050, right -0.058, up 0.216. Two things to know before treating them as fitted for THIS game:
#   * PHYSICAL size is the cm value divided by (100 x VR_WorldScale). At this game's 1.312 the
#     default width is 0.121 m, ~24% under MCC's 0.159 m -- multiply by the world scale to match
#     their physical fit. The log prints both numbers side by side with MCC's on every change.
#   * MCC's offsets are CONTROLLER-local and float a small screen just above the hand; ours are in
#     the AIM frame and our own pane is fitted well out in front (scopedist 63.6, scoperight 12.9).
#     Expect an in-headset fit to move these a long way.
#scopelayerwidth=30
#scopelayerfwd=64
#scopelayerright=13
#scopelayerup=0
# Does the quad ROLL with the weapon? 1 = yes (the lens's own up vector, perpendicularised against
# the aim axis -- no Euler decomposition, so no gimbal and no flip near vertical). 0 = world-
# levelled, which never cants. PAIR IT WITH scopecamlock, which decides whether the captured IMAGE
# rolls and ships at 0: scopelayerroll=1 with scopecamlock=0 rolls the screen while leaving the
# picture level, so canting the weapon appears to counter-rotate the image inside the quad.
#scopelayerroll=0
# 1 = hide the in-world pane and let the quad BE the scope, instead of drawing both. Gated on the
# layer actually presenting (source accepted AND the slot reporting ready), never on "we asked" --
# a refused layer must never leave you looking at nothing.
#scopelayerhidepane=1
# NOTE the atlas cell for the pane is sized from scoperes and can only be decided at layer bring-up.
# Changing scoperes mid-session logs "NOT IN EFFECT NOW" and applies at the next bring-up; toggle
# xrlayer 0 -> 1 to force one. Cells are SQUARE and a non-square target is refused, not letterboxed.

# =============================================================== AIM DRIVE (the shipping actuation)
# Which hand aims (right/left). Per-hand calibration files, left seeded by mirroring the right.
# HIDDEN FROM PLAYERS: currently inert in effect -- the newer subsystems do not honour it end
# to end, so it stays here until left-handed support actually works.
#aimhand=right
# How pointing becomes aim. Two writers doing different halves of ONE job -- treat them as one
# setting: blamangles writes the simulation's own aim state (1:1, and what co-op peers see);
# aimdirect assigns the local view so what you see is steady. Either alone is a downgrade (one
# without the other reads as heavy jitter). Both 0 = fall back to steering a virtual stick --
# the lever if a game patch ever breaks the direct path. Ctrl+Page Up swaps the pair live.
#blamangles=1
#aimdirect=1
# Freeze aim when the controller pose goes EMPTY -- position and both hand angles bit-exactly zero,
# which is what an OpenXR runtime hands back after the session drops out of FOCUSED (an overlay
# opened, a level load stalled frame submission, or the window left the foreground). UEVR still
# reports success for that pose, so without this the direct write assigns aim to wherever identity
# points: measured as a 76 deg slam, then held for the 3m38s the session stayed unfocused. Look for
# "AIM FROZEN" in the log; it releases on its own. Leave this at 1. It is a key only so a misfire
# can be ruled out live -- if aim ever freezes while your hands are visibly tracking, set 0 and
# report it, because a real pose should never be bit-exact zero in all three at once.
#aimfreezelost=1
# Persist the located rotator across launches (halo_vr_aimcache.txt next to this file, keyed to
# the exe's build stamp): a relaunch on the same game build warm-starts through the normal hint
# validation instead of paying the watch hunt. The re-arm log names which cached anchor
# validated (pc-relative vs absolute). 0 = never read or write the cache. Deleting the file is
# always a safe reset -- it is a cache, not configuration.
#aimcache=1
# RUNG 1 -- resolve the aim rotator by DERIVATION instead of hunting it: walk
# PC+0x318 -> +0x3C8 (the owning object) -> +0x1C0 -> +0x20. Microseconds, no hardware
# watchpoints, no thread suspension, and no waiting for the player to move. The candidate still
# has to match the real aim before AND after the aim moves, so a patched struct offset falls back
# to the watch hunt rather than writing anywhere odd. Look for "resolved by CHAIN" in the log.
# 0 = skip the chain, which is both the live A/B and how the watch path stays exercised.
#aimchain=1
# Yaw sign of the simulation write. Flip to 1 only if aim mirrors left/right for the HOST in
# co-op while looking correct locally -- that asymmetry is this knob's one symptom.
#blamanglesysign=-1
# LAYOUT GUARD on the simulation write, 1 = on (the shipped default), 0 = off. UNLIKE the research
# keys in this file, this one is live in every build.
# The mod finds the aim function by SHAPE, so it survives the function moving. Nothing in that
# checks the STRUCT OFFSET it then writes through: if a patch moves the aim field a few bytes, every
# check still passes and the mod stamps aim into whatever now occupies the address. So before arming
# the write it watches whether that field tracks the game's own aim (~25 deg of looking around while
# neither aim driver is writing), and refuses to arm if it does not -- aim falls back to the stick
# loop and the log says WRONG OFFSETS.
# Costs a brief unarmed window when a level starts. What you SEE is unaffected: aimdirect owns the
# local view independently. Set 0 if the guard ever misjudges a build; that restores the old
# always-write behaviour, and it is the A/B to confirm the guard is what changed.
#blamlayout=1
# Recompute aim at input-sample rate (90+ Hz) instead of the ~32 Hz engine tick.
#aimrate=1
# Aim origin: 1 = standing origin (head motion does not move aim), 0 = HMD position.
# With hmdleash=0 the standing origin is no longer a body reference, so 1 uses the head anyway.
#aimorigin=1
# Sightline length in CENTIMETRES (hand translation contributes to aim, not just rotation).
# Was metres before 2026-08-12; a value under 50 is read as legacy metres and scaled, once, loudly.
# ONLY THE FALLBACK RANGE once aimconverge is on -- see below, which measures the range instead.
#xdist=1000

# ---- 6DoF AIM CONVERGENCE
# Aim at the point the reticule's trace HITS, rather than in a direction that is only correct at one
# assumed range. Shots leave from the game camera while you sight from your eye; those are parallel
# but displaced, so a commanded direction alone cannot land on a target at an arbitrary distance.
# Supplying the measured range makes it land. Needs aimreticuletrace, which is where the range comes
# from -- turning that off turns this off.
# NO EFFECT while the head is leashed: the eye and the camera coincide, and the correction declines
# to act below aimconvergemin. This exists for hmdleash=0.
#aimconverge=1
# Smoothing on the measured range, ms. The correction goes as 1/range, so sweeping off a near crate
# onto a distant wall is a STEP in aim; this makes it a glide. Longer reads as aim lagging when you
# change target, shorter and the sweep pops.
#aimconvergetau=120
# Eye-to-camera divergence below which nothing happens at all, cm. Keeps the leashed default
# numerically identical rather than merely nearly so.
#aimconvergemin=3
# Sanity rail on the bend, degrees. Past this the range or the offset is wrong, not the geometry.
#aimconvergemax=30
# Log the offset, the range and the resulting bend every N ticks. 0 = off. [dev build]
#aimconvlog=0
# Measure the game's actual turn rate and adapt the loop (tracks in-game sensitivity).
#gainadapt=1
# VIEW LOCK: cancel aim-induced yaw in VR space so aiming does not drag the head. 0 = the old
# behaviour (aiming turns the view). Structural to the whole control scheme -- not a preference.
#viewlock=1
# Ctrl+<key>: swap direct aim drive <-> steered fallback live (rig mode included). 0x21 = Page
# Up. The A/B lever for the actuation pair; findable by feel in the nav cluster.
#modekey=0x21

# =============================================================== AIM ACTUATION RESEARCH
# aimsrc has been REMOVED. It offered the GRIP pose as a "roll-invariant" aim source; 27,826
# measured samples say the opposite, so keeping the option would send the next reader the wrong
# way. Grip forward is steeply pitched -- mean 41.5 deg, past 60 deg in HALF of all samples -- so
# its yaw is an atan2 over a tiny horizontal projection and swings ~1.08 deg per degree of roll.
# The aim pose is near-level (mean 7.7 deg, past 60 deg in 0.3%) and moves ~0.19 deg/deg.
# Switching sources would have multiplied the coupling about fivefold.
#
# The residual ~0.19 deg/deg is real and physical: the aim pose's forward axis is not the axis your
# wrist rolls about, so rolling sweeps it around a cone. Fixing it needs a roll-invariant
# CONSTRUCTION, not a different pose -- see aimrollfix below.
#
# Log the roll->aim coupling every N calls, 0 = off. [dev build]
#aimrolllog=0
# Direct-path axis signs: +1 writes the setpoint, -1 mirrors about the calibration reference.
# Settled by live experiment; the stick path is unaffected.
#aimdirectsignx=1
#aimdirectsigny=1
# Also write the quaternion the Euler aim derives from. Measured WORSE (a deeper resync
# overwrites it and tracking is lost); kept because it is the correct place to write IF that
# deeper store is ever found and neutralised.
#aimquat=0
# Write the quaternion SOURCE field -- the one level where a resync could land on our value
# instead of reverting. Candidate fix for aim snapping back on firing.
#aimquatsrc=0
# Alternate the emitted stick value by one raw LSB per frame so the exe's change-gated input
# poll always dispatches it. Not yet measured live.
#stickdither=0
# 0 = drive yaw only; pitch stays on the HMD / game default.
#pitch=1

# =============================================================== FALLBACK STICK LOOP (plant + tuning)
# Only active when blamangles=0 / aimdirect=0 (the steered-stick fallback).
# Deadband in degrees: errors below this park the stick instead of hunting.
#dead=0.50
# Velocity feedforward. 0 = off; raise toward 1.0-1.2 if fast sweeps lag the hand.
#ffgain=0
# Damping against overshoot / rubber-banding after fast turns.
#dgain=0.40
# Smoothing TIME CONSTANTS in ms: ffsmoothms filters the target rate (costs responsiveness --
# keep small); dsmoothms filters the measured rate damping works from (nearly free; raise it
# if the stick buzzes at rest).
#ffsmoothms=16
#dsmoothms=31
# Stick deflection the game starts responding to (measured ~0.24 on this title).
#floor=0.28
# Aim error in degrees that saturates the virtual stick.
#full=6.0
# Ceiling on deflection. Keep 1.0: the response curve is steeply exponential and the top of
# the range is where large corrections actually close.
#max=1.0
# Deadband hysteresis (Schmitt trigger): once moving, re-park only below dead*deadhyst.
# 1.0 = no hysteresis. Kills threshold chatter kicking the yaw stick during pitch sweeps.
#deadhyst=0.5
# Scale yaw feedforward by cos(pitch): removes the projection-artefact yaw noise injected by
# steep pitch, without touching genuine horizontal tracking.
#ffpitchcomp=1
# Full-deflection turn rate, deg/s, anchoring the measured plant curve to the configured
# sensitivity. 363.6 measured at LookSensitivity90 / deadzone 0 / acceleration min.
# 0 = estimate live from the adaptive gain (serviceable but coarse).
#plantfulldps=363.6
# Pin the plant gain (deg/s per unit of stick) instead of measuring live; also makes the plant
# constant across a tuning run. ~226 measured on this title. 0 = measure.
#measrate=0
# Starting plant gain before anything is measured (0 = built-in reference). Writing a NEW
# value mid-session resets the learned gain and re-converges -- the deliberate way to
# reproduce the startup transient.
#gainseed=0
# Closing profiles (each 0 = off; they supersede the legacy linear error->deflection map):
#   aimtau      close ~63% of remaining error per tau seconds (cannot go below loop latency)
#   aimdecel    constant-deceleration arrival, deg/s^2 (crisp stop; tune on sweep-stop)
#   aimdeadbeat >0 = per-tick closing factor, 1.0 = true deadbeat (valid because the plant
#               measured memoryless 2026-08-06). Loses tau's tremor filtering -- smooth the
#               TARGET instead (aimtargetsmoothms).
#aimtau=0
#aimdecel=0
#aimdeadbeat=0
# Smoothing time constant in ms applied to the controller angles the loop chases. Costs target
# latency, not convergence speed. Try 20-40 if aim reads jittery in-headset.
#aimtargetsmoothms=0
# Report mean/max |yaw error| every N ticks, 0 = off. [dev build]
#aimstat=0

# =============================================================== BLAM SIM RESEARCH  [dev build]
# The diagnostics that located the aim solution; docs/BLAM_AIM_FINDINGS.md (private research
# tree) records the campaign and the refuted paths. All of these exist only in dev builds.
# One-shot: resolve the Blam object table and report which object's field matches the aim.
# Higher stages are redirect probes.
#blamaim=0
# Trim on the redirected shot direction, degrees (calibration + causality test, blamaim>=3).
#blamyaw=0
#blampitch=0
# Dump the head of projectile spawn params (first 40 spawns) -- locates the shooter field.
#blamdump=0
# Dump a Blam object's float fields by handle (~0.7 Hz), and how many bytes of it (the aim
# state sits past 0x200).
#blamobj=0
#blamobjlen=0x200
# One-shot: find the player's Blam object by matching a spawn's muzzle origin.
#blamfind=0
# Aim-field sweeps -- unit-vector scan / scalar Euler scan / sim-module writable globals.
# 1 = collect at this pose, 2 = verify after moving the aim.
#blamscan=0
#blamscan2=0
#blamscan3=0
# Log the base direction handed to the spread function vs ControlRotation (needs the write
# paths off, or it reads our own value back).
#blamnode=0
# BLAMCTL report cadence, writes between log lines, 0 = off. Prints commanded vs achieved vs
# record read-back at one instant -- the reticle-vs-shot divergence instrument. Parsed in
# every build; the report itself is dev-only.
#blamctllog=4000
# FAULT INJECTION -- bitmask. Breaks one rung of the address-resolution cascade ON PURPOSE so the
# rung BELOW it can be watched doing its job. Unlike every other key in this file this one is
# compiled out of the release DLL entirely, so in a shipping build it does nothing at all: it is
# for contributors running Scripts/Build-AimDriver.ps1, not for players.
# Why it exists: the fallbacks only ever run when a game patch has already moved something, i.e.
# never on a working machine. Untested recovery code is a guess. Injecting the fault is the only
# way to see the recovery actually recover -- it is how the watchdog's countdown was found to be
# 64x too slow to ever fire (it counted ~2 s ticks as if they were frames).
#   0x001 hook installs but is NEVER CALLED -> watchdog rules it dead, TEB scan takes over.
#         Must be set before the game starts; the hook-ran flag latches for the session.
#   0x002 getter signature matches nothing   -> falls back to the recorded RVA
#   0x004 getter signature matches twice     -> ambiguous, refuses it, falls back to the RVA
#   0x008 _tls_index sits at a different RVA -> "BUILD DIFFERS" (patch / other store's binary)
#   0x010 signature and recorded RVA disagree-> "getter MOVED", trusts the signature
#   0x020 PE TLS directory unreadable        -> sim aim write DISABLED, never aimed at a guess
#   0x040 announce the periodic re-resolve   -> normally silent unless the answer changed
#   0x080 corrupt AimDirect's cached offset  -> hint rejected, falls through to the watch
#   0x100 AimDirect locate always fails      -> gives up after 5 attempts, back to the stick loop
#   0x200 freeze the layout guard's field    -> the offset landing on something DEAD; the guard
#         must refuse to arm the sim write. Needs aimdirect=0 to have a sampling window.
#   0x800 read the aim ONE FIELD LATE        -> the offset landing on the NEIGHBOURING field, which
#         is what a patch that inserts a struct member actually does. This is the realistic failure
#         and the more important of the two: the neighbour moves just as much as the field we
#         wanted, so a check that only asks "does it move?" passes it. The guard compares VALUES
#         against the game's own aim, so it sees a ~139 deg disagreement instead. Same aimdirect=0
#         requirement.
#   0x400 starve AimDirect of evidence       -> nothing is ever caught, so each stage must run out
#         its ~24 s clock and take the TIMEOUT branch. Different path from 0x100, which lets a
#         candidate be found and then rejects it (fast, never reaches the timeout code).
# Combine freely (0x00C = 0x4|0x8). Scripts/Verify-BlamSignature.ps1 checks the signature offline
# against a patched exe without launching anything.
#blamfault=0

# =============================================================== MEMORY & TRACE TOOLS  [dev build]
# Aim-loop trace recorder: 0->1 arms, 1->0 writes halo_vr_trace_NNN.csv beside this file.
# Lag and jitter feel identical in a headset and separate trivially in a trace.
#aimtrace=0
# Heap value scan for Blam-side data that reflection cannot reach: comma-separated float
# signature, hit cap (0 = 512), then 0->1 starts one background scan.
#memscanvals=
#memscanmax=0
#memscan=0
# Differential scan: 1 snapshot, 2 changed-blocks -> candidates, 3+ narrow, 0 clear.
#memdiff=0
# AIMDIG: 0->1 with aimdirect resolved runs ONE off-thread derivation-chain report for the aim
# rotator (allocation census, exe-data static-root scan, pointer-graph walks from the sim TLS
# block and the quat-source object). Compare the AIMDIG lines across two launches: whatever stays
# constant is a per-launch anchor that could replace the watchpoint hunt. [dev build]
#aimdig=0
# Hardware write-watchpoint: logs the distinct instructions writing ControlRotation.Yaw, then
# auto-disarms. addr 0 = derive from the live PlayerController.
#aimwatch=0
#aimwatchaddr=0

# =============================================================== WEAPON RIG INTERNALS
# Master switch: drive the first-person arms/gun from the controller. 0 = the game's own weapon
# pose (aim itself still works).
#rig=1
# Drive the shield/overshield glow shell with the arms (0 leaves it where the game puts it).
#shell=1
# Visibility preferences, HIDDEN FROM PLAYERS until they hold in all scenarios; promote back to
# the user catalog once they do. showarms=0 hides the first-person arms at all times while
# keeping the attached weapon visible (the weapon subtree is re-shown via its root component
# after the propagated hide). showweapon=0 hides the weapon actor too (SetActorHiddenInGame --
# independent of the bVisible tree, so the two compose).
#showarms=1
#showweapon=1
# Frame of the rig's relative transform: 0 = aim error, 1 = absolute, 2 = parent-relative,
# 3 = DIRECT DRIVE (default) -- weapon held rigidly by the controller, pivot MEASURED rather
# than folded into the mount. Pairs with aimdirect; Ctrl+PageUp swaps both live.
#rigmode=3
# rigwoffhold -- does the RENDER path honour the position-dead origin-hold?
#
# When the runtime stops publishing controller TRANSLATION (exact 0,0,0 -- happens on OpenXR focus
# loss), position_dead arms and the tick path pins the rig to its origin. But the render path in
# on_pre_calculate_stereo_view_offset re-derives location every FRAME from g_rigw_off_*, and it did
# not check that hold -- so it would write the ~1.5 m phantom offset the hold exists to avoid.
#
#   1 (default) = honour the hold. Arms keep ROTATION (still live during a position-only outage)
#                 and do not translate. Reads as "arms frozen, bullets still follow my aim".
#   0           = write the offset anyway. This is the UNGUARDED behaviour, kept switchable because
#                 the guard was reasoned from code and nobody has yet WATCHED the failure it
#                 prevents. Set 0 to see it; it is live, so you can flip it mid-outage.
#
# While an outage is live the log prints a rate-limited RIGHOLD line with |off| in cm, so the
# question "how far would the arms actually have gone" has a number rather than an impression.
#rigwoffhold=0
# Drive translation as well as rotation.
#rigloc=1
# cm of rig movement per metre of hand movement. MUST include UEVR's world scale: the shipped
# profile runs VR_WorldScale=1.312, so a plain 100 under-translates ~24% and reads as BOTH
# "translation feels slow" AND "the pivot is off".
#rigscale=131.2
# Per-axis clamp on rig translation, cm. 0 = none -- a saturating axis rotates the offset
# vector, corrupting direction, not just reach.
#rigclamp=0
# Anchor hand translation to the body -- the STANDING ORIGIN, as UEVR's own controller
# attachments do -- rather than to a raw room point. 0 drops the anchor entirely (A/B only).
#riganchor=1
# Sign of the room->game view-yaw correction: 1 = apply, -1 = negated, 0 = off.
#rigviewyaw=1
# Subtract a captured neutral from the hand offset (displaces the rotation centre; A/B only).
#rigneutral=0
# Sign of the snap/smooth-turn correction in the rig frame, and separately for the aim
# mapping -- the two frames' sign conventions are independent, one in-headset A/B each.
#rigturn=1
#aimturn=1
# Re-apply the rig rotation at render rate (removes the ~14 deg inter-tick sawtooth felt as
# arm shake during aim turns).
#rigrender=1
# Write a constant Z offset of this many cm instead of tracking -- one unambiguous test of
# whether the write lever works at all. 0 = normal tracking.
#rigtest=0
# 0 = our rig driver writes the transform; 1 = hand the arms to UEVR's own UObjectHook
# motion-controller attachment (persistence stays ours either way).
#attachmode=0
#attachpermanent=0

# ---- Pivot tools. The pivot VALUES (pivauto, pivx/y/z) are calibration data in halo_vr.cfg.
# Which socket estimates the pivot before a second calibration sample measures it.
#pivsocket=PrimaryWeapon
# Manual nudge ADDED to the auto-read pivot, cm, component-local.
#pivadjx=0
#pivadjy=0
#pivadjz=0
# Pivot markers: shrink the rig itself onto the pivot (pivviz, at pivvizscale); debug-sphere
# radius in cm (pivdraw; inert in shipping builds); borrowed level prop parked on the pivot
# (pivcube, works where DrawDebug does not) scaled to pivcubescale cm.
#pivviz=0
#pivvizscale=0.05
#pivdraw=0
#pivcube=0
#pivcubescale=6

# =============================================================== MOVEMENT FRAME
# Rotate the left stick into the view frame so push-forward = walk where you look. 1 = apply,
# -1 = negated (measured correct on this title), 0 = off.
#moverot=-1
# View-yaw source for that frame: 0 = UEVR's post-stereo rotation, 1 = rebuilt as
# pinned + turn + HMD yaw.
#movesrc=0
# Where the aim term is sampled: 0 = tick-latched, 1 = live head + smoothed aim, 2 = live
# head + commanded aim, 3 = live head + SAMPLED aim (same call, no publication lag; default).
# Older configs said 4 -- every test is >=, so 3 and 4 behave identically.
#movelive=3
# Per-tick smoothing of the aim term, 0 = off. 0 is right for movelive=3: view and aim are
# sampled in the same call, so there is no inter-source lag left to damp.
#movesmooth=0
# Log the movement-frame residual every N applications, 0 = off. [dev build] The residual's
# SHAPE is the diagnosis: transient-and-settling = sampling lag; persistent and proportional
# to hand rotation = wrong frame or gain; ~0 while the walk still bends = the sim does not
# move in the aim frame at all.
#moveresid=0

# =============================================================== RETICULE INTERNALS
# What the reticule ray is built from: 0 = the GAME's aim -- truthful, shows the loop residual,
# USE THIS WHEN TUNING AIM. 1 = the controller setpoint -- smooth, but it lies exactly when the
# loop is impaired (auto-falls-back whenever the aim law is not armed).
#aimreticulesrc=0
# Divergence guard for src=1: snap back to the true aim once the gap exceeds divdeg degrees
# continuously for divms ms (releases at half divdeg -- hysteresis, cannot flap).
#aimreticuledivdeg=8
#aimreticuledivms=600
# Trace internals: collision channel (ETraceTypeQuery index; 1 = Camera, the shipping choice --
# ignores the invisible blocking/trigger volumes that 0 = Visibility hits) and how far to look
# for a surface at all, cm.
#aimreticuletracechannel=1
#aimreticuletracemax=15000
# Motion gate for the reticule smoothing filters, deg/s of controller swing: full strength at
# or below slow, none at or above fast (smoothing helps a still hand, only lags a sweep).
#aimreticulesmoothslow=20
#aimreticulesmoothfast=120
# Publish the aim ray as a Lua event for an external uevrlib-based script. No such script
# ships; with nothing listening it formats a JSON payload ~26x/s for no consumer.
#aimreticulelua=0
# Borrowed-level-prop marker (removes set dressing from the map; diagnostic) and its size, cm.
#aimreticulecube=0
#aimreticulecm=12
# Collapse the game's OWN flat crosshairs other than the hosted one -- mission transitions
# rebuild the HUD and paste a screen-space crosshair over the world-space one.
#aimhidenative=1

# =============================================================== CROSSHAIR WIDGET DIAGNOSTICS
# UMG draw size (square, px) and EWidgetBlendMode (0 opaque, 1 masked -- eats thin crosshair
# lines, 2 transparent).
#aimwidgetdraw=256
#aimwidgetblend=2
# Build our own translucent MID and bind the render target to it, instead of the stock
# pass-through material (the stock material + gain/tint is what ships).
#aimwidgetmat=0
# Adds 180 deg of yaw if the crosshair ever renders mirrored or edge-on.
#aimwidgetflip=0
# Extra alpha multiplier on the sampled widget.
#aimwidgetalpha=1.0
# Paint the widget quad's background opaque red. One run separates three causes: red+crosshair
# = fixed; red only = content not reaching the target; nothing = the quad is not rendering.
#aimwidgetbg=0
# Host a freshly created reticle instead of the HUD's live one (loses the hit marker;
# isolates re-parenting from component setup).
#aimwidgetfresh=0
# Host a DIFFERENT widget class by name substring (empty = the first-person reticle). A
# plainly-coloured widget rendering in colour proves the framework and indicts the reticle's
# own material.
#aimwidgetclass=
# Use the hosted widget's render target as the mesh reticule's texture -- shows the widget's
# TRUE pixels through a material that provably passes texture RGB. [dev build]
#aimrtwidget=0
# One-shot sweeps: cooked materials overriding a texture parameter AND exposing a colour
# (texhunt); cooked game materials with a colour parameter (mathunt); parameter-dump the
# comma-separated material paths (matdump). [dev build]
#texhunt=0
#mathunt=0
#matdump=
# Exact texture parameter name to bind the reticule texture under (from texhunt/matdump;
# empty = the candidate list), and a Texture2D object path to probe (empty = candidates).
#aimtexparam=
#aimtexpath=
# ---- Ring reticule plumbing (the ring's player-facing toggles/size/colour are in the user
# catalog). Which cooked GAME assets the ring is built from -- if a game patch moves or strips
# either path the ring stops appearing (log.txt shows the load failing); point aimmeshparent at
# another material, or rely on the hosted-widget crosshair. See docs/TROUBLESHOOTING.md.
#aimtex=1
#aimmeshpath=StaticMesh /Game/FX/Meshes/Primitives/Torus/SM_Torus_ThinDense_01.SM_Torus_ThinDense_01
#aimmeshparent=/Game/FX/Meshes/Debug/Materials/MI_Arrow.MI_Arrow
# Unlit pass-through keeps the ring readable against dark geometry.
#aimmeshunlit=1
# Ring orientation offset (the torus axis must face the viewer).
#aimtexrotp=-90
#aimtexroty=0
#aimtexrotr=0
# 0 = keep the ring mesh asset's own material instead of the override family.
#aimmeshmat=1
# Runtime-generated render target as the reticule texture (solid-fill proof of path), and its
# size in px.
#aimrt=0
#aimrtsize=128
# Park the mesh reticule on the VIEW axis, dead centre of frame, for automated measurement
# runs (an off-frame quad reads all-zero, indistinguishable from a real negative).
#aimparkview=0

# =============================================================== DEBUG DRAW (inert in shipping game builds)
# DrawDebugSphere reticule. UE compiles DrawDebug* out of shipping builds, so on this game the
# call succeeds and draws NOTHING -- kept for builds where it works.
#aimdraw=0
# Radius (cm at reticule distance), segments, seconds per draw (must exceed the ~31 ms tick or
# it strobes), line thickness, RGB 0-1.
#aimdrawr=5
#aimdrawseg=16
#aimdrawdur=0.05
#aimdrawth=3
#aimdrawcr=0.1
#aimdrawcg=1.0
#aimdrawcb=0.2

# =============================================================== FLAT-HUD RETICLE (legacy lane)
# Steer the game's own screen-space reticle via its UMG render translation instead of hosting
# a world-space widget. Superseded: the flat HUD quad spans only +/-20.7 x +/-12.0 deg while
# aim offsets reach 27 deg. Kept as a fallback. (hudhide lives in halo_vr.cfg.)
#hudfollow=0
# 1 = engine projection for the offset; 0 = the hudk * tan(angle) constant, clamped at hudmax
# px so a snap turn cannot fling the reticle off-canvas.
#hudproject=1
#hudk=1000
#hudmax=700
# Write FVector2D as float instead of double if a build ever misreads the UE5 LWC type (the
# symptom is the reticle jumping to a nonsense position).
#hudfloat=0
# Degrees subtracted from the measured offset -- trims a constant frame bias by observation.
#hudtrimyaw=0
#hudtrimpitch=0

# =============================================================== DISCOVERY DUMPS (one-shot)
# Log MeteoriteHudVisibility's properties (per-element HUD switches) / live widget classes
# with menu-ish names (corrects the menu match list from observation).
#huddump=0
#menudump=0

# =============================================================== STICK MODE & MENU DETECTION
# The machinery behind the automatic gamepad-controls switch; the player-facing recourse
# (`stickforce`) lives in the user catalog.
# Master switch for stick mode itself. 0 = motion aim stays on everywhere (vehicles become
# near-unplayable; A/B only).
#stickmode=1
# 0 = auto-detect, 1 = always stick mode, 2 = never. The field lever when the detector misses
# a seat (get the seat reported).
#stickforce=0
# Detector debounce, seconds: no-weapon must hold this long to enter; weapon back this long to
# leave. Raise stickon if weapon swaps ever false-trigger stick mode.
#stickon=0.75
#stickoff=0.05
# Keep motion aim while ON FOOT with no weapon (the campaign opens unarmed; "no weapon" is also
# what a vehicle seat looks like from outside). 0 = the pre-fix behaviour, and the fallback if
# a seat or scripted sequence ever keeps hand-aim engaged when it should not.
#stickonfoot=1
# Hide the empty T-POSED arms while on foot unarmed. Players must never see the T-pose, so this
# is not a player option -- 0 is the lever for arm-IK development, when seeing the unarmed arms
# is the point.
#hidearms=1
# Menu handling: suppress the gameplay-only remaps while a menu is up, and use the widget-based
# menu detector (pause menus keep the gameplay PlayerController, so the frontend test alone
# cannot see them).
#menusuppress=1
#menudetect=1

# =============================================================== CUTSCENE FLATTEN (unverified)
# Hidden from players until it works. Cutscenes are pre-rendered videos, doubled in raw stereo.
# 0 = off (shipping). 1 = UEVR's flat 2D Screen Mode for the scene -- on SteamVR's OpenXR
# runtime the screen may not composite in-headset (the desktop mirror always works, and the
# hint overlay says so in VR). 2 = mono collapse: fuses the world, not the movie. A grip
# squeeze force-releases a stuck flatten.
#cutscene2d=0
# The cutscene picture itself (cutscenemono / cutscenesize) is a PLAYER setting now -- see
# halo_vr_user_reference.txt. Modes 1-4 of cutscenemono are the diagnostics that found the fix
# (1/2 left/right image to both eyes, 3 drop UEVR's UI quad, 4 drop the projection).
# Convergence depth of the mode-5 picture, cm. 0 = match UEVR's UI_Distance, where the subtitles
# and pause menu are -- the only value at which nothing doubles. Anything else is an experiment.
#cutscenedist=0
# DEV BUILDS ONLY, one-shot: 1 during a cutscene writes the side-by-side eye render as a BMP
# into data\ (~36 MB) and logs the path; set back to 0 to re-arm.
#cutscenedump=0
# The in-VR hint overlay (cutscene_hint.png): on/off, then cm from the head: ahead, drop, width.
#cuthint=1
#cuthintdist=180
#cuthintdrop=75
#cuthintw=110

# =============================================================== VEHICLE BRAKE DELIVERY
# How the grip hard brake reaches the game; the player-facing on/off (`brake`) stays in the
# user catalog. Field-tested 2026-08-01: synthesized keyboard does NOT reach this title's
# driving input, so the pad path is the shipping route.
#   3 = press the pad button in brakemask (0x1000 = A, this game's vehicle hard brake) - DEFAULT
#   2 = pull the left stick full back while gripping (this game reads it as reverse)
#   1 = hold the keyboard key in brakekey (does not reach this title's driving - reference only)
#   0 = off
# Master on/off for the grip hard brake.
#brake=1
#brakemode=3
#brakemask=0x1000
# Windows virtual-key code for mode 1. 0xA2 = Left Ctrl.
#brakekey=0xA2

# =============================================================== GAME SENSITIVITY PINNING
# Settings applied only WHILE MOTION AIM DRIVES; the player's own values return in stick mode
# and nothing is written to disk. The aim loop wants max look sensitivity / min deadzone
# (they are its authority ceiling and smallest step); a human driving a Warthog wants neither.
# EBlamLookSensitivity index (x5 = the menu's number; 18 = "90"). 0 = leave the player's.
#vrsens=0
# Look deadzone as a PERCENTAGE (the game's own unit). Negative = leave the player's.
#vrdeadzone=-1
# EBlamLookAcceleration index. 0 (minimum) is REQUIRED for any plant inversion to be valid;
# -1 = leave the player's.
#vraccel=-1
# Software compensation while in STICK MODE for the pinned-high sensitivity: scale the
# player's look stick, and re-impose a deadzone the game no longer applies.
#stickscale=1.0
#stickdz=0

# =============================================================== SESSION / HARNESS
# THE KILL SWITCH. enabled=0 stands the whole driver down on the next tick: stick neutral, view
# lock and remaps released, stereo continues. Deliberately NOT a player option: with motion
# controllers in hand there is nothing left to aim with (it does not fall back to a
# native-gamepad-aim profile), so it only confuses -- it exists for support and testing.
# Ctrl+Home toggles it live (game window must be focused).
#enabled=1
# The Ctrl+<key> kill-switch hotkey, virtual-key code. 0x24 = Home; 0 disables the hotkey.
#killkey=0x24
# Require is_hmd_active() before driving. 0 for headless runs under a null/simulated SteamVR
# driver (SimVR), which reports the HMD inactive regardless.
#requirehmd=1
# Raise UEVR's motion-controls inactivity timeout at startup (prevents the "suddenly 3DoF until
# a button press" pose freeze). 100 = the slider maximum; 0 = leave UEVR's setting alone.
#vrinactivity=100
# Edge-triggered: write any NEW number to re-capture the neutral where your hand is right now
# (a sticky boolean cannot work in a file re-read every 2 s).
#recenter=0
# Edge-triggered: force a full view-lock re-prime from the CURRENT camera yaw -- reproduces
# the mid-mission-injection state from an ordinary menu-injected session. [dev build]
#lockreprime=0
# Scenario marker echoed into RIGTRACK log lines so a measurement harness can label poses
# instead of correlating by wall clock. [dev build]
#dbgmark=0

# =============================================================== VIEW-CONSUMER FIXES (experimental)
# Aim steers the game's camera; the view lock cancels that for the EYES only. The audio
# listener and the screen-space waypoint projection still read the game camera, so both are
# wrong by the aim-vs-view delta on foot -- and already correct in vehicles, where the lock
# stands down. Both fixes engage only while the lock is cancelling and RELEASE on stick mode /
# frontend / kill switch. Experimental: promote to the player catalog once a headset session
# confirms each one.
#
# Drive the audio listener to the rendered view (SetAudioListenerOverride via reflection).
# SETTLED 2026-08-12: resolves and applies on this build but does NOT move what Wwise hears
# (panning kept tracking the controller with it engaged). Kept because it may cover UE-side
# non-Wwise sounds; the real lane is audiocomp below.
#audiofix=0
# Drive the game's OWN listener -- the HaloAudioListenerComponent on BP_BlamCameraManager_C,
# found by the audiodump survey -- to the rendered view (world write per tick; the authored
# relative transform is restored on release, so vehicles/cutscenes hear exactly as shipped).
# Watch for "AUDIOCOMP: listener resolved/DRIVEN"; judge by ear with the controller held still
# and the head turning -- panning should now track the head and ignore the hand.
#audiocomp=0
# One-shot survey of Ak/Audio/Listener/Wwise objects (edge-triggered: change the value to
# re-run; 0 disarms). Finds the live Wwise listener component for the fallback lane. [dev build]
#audiodump=0
#
# Shift the game's screen-space navpoint/waypoint layer back onto the rendered view.
# First-order: exact at the view centre, approximate off-centre; edge-clamped off-screen
# markers will still sit wrong. Watch for "NAVFIX: N navpoint container(s) resolved" -- 0 with
# navfix=1 means the navclass guess below is wrong (menudump=1 lists live widget names).
#navfix=0
# Widget class-name substring collected as the navpoint layer (pak-inventory guess, unconfirmed).
#navclass=WBP_Navpoints
# 1 = derive the shift from the game's own projection (no constant to calibrate);
# 0 = navk*tan(delta) fallback, dial navk in by observation (same meaning as hudk).
#navproject=1
# 1 = apply at render rate from the stereo callback, yaw-only, with the projection probe
# demoted to calibrating pixels-per-tan (the tick-rate writer lagged the delta and read as
# jitter -- player-tested). 0 = the old tick-rate direct write, kept for A/B.
#navrender=1
#
# WORLD-SPACE NAVPOINTS -- the lane with no angular ceiling (the flat HUD quad spans only
# ±20.7°×±12°, so no screen-space math can pin a marker on an enemy 30° off-centre). One unlit
# mesh marker per live navpoint, placed along the world direction recovered by inverting the
# game's own projection (self-calibrating; watch "NAVWORLD: N marker(s) world-placed").
# Supersedes the navfix shift while on -- the flat layer stays game-native beneath it. Markers
# the game already edge-clamped (its off-screen arrows) carry no recoverable direction and are
# skipped; the flat layer's arrows still cover those.
#navworld=0
# PLACEMENT: exact direction, managed distance. The objective's TRUE world position is known
# (navworldsrc=2), but drawing the marker AT it buries it behind terrain and shrinks it to a
# speck at range -- so it is drawn along the true direction at min(true, navworldmax), pulled in
# front of intervening geometry by a trace, with apparent size held constant. Direction (the
# information) stays exact; the range it is drawn at is not meant to be readable.
# 400 cm: drawing CLOSE is what makes occlusion a non-problem. A single trace ray only clears
# what that ray hits -- a vehicle beside it or a rock lip under it still occludes a quad that has
# width -- so the marker rides 4 m out along the true direction, where almost nothing can get in
# front of it, at constant angular size. Raise it if markers start feeling detached from depth.
#navworldmax=400
#navworldtrace=1
# Stand-off from a traced surface: the larger of this and 20% of the hit distance.
#navworldsurf=60
# The widget class each marker hosts; empty = WBP_NavpointObjective_C. That one is authored for
# a HUD canvas (icon PLUS distance/label block) so it frames oddly hosted alone -- a bare name
# is enough to A/B the alternatives live: WBP_NavpointWidgetPlayer_C, WBP_TrackedTargetNavpoint_C,
# WBP_NavpointWidgetBase_C, WBP_NavpointDestination_C. The creation log prints the widget's
# desired size and the draw size actually used.
#navworldclass=
# Draw size px for the hosted quad (0 = 128).
#navworlddraw=0
# PHANTOM-MARKER GATE (BUG 2). The compositor lane resolves navpoints straight from the manager
# map and used to draw every entry with a valid world position -- including ones the game's own
# flat HUD had collapsed, which surfaced as objective/item markers floating over walls while the
# live enemy marks were correct. This gate reads each entry's live widget and honours its Slate
# Visibility, so only navpoints the game is showing are drawn. It FAILS OPEN (an unreadable widget
# or missing property draws), so it can only ever suppress a marker it can prove the game hid.
#   1 (default) = gate on reflected UWidget::Visibility (hide Collapsed/Hidden)
#   0           = off: draw every resolved entry (the pre-fix behaviour, for A/B)
#navworldvisgate=3
# STOPGAP kind filter -- a fallback for if the visibility flag ever cannot be resolved, NOT the
# primary gate. 0 (default) = draw all kinds. Otherwise a bitmask of NavwKind bits to ALLOW:
# 1=other 2=objective 4=ally 8=enemy 16=item. e.g. 0x0C = enemy+ally only (drops the two
# phantom-prone kinds), 0x08 = enemy only. Hex or decimal.
#navworldkindmask=0
# PER-KIND SIZE, multiplying navworldscale. Kind comes from the navpoint's own widget class, so
# it follows the game's typing: an objective should read from across the level, a last-known
# enemy mark is situational, a floor weapon should not compete with either.
#navsizeobj=0.8
# Co-op partners / allies. A PLACEHOLDER, not a measured preference -- co-op has not been played
# through this. Above enemy because a partner marker is navigational rather than situational.
#navsizeally=0.17
#navsizeenemy=0.25
#navsizeitem=0.2
# Unclassified navpoints. Defaults to the objective size deliberately: an unknown kind drawing
# LARGER than every known one is the wrong failure. If the log shows [kind=other] on something,
# tell me the class name and it gets classified properly.
#navsizeother=0.8
# PER-CLASS override, "ClassSubstring:mult" comma-separated -- beats the kind defaults. The kind
# buckets are a guess at this game's taxonomy and one was already wrong (WBP_NavpointDestination_C
# filed as an objective at x0.8 when the field reads it as an enemy mark). Read the class names
# straight off the "NAVWORLD: slot N = ..." log lines and size them directly:
#navsizeclass=WBP_NavpointDestination_C:0.25
# Draw the marker this many cm SHORT of the thing it marks (the reticule's surface offset, aimed
# at the objective instead of a wall). Only bites when the objective is nearer than navworldmax.
#navworldback=50
# WHICH image child to host when a navpoint layout carries more than one (on-screen icon vs
# off-screen arrow). The creation log prints how many were found and which was taken.
#navworldimg=0
# Image collection lane. 1 (default) = verify-then-trust: the FIRST host of each marker class
# runs both the object-array walk and the reflection tree walk, serves the array result, and
# certifies the tree lane only when both sequences match exactly ("NAVWORLD: tree lane VERIFIED"
# in the log) -- later hosts of that class then collect in microseconds instead of a ~10 ms
# array pass. 0 = array walk everywhere: the live A/B, and the drill that keeps the fallback
# lane proven. The creation log names the lane used (lane=tree/array/...).
#navwtree=1
# Hide the game's flat navpoint layer while world markers are placed. Tied to markers actually
# existing, so any failure of the world lane restores the game's own markers.
#navhideflat=1
# Legacy fixed distance -- lanes 0/1 only, ignored by navworldsrc=2.
#navworlddist=1500
#navworldscale=0.5
#navworldcr=1.0
#navworldcg=0.85
#navworldcb=0.1
# Per-marker inversion samples in the log, every ~2 s. [dev build]
#navworldlog=0
# THE WAYPOINT-POSITION HUNT (one 5-minute in-headset protocol; the plugin reads your position
# itself -- you never type a coordinate). Stand ON/AT an active objective, then step through:
#   navscan=1   (wait for "MEMSCAN done" in the log, ~10-30 s)   then navscan=0
#   navscan=2   (wait)                                            then navscan=0
#   navscan=3   (wait)                                            then navscan=0
# Walk 20+ metres away, and repeat the same six edits. Done -- the offline analysis crosses the
# two capture sets to find the record that stored the OBJECTIVE's position rather than yours.
# 1/2/3 are unit hypotheses (UE cm / Blam world units / metres), all float X,Y. [dev build]
# navscan=4 = the TLS-GRAPH WALK: stand at the objective and set it once -- searches the pointer
# graph reachable from the sim's TLS root for the objective's world-unit pair, logging each hit
# WITH ITS CHAIN ("TLSNAV HIT L2: block+0x.. -> +0x.. -> .."). A chained hit is the stable anchor
# the marker placement needs; the heap scans (1..3) proved the value only otherwise appears in a
# relocating event buffer. Requires blamangles to have resolved once (it publishes the root).
#navscan=0
# Include the pitch term. Set 0 if markers overshoot vertically -- UEVR's DecoupledPitchUIAdjust
# already moves the whole UI quad for pitch, and the two may double-count.
#navpitch=1
#navk=1000
# Shift clamp, px.
#navmax=2000
#
# THE CULLING FIX (settled live 2026-08-12, player-confirmed): re-applies
# Blam.Synchronization.Relevancy.OutOfViewCullDistance=culldist per level (+ ~1/min insurance;
# level loads reset cvars). The distance term ALONE fixes aim-keyed body culling. Its sibling
# CullByBlamVisibility is deliberately left stock -- zeroing it froze ambient animation (birds)
# and the FP arms, because the visibility term WAKES actors as well as culling them. No un-exec:
# cullfix=0 stops re-applying, restart restores stock. Default off pending the perf soak.
#cullfix=0
#culldist=9999999
# LADDER RESULTS 2026-08-15 (restart-disciplined, in-headset) -- READ BEFORE RE-LITIGATING:
#   * cullhead REFUTED both ways: with a verified baseline repro, cullhead=1 alone from boot
#     neither kept bodies visible (cull side) nor woke aimed-away creatures (wake side, proven
#     in both directions via the displacement method). The terms are registered and writes
#     land; they just do not govern these behaviours on this build.
#   * The WAKE freeze (birds etc., aim-keyed) survives the ENTIRE named cvar surface:
#     Blam.EffectThrottling.Enabled 0, Blam.Synchronization.Relevancy.DisableAnimationOnNoMotion 0,
#     Blam.Synchronization.Throttling.Enabled 0 -- all exec'd live (log-verified), no change.
#     Post-release lane: hunt the facing-weight state in Blam memory (the NAVSCAN playbook).
#   * SHIPPED: cullfix=1 culldist=40000 as compiled defaults (user decision) -- cures body
#     culling, bounds the perf cost. Release notes must mention it.
#cullhead=0
#
# One-shot navpoint/CHUD recon dump (edge-triggered: change the value to re-run) -- lists live
# Navpoint/Waypoint/HudDataAsset objects and each class's property names+offsets, looking for
# the camera-rotation input that feeds the marker projection. [dev build]
#navdump=0
#
# Console-command harness: each key holds ONE command, executed when its value CHANGES at the
# ~2 s config poll and logged loudly ("DEVEXEC[n] ACTIVE"). No un-exec exists -- clearing a key
# only stops it re-applying; set the inverse command or restart to revert. Built for the
# culling hunt: the Blam relevancy cvars are strings in the binary whose READS return garbage,
# so a write experiment is the only way to learn if they are live. Candidates, in order:
#   Blam.Synchronization.Relevancy.CullByBlamVisibility 0
#   Blam.Synchronization.Relevancy.OutOfViewCullDistance 999999
#   Blam.Synchronization.Throttling.Enabled 0
# Watch frame time with perflog=1 while testing -- these systems exist for performance. [dev build]
#devexec1=
#devexec2=
#devexec3=
#devexec4=


# ============================================================== VR WEAPON HANDLING (PR #7)
# Internal tunables and diagnostics behind the gesture/arms/hands work. The PLAYER-facing keys
# for those features are in halo_vr_user_reference.txt; these are the ones that either cost
# frame time or answer a question rather than play the game.

# ---- WEAPON SOCKET CANCELLATION (rigsocket / rigsockrot) --------------------------------
# The weapon is a separate actor socketed onto the first-person mesh, so what is rendered is
# mesh_transform * socket_transform and the rig drives only the first term.
#
# rigsocket -- TRANSLATION. Targets the same term as our pivot (G = piv_x/y/z) and REPLACES it:
# the apply site is a ternary, sep_live ? sock_local : G, so the two never stack. His own comment
# says as much -- "same shape as the pivot fallback, the only difference is that this constant is
# measured rather than guessed".
#
#   READ "GUESSED" LITERALLY, because it is the whole argument. Our pivot is only PINNED TO YOUR
#   MACHINE once a calibration has run (g_pivot_from_calib, set in the calibration solve). Until
#   then the pivot in force is whatever pivx/y/z the SHIPPED halo_vr.cfg carries -- currently
#   (61.467, 13.062, -23.498), which is one contributor machine measured once. Every player who
#   has not calibrated is running that constant against their own mesh instance, and nothing
#   checks whether it fits. rigsocket reads the real value off the live component instead, so it
#   is correct without a calibration and correct on an instance nobody measured.
#
#   An earlier revision of this note argued the opposite -- that our pinned pivot "already covers"
#   the translation term, so this could default off. That reasoning silently assumed a calibration
#   that most players will never perform. Corrected 2026-08-23.
#
#   The author also walked back the PR"s headline framing: it was sold as a RESPAWN fix (the
#   offset "flipping" ~39 cm), and his own later in-code measurement records the local offset as
#   CONSTANT at (61.2,13.1,-23.5) across a session, with the error "identical before and after a
#   respawn". That weakens the respawn story, not the feature -- the case for it is fitting the
#   machine in front of you, which is a different and better argument.
#
# rigsockrot -- ROTATION. THIS IS THE HALF NOTHING OF OURS COVERS. The socket rotation is not
# identity on every launch: identity on some runs, (p3.7 y-4.2 r-1.8) on others, with the config
# byte-identical either side. Uncancelled, it lands as "calibration was perfect last session and
# is several degrees out today". Cancelled on BOTH sides -- the apply and the calibration fit --
# so the solve and the apply describe the same object.
#
# THEY ARE INDEPENDENT. rigsockrot tests its own flag, and the sampling block runs if EITHER is
# set, so rigsocket=0 rigsockrot=1 is a valid combination and isolates the rotation term.
#
# COST: with either on, socket_sample makes FOUR reflected calls EVERY TICK, not behind a tick
# counter. MEASURED 2026-08-23: 0.004 ms mean / 0.007 ms max against a 0.24 ms tick, about 1.6%.
# Real but small. Re-check with perflog=1 in heavy combat before trusting it broadly.
#rigsocket=1
#rigsockrot=1

# Pin roll to a fixed value instead of re-deriving it from the pose-match gesture. The gesture
# cannot measure roll -- a gun is near-symmetric about its own barrel -- so a value set by eye
# down the sights beats one the gesture guesses. -999 = disabled (derive as normal).
#rollstatic=-999

# ---- SOCKET-CANCELLING WEAPON DRIVE -------------------------------------------------------
# Where controller tracking is delivered. 0 (default) places the ARM MESH, which carries arms
# and gun together -- so the shoulders are effectively children of the aim controller and the
# whole upper body swings when you rotate your hand. 1 places the WEAPON ROOT instead and
# leaves the mesh alone, so the arms can be anchored to the body by the palette arm driver
# while the gun still tracks the hand.
#
# Requires attachmode=0 and rigmode=3 (both defaults); it says so in the log and stays on the
# legacy path otherwise. Your calibration is NOT affected either way: grip_deg/grip_yaw/
# grip_roll, off_x/y/z and the per-weapon wpnoff deltas are passed through untouched, and the
# drive compares itself against the legacy result every frame -- if it ever diverges it hands
# the gun straight back and logs why. The status line reports that error in cm.
#wpndrive=0
# ---- DIAGNOSTICS ------------------------------------------------------------------------
# bonedump is a BULK REFLECTION DUMP and is compiled out of release builds entirely
# (HALO_VR_DEV, see src/DevTools.hpp) -- setting it in a shipped build does nothing at all.
# Arms it; the dump lands the moment a first-person rig exists.
#bonedump=0
# Per-tick weapon/socket separation numbers, once a second.
#wpndiag=0
# Hand and magazine mesh spawn/attach reporting.
#handsdiag=0
# Verbose per-event logging for each subsystem.
#meleelog=0
#reloadlog=0
#wpnlog=0
# ---- WIDGET-SWEEP SLICE BUDGET ------------------------------------------------------------
# Milliseconds of one game-thread tick that reticle_rescan() may spend walking the UObject
# array looking for the HUD reticle, the navpoint layer and menu candidates. The walk costs
# one cache miss per object, and UE's object count is a HIGH-WATER MARK that only grows for
# the life of the session -- so the cost of that sweep climbs with playtime no matter how the
# inner loop is written (measured 83.9 ms, cut to 29.8 ms on 2026-08-12, back at 55.3 ms on
# 2026-08-23 with that fix fully intact). A 55 ms game-thread stall in VR is a dropped frame.
#
# So it is spread over consecutive ticks at this budget each, and its results are published
# atomically when a pass finishes. Total CPU is unchanged; none of it lands in one frame.
#
# 0 = no slicing, whole array in one tick (the old behaviour, for A/B in a headset -- the same
# role rigfast=0 plays for resolve_rig). Above ~4 costs frames again. Below ~0.5 a pass takes
# long enough that a fresh reticle binds noticeably late after a level load.
#
# Read the result with perflog=1: `reticle_rescan` now counts SLICES (max = worst single
# slice), while the `widget sweep: N objects in M slice(s)` line gives the whole-pass cost.
# Always read a sweep timing next to the `objects=` count on the PERF header line -- two
# timings taken at different array sizes are not comparable.
#retsweepms=2.0
# ---- COMPOSITOR RETICULE (EXPERIMENTAL, src/XrLayer.cpp) ---------------------------------
# A third reticule, drawn by the OpenXR compositor instead of by the scene. Because a
# composition layer is submitted AFTER the whole post chain, scene exposure and tonemapping
# cannot touch it -- it is bright by construction, where aimwidgettint/aimwidgetgain are a
# constant fighting a varying term and can only ever be a compromise between a bright beach
# and deep shade.
#
# IT IS STATIC. It draws a ring we generate ourselves, so there is NO firing bloom, NO reload
# state and NO hit marker -- that animation belongs to the game's own crosshair widget, which
# only the in-scene reticule hosts. This layer draws ALONGSIDE that one, never instead of it,
# so nothing is lost by trying it and nothing is gained for animation by leaving it on.
#
# OpenXR only. Under the OpenVR runtime this does nothing and says so once in the log.
#xrlayer=1
#
# SPACE LADDER -- a diagnostic, not a preference. Whether UEVR reports poses in the same space
# it names as the stage space is an assumption we have not measured, and each mode fails in a
# different, recognisable way:
#   0  stage space, raw HMD pose. If wrong, the ring is offset and the offset CHANGES when you
#      recentre.
#   1  stage space with the recentre correction UEVR applies to its own quads.
#   2  view space -- head-locked. Wrong for a reticule on purpose: if 2 draws a ring in front
#      of your face and 0/1 draw nothing, the hook, swapchain, format and blend are all proven
#      and only the pose math is left. START HERE if nothing appears at all.
#xrlayerspace=0
#
# MULTIPLIER on the in-scene crosshair's own size. 1.0 = the same size as the hosted widget
# reticule, matched by construction rather than by eye. Raise/lower only if you deliberately
# want the compositor ring bigger or smaller than the game's crosshair.
#xrlayersize=1.0
#
# UE centimetres per VR metre. 0 = derive it from UEVR's VR_WorldScale.
# UNMEASURED: the direction of that relationship is inferred. A wrong factor does not look
# broken, it looks like a reticule sitting at the wrong depth. Sweep this over a decade
# (10 / 100 / 1000) once in headset and the right answer is obvious.
#xrlayercmpm=0
#
# Colour, 0..1. Bright cyan by default, pushed above Halo's authored crosshair because nothing
# downstream is going to dim it.
#xrlayercr=0.35
#xrlayercg=0.95
#xrlayercb=1.0
#xrlayeralpha=1.0
#
# State line every ~2 s: armed/live, layers submitted since the last report, resolved cm/m.
# Hide the IN-SCENE crosshair so the compositor reticule can be judged on its own.
#
# Only takes effect while the layer is PROVEN live (our quad actually reached the compositor
# within the watchdog window) -- not merely while xrlayer=1. If the layer fails for any reason
# the in-scene crosshair stays, because the alternative is a player with no reticule at all.
#
# The widget keeps ticking and keeps rendering to its render target either way. That is
# deliberate and load-bearing: with xrlayersrc=1 the compositor layer is PRESENTING that target,
# so making the widget invisible would freeze the layer's texture -- it would look like it
# worked right up until you fired. This hides only the scene proxy.
#xrlayerhidews=1

#xrlayerlog=0
#
# --- STAGE 2: present the GAME'S OWN crosshair through the layer, animation and all -------------
# Stage 1 draws a ring we generate: bright and exposure-proof, but static -- no firing bloom, no
# reload state, no hit marker, and it cannot match per-weapon reticle art. All of that belongs to
# the game's live UMG crosshair, which the widget reticule already re-parents onto a world-space
# quad. Stage 2 hands that widget's render target to the compositor instead of our bitmap.
#
# Getting there means walking two UNREFLECTED engine hops
# (UTextureRenderTarget2D -> FTextureResource -> FRHITexture), and the last hop makes a VIRTUAL CALL
# on whatever pointer it is given. So the probe is a LADDER, not a switch:
#   0  off.
#   1  WALK AND LOG ONLY. Reports every candidate offset triple it can find. Classifies every
#      pointer (heap object? vtable in a mapped image?) before it dereferences anything, and never
#      makes an indirect call. Safe to leave on.
#   2  the same walk, then ATTEMPT the virtual call on each candidate and validate the result
#      against the widget's known draw size. Read the mode-1 list first.
# Before probing, set aimwidgetdraw to something UNUSUAL (300, 324). The filter keys on that number
# and the default 256 occurs by coincidence all over a game's memory.
#xrlayersrcprobe=0
#
# PROVE THE CHAIN OFFSETS ARE CLASS-LEVEL -- a one-shot research harness, and OFF by default even on
# a dev build. When on, once the reticule's chain is latched it walks a SECOND component's render
# target with the same full discovery probe and checks the offsets match, proving that one measured
# chain may serve all nine slots. That second walk is the expensive one (tens to ~200 ms). Leaving
# it ungated cost a live session: it re-ran EVERY tick until it found a chain, hitching xrsource_tick
# to 87-197 ms with navpoints up. So it needs this explicit opt-in, is throttled to ~once a second,
# and stops for good once it reaches a verdict. Turn it on only to answer the class-level question,
# never for play. Watch the XRSRC state line: xcheck 1 = agreed, -1 = disagreed, 0 = not attempted.
#xrlayersrcxcheck=0
#
# Feed the resolved-and-validated resource to the layer. Does nothing until a probe has measured the
# chain; there is no built-in offset to fall back on, deliberately.
#xrlayersrc=1
#
# PER-TICK NATIVE-RESOLVE CACHE. Default ON, and it SHIPS on -- the perf fix for the xrsource_tick
# hitch. MEASURED (2026-08-24, live): the ~16 ms/slot cost is NOT get_native_resource/GetDesc (both
# ~0 ms) but the pointer WALK -- looks_like_object's VirtualQuery classification (~42 VirtualQuery/
# slot, ~14.5 ms and rising with the VAD tree; six markers = ~100 ms). On a cache HIT no virtual call
# is made, so the vtable classification (the whole cost) is skipped and the FRHITexture is reached
# with readable_bytes guards only (~4 VirtualQuery). Set it to 0 to force the FULL classified walk
# every tick (pre-fix behaviour): the safe fallback and the A/B control for the dev "resolve split"
# state line (walk=...ms, cache hit/miss). Both values are safe.
#xrlayersrccache=1
#
# ms. HOW LONG THE LAYER KEEPS SHOWING THE LAST CAPTURED CROSSHAIR when the game thread stops
# capturing, before it gives up and draws the generated ring instead.
#
# The capture stops for two very different reasons and this number is what separates them:
#   TRANSIENT -- picking a weapon off the floor makes the HUD rebuild its crosshair, so the widget
#     re-hosts onto a NEW render target and the source is dropped for a few ticks; and any
#     game-thread hitch longer than the window also stops the captures. This title's worst measured
#     in-gameplay hitch is 600-750 ms.
#   REAL -- a level change. Seconds long, and a crosshair frozen in space through it looks worse
#     than the ring.
# This was hardcoded at 250 ms, which is BELOW the worst hitch, so EVERY hitch flashed the
# placeholder ring on screen and back. 1500 sits between the two cases with room on both sides.
#
# Read `ringfalls=` and `held=` in the XRLAYER state line to tune it: ringfalls counts the times the
# ring actually replaced the game art, held is the longest gap the window absorbed without doing so.
# 0 reproduces the old instant-revert behaviour.
#xrlayerhold=1500

# ---- WORLD NAVPOINT MARKERS ON THE COMPOSITOR LAYER (EXPERIMENTAL) ------------------------
#
# Move the world-space objective/ally/enemy/item markers onto the same OpenXR composition layer the
# reticule already uses. Two things follow, and the second is the interesting one:
#
#   1. A composition layer is submitted AFTER the entire post chain, so scene exposure and the
#      tonemapper never touch it. The in-scene markers are currently driven at
#      aimwidgetgain x aimwidgettint to out-shout the tonemapper -- the same workaround the
#      crosshair used, and the one that turned the crosshair into a light source that bloomed the
#      environment. On the layer that workaround is not needed at all.
#   2. A COMPOSITOR QUAD IS NEVER OCCLUDED, so the navpoint occlusion line-trace has nothing left
#      to do and is SKIPPED on this path. That trace exists only to pull a marker in front of
#      intervening geometry; it never hid anything, and marker size is proportional to the drawn
#      distance so skipping it does not change how big a marker looks.
#
# The RETICULE'S trace is NOT skipped, on either path, and the asymmetry is deliberate: that one
# puts the reticle on the surface the shot will actually hit, which is real information rather than
# an occlusion workaround.
#
# GATED ON THE LAYER ACTUALLY WORKING, per marker. A marker only moves to the layer once its own
# widget texture has been captured; until then the in-scene marker draws exactly as before, and it
# comes straight back if the capture is ever lost. There is no state in which this leaves you with
# no waypoint. (On a player install the layer cannot attach at all -- it needs UEVRBackend.pdb --
# so this key does nothing there.)
#
# ONE SWAPCHAIN, NOT NINE: the reticule and up to eight markers share a single texture atlas, each
# quad referencing its own rectangle. Nine swapchains would mean nine acquire/wait rounds per frame
# at 20 ms each on the frame-submit thread, which in VR is nausea rather than a blemish.
#xrlayernav=1

# How many marker quads may be submitted at once, 1..8. Does not change the atlas (all eight cells
# always exist while xrlayernav is on), so this is live-tunable without a swapchain rebuild.
#xrlayernavmax=8

# cm. The FURTHEST a compositor marker is placed from your eye. Near clamp is a fixed 1 m.
#
# This is NOT navworldmax, and reusing that key would have been wrong: navworldmax exists to stop
# an in-scene marker shrinking to nothing and vanishing behind terrain at range, and neither
# pressure applies to a composition layer. What the distance actually decides here is VERGENCE --
# how far your eyes physically converge to fuse the marker. Angular size is held constant across
# the clamp, so changing this moves where the marker LIVES, not how big it looks.
#xrlayernavdist=400

# FORCED composition-layer budget. 0 = use the number the runtime reported at bring-up (it is
# printed on the ARMED line as maxLayerCount).
#
# This key is here to be TESTABLE, not to be tuned. When the runtime has fewer free layers than we
# have quads, the layer sheds the least important ones -- objectives last, and within a tier the
# smallest apparent quad first. That path only runs on a runtime that is short of layers, i.e.
# never on a healthy machine, which is exactly how a fallback rots unobserved. (This feature
# already has one such rung: `skips=` in the XRLAYER state line has never once been non-zero.)
#
# Set it to 2 or 3 and watch `drops=` climb in the state line: that proves the ORDERING runs, which
# is the interesting case. Setting it to 1 only proves the early-out.
#xrlayerbudget=0

# ---- ARM DRIVER SELECTOR + THE PALETTE ROUTE (EXPERIMENTAL, src/palettearm/) --------------
#
# armdriver picks WHICH of the two arm implementations runs. Exactly one ever does -- they drive
# the same visible arms, and the project's hard rule is that two arm drivers must never both be
# enabled. Switching is live and safe mid-session: the arbiter tears the outgoing driver down
# before the incoming one gets a frame, so this is the key to A/B them in the headset.
#
#   0 = off      the game's stock first-person rig, untouched
#   1 = UeRig    Rig.cpp + Arms.cpp + Hands.cpp -- UE reflection. THE SHIPPED DEFAULT.
#   2 = Palette  src/palettearm/ -- Halo's own node palette, ported from elliotttate's project
#
# MODE 2 HAS NEVER BEEN VERIFIED AGAINST A RUNNING GAME. Its offset chain was measured on someone
# else's copy of HaloSimulation_tag_release.dll. Expect it to resolve nothing and stand down; the
# log line to look for is "PALETTEARM:" -- it says how the address resolved and, separately,
# whether the hook has actually been CALLED. Installed is not running.
#
# IT FALLS BACK, so mode 2 is safe to try blind in a headset. If the builder cannot be resolved,
# or the watchdog later proves the hook is never called, the arbiter reverts to mode 1 and logs
# "ARMDRIVER: ... (FELL BACK; ... was requested but is unavailable this session)". Without that
# you would be left with NO arm driver at all -- mode 2 stands the UE route down, so a broken
# palette route means unattached weapon and stock arms until you edit this file again.
# Writing this key again re-arms the route: set it to 1, save, set it back to 2 to retry within
# the same session.
#armdriver=1
#
# Palette-route tuning. All distances in METRES (this folder converts to Blam units itself --
# unlike the rest of the plugin, which is centimetres). Only read when armdriver=2.
#
# Where the shoulders hang off a yaw-only head frame. Yaw-only is the trick that stops the arms
# crossing your face when you look down; these three say where a shoulder sits relative to a head.
#pashoulderback=0.16
#pashoulderdown=0.22
#pashoulderlat=0.17
#
# How far the arm ROOT may slide toward a target that is out of reach, before the rest is clamped.
# 0 disables the overreach entirely and the hand simply stops at the reach sphere.
#paclavicle=0.12
#
# The wrist bone sits BEHIND the controller's grip point -- the OpenXR grip pose is at the palm
# centroid, so placing the wrist there puts the knuckles inside the gun.
#pawristback=0.08
#pawristdown=0.02
#
# ---- TWO-HANDED AIMING (src/TwoHandAim.cpp) -----------------------------------------------
#
# NOTE these were pa2hmin / pa2hmax / pa2hradius / pa2hagreemin / pa2hagreefull / pa2hblend while
# the hold lived in the palette folder. The old spellings are STILL ACCEPTED as aliases -- nothing
# breaks if you have one uncommented -- but they name a folder the feature no longer lives in.
#
# The hold is now an AIM feature and runs in every armdriver mode, including 0. Its master switch
# `twohand` is a PLAYER key (see halo_vr_user_reference.txt), not a dev one; these are the shapes.
# All distances in METRES.
#
# The grab zone: a cylinder along the aim ray, measured from the aim hand's grip. Roughly "where
# the barrel is". The zone gates ACQUISITION ONLY -- once the grip button latches the hold it
# persists until the button releases, wherever your hand wanders.
#twohandmin=0.08
#twohandmax=0.80
#twohandradius=0.09
#
# How much the hand-to-hand line must agree with the one-handed aim ray before it gets any
# authority (min) and where it gets full authority (full). Below min the aim is exactly one-handed.
# Halo-MCC-VR hard-gates at 0.35; the band exists because a hard cutoff snaps the weapon about 70
# degrees when a LATCHED support hand crosses it.
#twohandagreemin=0.35
#twohandagreefull=0.50
#
# Seconds for the influence to fade fully in or out.
#twohandblend=0.15
#
# WHICH CONSUMER RECEIVES THE BLEND. Both default ON and the shipped answer is that they are always
# both on -- these exist to PROVE that in a headset.
#
# There are three places a controller orientation becomes aim in this plugin and they are not
# derived from one another: the sim write, the tick-side control law, and the rendered weapon. The
# first two are one switch (twohandaim); the weapon is the other (twohandrig).
#
# Setting twohandrig=1 twohandaim=0 reproduces "the gun points where the shots do not go" ON
# PURPOSE. That is the failure this feature is shaped to avoid, and being able to summon it on
# demand is the only way to demonstrate the two really are moving together.
#twohandaim=1
#twohandrig=1
#
# Latch and release transitions, with the zone state and the blend. HALO_VR_DEV builds only.
#twohandlog=0


# ---- PER-WEAPON SCOPE TRIM (ScopeOffset.cpp) --------------------------------------------
# Logs which weapon matched which trim, on every weapon CHANGE. This is the instrument for
# "is the trim being applied at all", and it answers that without needing a capture first.
#scopewpnlog=0

# What the scope pane hangs off. 0 = the arms rig's ORIGIN, 1 = the arms rig at socket
# `PrimaryWeapon` (the socket the weapon itself rides -- default), 2 = the weapon actor's root.
# On the rig origin the pane does not follow recoil and the gun clips through it. The socket is the
# animated frame the gun rides, so mode 1 couples them with no dependency on the weapon actor's
# lifetime. Mode 2 is kept for A/B only. A refused attach falls back to 0 and logs why.
#scopeparent=1

# Motion/throwable grenades (the holster pouch grab + throw gesture). OFF by default as of
# 2026-09-07: it fired unprompted during RC testing, and a gesture that throws a grenade with no
# button pressed must be opted INTO. This is INDEPENDENT of `holster`, which is the master switch
# and also controls over-the-shoulder weapon switching -- that stays on.
#holstergren=0

# World reticule hide mode. 0 = off, 1 = alpha, 2 = sub-pixel scale,
# 3 = bVisibleInSceneCaptureOnly, 4 = mode 3 PLUS bOwnerNoSee.
# Modes 1 and 2 hide it from the scope capture too, so the in-scene pane loses its crosshair.
# SHIPPED DEFAULT IS NOW 1 (canonized 2026-09-07 from the tuned profile), which is coherent with
# scopelayerhidepane=1 also shipping: the in-world pane is hidden, so the crosshair modes 1 and 2
# withhold from the capture is not being displayed anyway, and the compositor quad carries its own.
# Mode 3 remains the right choice for anyone running the IN-WORLD pane: hidden in the main view,
# still drawn into the scope capture. That finding stands and was expensive to establish.
# (A 2026-09-06 report that mode 3 "does not hide it" was a regression in the re-assert path, not a
# property of the flag -- see Config.hpp.) Mode 4 adds bOwnerNoSee as an A/B lever; UNVERIFIED.
#xrlayerhidews=1
# =============================================================== LEGACY KEYS (accepted, do not use for new work)
# pa2hmin / pa2hmax / pa2hradius / pa2hagreemin / pa2hagreefull / pa2hblend
#                     -- the two-handed hold's tuning, from when it lived in src/palettearm/.
#                        Still accepted; write the twohand* spellings instead.
# locksign            -- parsed but unused; the view lock assigns the yaw directly.
# ffsmooth / dsmooth / aimreticulesmooth / aimreticulesmoothctrl
#                     -- the old per-call blend fractions. Still accepted and converted to the
#                        *ms time-constant keys assuming 90 fps; write the *ms keys instead.

# paarmpitch -- PITCH half of the arm lift (0 = off, 1 = +gap, 2 = -gap). Default 2.
#   paarmlift removes the game camera's YAW from the arm frame. Nothing removed its PITCH, and the
#   game camera pitches 1:1 with the aim (PlayerCameraManager rotation.x measured at -56.56 for
#   aimpitch -56.6 and -14.82 for -14.8, with the HMD held level). UEVR's decoupled pitch keeps that
#   out of the VIEW, so a hand placed correctly in the pitched camera frame swings by the whole aim
#   pitch in ROOM space -- reported in-headset as "the left hand follows right controller pitch",
#   and pitch-only because the yaw is already compensated and there is no aim roll.
#   This is invisible to any camera-space diagnostic: sup/suptf/gotL/elbL all read perfectly flat
#   while the arm was swinging, because they are expressed in the frame that was moving.
# paarmpitch=2

# pabarrellock -- THE BARREL LOCK: one shared aim direction, so the rendered gun points where it
#   shoots. Default 0 (off). Only does anything on the palette weapon route (armdriver=2, pawpn=1).
#   Ported from blindcowboy24's PR #1, where it is on by default.
#
#   WHAT IT FIXES that the trims cannot. pawpnyaw/pitch/roll and the per-weapon wpnfix are STATIC:
#   correct for one wrist angle on one weapon. Everything that moves the gun off the reticle
#   DYNAMICALLY survives them -- the aim drive's own filter lag, the dead zone, ffpitchcomp, gain
#   adaptation, and each weapon's own authored marker. This constrains the transform that carries
#   the weapon branch onto your hand so it cannot move the AIM AXIS at all: the gun may slide and
#   may roll about the ray, and nothing else.
#
#   IT COMPOSES WITH wpnfix, it does not replace it. The lock is the COARSE alignment and wpnfix is
#   the FINE trim on top of it -- our lock runs AFTER both trims, so nothing already captured in
#   halo_vr_weapons.cfg changes meaning, and a fresh capture then only moves roll and position.
#
#   ⚠️ pawpnyaw IS STILL REQUIRED. Its job is the ~90-degree structural rotation from the camera
#   frame to the artist's bone frame; the lock's job is the few degrees left over. With pawpnyaw at
#   0 the residual is far past pabarrelrelease and the lock simply stands down.
#
#   READ THE STATUS LINE FIRST. The palettearm geom line ends with `barrel=on|off off=N.Ndeg
#   str=N.NN` in a dev build, published even while the lock is OFF: `off` is how far the rendered
#   barrel sits from the aim ray before any correction. Near zero at rest (with the trims
#   calibrated), growing on a flick and returning, means the lock's one assumption holds -- that
#   the game's own first-person pose points the gun down the camera forward. A large CONSTANT `off`
#   means it does not hold on this build and the lock is aligning the wrong axis; say so rather
#   than tuning around it.
# pabarrellock=1

# pabarrelfull / pabarrelrelease -- the lock's engagement band, DEGREES. Defaults 25 and 40.
#   Below pabarrelfull the correction is applied whole; between the two it fades to nothing, so
#   during a fast flick -- where the camera legitimately lags the hand -- the gun eases back to
#   following the hand instead of staying pinned to a stale ray.
#   Set pabarrelrelease=0 (or anything <= pabarrelfull) for blindcowboy24's exact behaviour, which
#   is a HARD cap: full correction at 24.9 degrees, none at 25.1, i.e. a 25-degree snap of the model
#   right where a flick lives. That is the A/B worth running once.
# pabarrelfull=25
# pabarrelrelease=40

# ---------------------------------------------------------------- GRAB GUIDE: BEAM BASIS
#
# Only meaningful with grabguidemode=1 (the beam). Picks which basis the beam's compositor quad is
# built from -- i.e. which way the quad is turned in space.
#
# WHY THIS IS A TUNABLE AND NOT A CONSTANT. The beam originally passed its own direction as the
# quad's FACING. In xr_look_rotation that argument becomes z = -fwd, the quad's NORMAL, so the quad
# was turned edge-on to the viewer while its WIDTH axis -- the one scaled to the beam's length --
# pointed off across the view. That is the "beam orientation looks wrong" report.
#
# Basis 0 is the derived correction: face the viewer, and pick up so that x = cross(up, z) lands
# along the beam. The others exist because that pair is mapped through ue_offset_to_xr on the way
# in, and a sign or handedness flip inside that mapping is not visible from reading either function
# on its own. Cheaper to settle with four live values than four 70-second rebuilds.
#
#   0 = derived: fwd=view, up=cross(beam,view)   <- the intended answer
#   1 = same with up flipped                      <- finds a sign/handedness flip
#   2 = beam as the quad's UP                     <- CONTROL. Puts the THIN axis along the beam,
#                                                    so it should look plainly WRONG. If it does
#                                                    not, the convention above is misread and 0 is
#                                                    only right by coincidence.
#   3 = the original pre-fix basis                <- for a direct before/after comparison
# grabguidebeambasis=0

# ------------------------------------------------- XR LAYER: RE-ANCHOR PLAYER-ATTACHED QUADS
#
# 1 = on (default). Applies to the aim reticule and the grab guide. Navpoint markers are genuinely
# world-fixed and are never affected.
#
# THE BUG IT FIXES. compute_pose does d_world = target - eye. The target is chosen on the 32 Hz
# game tick; the eye belongs to the frame being drawn. For a world-fixed navpoint that split is
# correct and deliberate -- it is why the subtraction runs at render rate. For a quad attached to
# the PLAYER it is backwards: the reticule is origin + fwd*d measured from the weapon, and the grab
# guide sits at your hand, so while you locomote both the anchor and the eye translate together and
# a fresh eye gets differenced against a stale anchor. The quad trails one tick of travel behind.
# At a walking pace that is several centimetres, and it is the "xr layer lags behind when I
# locomote" report -- which turned out to affect the reticule too, for exactly the same reason.
#
# THE TRADE, stated so it is a choice rather than a surprise: the offset is re-anchored at render
# rate, but the traced DISTANCE is still a tick old. Walking straight at a nearby wall, the
# reticule now sits a few cm off the wall until the next tick, instead of lagging your aim by the
# same few cm. Both are one tick of error; this puts it on the axis you are less likely to see.
# xrlayerhrel=0 restores the old behaviour for a direct A/B.
# xrlayerhrel=1
# scopegain: ColorGain on the capture -- a flat brightness multiply in the grading chain.
# 0 = do not touch (default). 1.0 = neutral. Range 0..256.
#
# This is the COMPOSITOR QUAD's equivalent of scopebright. scopebright tints the in-world pane's
# MATERIAL, so it does nothing once the layer presents and the mesh is hidden -- and the quad has no
# material to tint. OpenXR's own per-layer gain (XR_KHR_composition_layer_color_scale_bias) is not
# available to us either: extensions must be enabled when the XrInstance is CREATED, and UEVR
# creates the instance -- we only hook xrEndFrame on a session that already exists. So a capture-side
# multiply is the only place the gain can live.
#
# Distinct from scopeautoexposurebias on purpose. Bias moves EXPOSURE, so it changes what the
# tonemapper's shoulder does to highlights (and pushing it far is what produces the warm cast).
# scopegain scales the GRADED colour and leaves the exposure decision alone. Reach for bias first --
# it uses the curve's range properly -- and this only when you want a plain multiply on top.
#
# ColorGain is an FVector4: four DOUBLES under LWC on some builds, four floats on others. The width
# is resolved from the reflected struct and an unrecognised size is REFUSED rather than guessed.
# XYZ take the gain and W stays 1 (W is the master term; scaling it too would square the effect).
#scopegain=5.5
# scopemask / scopemaskaspect / scopemaskfeather: feather the compositor scope pane's edge into a
# soft OVAL by writing its atlas cell's alpha with a compute shader. 0 = off (default).
#   scopemaskaspect  >1 is WIDER THAN TALL (X radius stays at the half-width, Y is divided by this).
#                    Clamped 0.2..5, default 1.35.
#   scopemaskfeather edge softness as a fraction of the radius. 0.15 = outer 15% fades. 0..1.
#
# WHY A SHADER AND NOT fill_upload(). Every other thing this layer draws is CPU-generated into a
# staging buffer and uploaded -- the reticule ring, the navpoint markers, the grab guide beam, even
# GDI-rasterised text. Authoring art is a solved problem here, and "we cannot author a feathered
# oval" was simply wrong. The scope pane is different IN KIND: its pixels arrive by
# CopyTextureRegion from the game's render target, GPU to GPU, and CopyTextureRegion cannot copy a
# single channel -- so there is no way to keep that scene RGB and substitute a CPU-authored alpha.
# A second quad cannot mask it either; composition layers blend OVER one another and cannot cut a
# hole. That leaves a per-pixel write to the cell, which is a shader.
#
# The oval is ANALYTIC -- no mask texture, no upload, no asset. The shader maps the cell's pixel to
# -1..1, divides by per-axis radii and smoothsteps the edge, so shape is a constant rather than an
# image per size.
#
# READ AT ATLAS CREATION TIME, because it needs D3D12_RESOURCE_FLAG_ALLOW_UNORDERED_ACCESS and that
# is a creation-time decision. With this off the atlas is created byte-identically to before, so an
# unconfigured build carries none of the machinery. That texture has crash history around its
# lifetime, which is why the decision is taken in exactly one place.
#
# COUPLED TO SLOT 9'S BLEND FLAG, and this is the part to understand before changing either. Slot 9
# is submitted OPAQUE because a scene capture's alpha is not meaningful (~0), and blending by it
# made the whole pane vanish except where the captured world-space reticule had written alpha --
# reported in a headset as "the render is happening within the lines of the reticle". This mask is
# what makes that alpha meaningful, so blending is re-enabled ONLY on frames the mask actually RAN
# (scopemask_applied()), never merely because the key is set. Re-enabling it without a mask that
# wrote alpha reproduces the invisible pane exactly.
#
# Every failure path here is non-fatal and latching: a shader that will not compile, a heap that
# will not allocate, a PSO the device refuses -- each disables the mask, logs once, and leaves the
# pane drawing unmasked. A cosmetic feature must not be able to take the pane down with it.
#scopemask=1
#scopemaskaspect=1
#scopemaskfeather=0.3
# scoperetproject / scoperetflipx / scoperetflipy: put the compositor scope reticule at the
# PROJECTED impact point instead of dead pane centre. 1 = project (DEFAULT), 0 = centre.
#
# Centre is correct only while the capture camera's axis and the traced impact point agree. That
# holds for scopecamtrack=0 at rest and breaks under recoil, sway, or any camera that rides the
# weapon rather than being re-anchored to the live ray each tick. A reticule that is confidently
# wrong is worse than one that is obviously approximate, because it is the thing being aimed with.
#
# HOW: the traced hit point is projected into the CAPTURE CAMERA'S OWN frustum -- its real world
# basis read back from the component, and the FOV actually WRITTEN to it (s_fov_applied, never the
# config value; the two differ for a tick after a zoom change, and using the config one would swing
# the reticule on exactly the frames the zoom is moving). The render target is SQUARE, so the
# vertical half-angle equals the horizontal one and a single tan() serves both axes. The result is
# normalised to -1..1 against the pane's half extent and applied in the pane's OWN local axes, so
# the reticule slides across the pane's face at any orientation rather than being displaced through
# the world. Off the edge it clamps to the rim -- honest about direction without claiming a position
# the image does not contain. Behind the camera, or nearer than 1 cm, it stays centred.
#
# THE FLIPS EXIST BECAUSE THE SIGN IS NOT PROVABLE FROM THE CODE. UE's camera right/up and the quad's
# local +X/+Y are both "right and up", but nothing guarantees they still agree after the pose has
# crossed the layer module's UE->XR mapping, which has determinant -1. A mirrored reticule looks
# entirely plausible until you aim off-axis -- so rather than bake a guess into the maths, it is one
# config edit in a headset. If the reticule moves the WRONG WAY horizontally, set scoperetflipx=1;
# vertically, scoperetflipy=1. If it moves the right way, both stay 0 and this comment can say so.
#scoperetproject=1
#
# scoperetroll: which frame the SLIDING reticule (xrlayerscopereticle=2) projects into.
#   0 = the old world-levelled basis (right = aim x worldUp) -- kept for A/B
#   1 = the CAPTURE CAMERA'S basis (correct: that is the frame the image is rendered in)
#   2 = the camera's basis with the vertical negated, if 1 comes out upside down
#
# Mode 2 built its own basis from world up, which is a THIRD frame. Image coordinates are defined
# by the capture camera's axes, and the atlas blit maps image axes onto the quad's local axes one to
# one -- so a world-levelled projection is wrong by the camera's whole roll: scope_cam_roll, the
# per-shape uv_roll, and the LIVE ROLL LOCK. That last term moves continuously to hold the image
# upright as the weapon cants, so the slide direction was wrong by an angle that changed as the gun
# rolled, which is why scoperetflipx/y could never fix it (a flip is 180 degrees, not a moving angle).
#
# NO EFFECT ON xrlayerscopereticle=1. There the reticule is pinned at centre -- the capture looks AT
# the aim point, so the projection computes ~(0,0) -- and rotating zero is zero. A/B this on mode 2.
#scoperetroll=1
#scoperetflipx=0
#scoperetflipy=0

# ---------------------------------------------------------------- HOLSTER INTERNALS
#
# The player-facing holster settings (zone positions, radii, markers, torso leash) live in
# halo_vr_user_reference.txt. These are the mechanism's own knobs: button ownership, the melee
# veto, and the synthetic press shape. They arrived with the over-the-shoulder switching merge
# and went undocumented in BOTH catalogs for a while, which cost a debugging session -- the key
# below is named holsterstealbtns, not holstersteal or holster_steal_buttons, and an unknown key
# is silently ignored, so a reasonable guess reads as "the setting does nothing".
#
# WHICH PHYSICAL BUTTONS THE GESTURE SYSTEM TAKES AWAY FROM THE GAME.
#
# 1 = steal them (default), 0 = leave them alone. The gestures inject their masks AFTER the
# steal, so a stolen button still works via the reach -- what it stops is the PHYSICAL press.
#
# READ THIS BEFORE CHANGING IT, because the obvious reading is wrong twice over:
#   * Y (holsterswapmask) is NOT stolen any more, whatever this is set to. Stealing it was pure
#     loss -- the reach gesture needs no button, so taking Y away only removed the game's native
#     weapon switch. Both work independently now.
#   * Turning this OFF does not fix a missing grenade throw. The throw's mask (0x0100) is shared
#     with the trigger grenade, and that fault was an ORDERING one: the trigger injected the mask
#     and this block stripped it a few lines later. The injector now runs after the steal. If
#     trigger grenades ever go missing again, check that ordering rather than this flag.
#holsterstealbtns=1
#
# No melee for this long after a holster action, milliseconds. A reach and a punch look alike to
# a velocity detector, and stowing a weapon should not also throw a fist.
#holstermeleevetoms=400
#
# How far OUTSIDE a holster zone still vetoes a melee, metres. 0 = the zone itself only. This was
# 0.10, which put a 26 cm veto sphere around each of five zones -- a large part of the space a
# punch travels through -- and swallowed real melees.
#holstermeleemargin=0.00
#
# How long the synthetic button press is held, milliseconds. Long enough for the game to read it,
# short enough not to register as a hold.
#holsterpressms=120
#
# Grenade speed at release, m/s forward. Only the throw the GESTURE fires; a trigger throw uses
# the game's own.
#holsterthrowspeed=1.2
#
# Log every holster state transition. The tuning instrument for zone positions and radii.
#holsterlog=0

# ---- COMPOSITOR RETICULE (EXPERIMENTAL, src/XrLayer.cpp) ---------------------------------
# A third reticule, drawn by the OpenXR compositor instead of by the scene. Because a
# composition layer is submitted AFTER the whole post chain, scene exposure and tonemapping
# cannot touch it -- it is bright by construction, where aimwidgettint/aimwidgetgain are a
# constant fighting a varying term and can only ever be a compromise between a bright beach
# and deep shade.
#
# IT IS STATIC. It draws a ring we generate ourselves, so there is NO firing bloom, NO reload
# state and NO hit marker -- that animation belongs to the game's own crosshair widget, which
# only the in-scene reticule hosts. This layer draws ALONGSIDE that one, never instead of it,
# so nothing is lost by trying it and nothing is gained for animation by leaving it on.
#
# OpenXR only. Under the OpenVR runtime this does nothing and says so once in the log.
#xrlayer=0
#
# SPACE LADDER -- a diagnostic, not a preference. Whether UEVR reports poses in the same space
# it names as the stage space is an assumption we have not measured, and each mode fails in a
# different, recognisable way:
#   0  stage space, raw HMD pose. If wrong, the ring is offset and the offset CHANGES when you
#      recentre.
#   1  stage space with the recentre correction UEVR applies to its own quads.
#   2  view space -- head-locked. Wrong for a reticule on purpose: if 2 draws a ring in front
#      of your face and 0/1 draw nothing, the hook, swapchain, format and blend are all proven
#      and only the pose math is left. START HERE if nothing appears at all.
#xrlayerspace=0
#
# Quad edge length in METRES (not centimetres -- this one value is handed straight to the
# compositor), before the same 1/distance apparent-size compensation the in-scene reticule uses.
#xrlayersize=0.06
#
# UE centimetres per VR metre. 0 = derive it from UEVR's VR_WorldScale.
# UNMEASURED: the direction of that relationship is inferred. A wrong factor does not look
# broken, it looks like a reticule sitting at the wrong depth. Sweep this over a decade
# (10 / 100 / 1000) once in headset and the right answer is obvious.
#xrlayercmpm=0
#
# Colour, 0..1. Bright cyan by default, pushed above Halo's authored crosshair because nothing
# downstream is going to dim it.
#xrlayercr=0.35
#xrlayercg=0.95
#xrlayercb=1.0
#xrlayeralpha=1.0
#
# State line every ~2 s: armed/live, layers submitted since the last report, resolved cm/m.
#xrlayerlog=0


# halo_vr_dev.cfg -- DEVELOPMENT & TROUBLESHOOTING knobs for the Halo: Campaign Evolved VR
# plugin. Ships with the mod, but NOTHING in it is needed for normal play.
#
# ========================= DO NOT EDIT THIS FILE CASUALLY =========================
# These are internal research and diagnostic knobs. The commented values document the
# tested shipping behaviour; a wrong value here can tank framerate (which in VR means
# nausea), break aim, or quietly invalidate a calibration. Uncomment something only if
# you know exactly what you are doing -- or troubleshooting instructions ask you to.
#
# Player settings belong in halo_vr_user.cfg (catalog: halo_vr_user_reference.txt), NOT
# here. Mod updates OVERWRITE this file (deliberately, so experiments cannot linger),
# while halo_vr_user.cfg and halo_vr_calib.cfg are never touched by an update.
# ==================================================================================
#
# HOW IT WORKS
#   * Read order, every ~2 s while the game runs (later wins for any key set twice):
#       halo_vr.cfg -> halo_vr_user.cfg -> halo_vr_dev.cfg (this file) -> halo_vr_calib.cfg
#     This file beats the user file ON PURPOSE: an uncommented key here is a deliberate,
#     temporary experiment, and the startup log calls it out ("DEV OVERRIDES ACTIVE").
#   * EVERY LINE SHIPS COMMENTED (packaging enforces it). The file changes nothing until a
#     key is uncommented; the value shown on each key is the effective default.
#   * The parser is file-agnostic: any key works from any of the editable files.
#   * [dev build] marks keys whose CODE only exists when compiled with HALO_VR_DEV=1 (see
#     src/DevTools.hpp in the source repo). On the release build they parse and do nothing
#     -- that is expected, not broken.

# =============================================================== WEAPON SCOPE RESEARCH
# The pane's lens width at 1x magnification, deg horizontal (pane fov = scopebase / scopezoom).
#scopebase=70
# ESceneCaptureSource for the pane's capture. 0 = SCS_SceneColorHDR (linear scene colour, no
# exposure dependency -- the shipped choice, paired with the HDR target + emissive lens that
# re-enters the main tonemapper).
# MEASURED 2026-08-14:
#   2 (FinalColorLDR)      orders of magnitude DARK
#   8 (FinalColorHDR)      SOLID BLACK, and still black with the capture's exposure pinned
#   9 (FinalToneCurveHDR)  SOLID BLACK
# CORRECTED 2026-08-16 -- the conclusion drawn from that ("every post-processed source is unusable
# here, changing this key cannot recover anything") is WRONG, and it stood for two days because
# nobody had varied the right thing. The blocker was NOT the source: it was
# bAlwaysPersistRenderingState, which we force TRUE to hold a steady image between manual captures.
# That persistent state is a TEMPORAL HISTORY, and the symptom -- an unrecognisable image that then
# FADES to black -- was that history converging, not a frame rendering black.
#   scopesrc=8 + scopepersist=0  ->  RENDERS. Darker than the main view, but legible.
# Darker is expected and not a defect: source 8 hands over an already-tonemapped image which then
# re-enters the MAIN tonemapper through the pane's emissive lens, so it is tonemapped twice.
# scopebright compensates. Source 0 remains the SHIPPED choice -- this is a research lane, and
# post-processing in the capture has not yet been shown to buy anything the effects care about.
# CORRECTED 2026-08-14: the follow-on claim that "effects live in POST, so they cannot reach the
# scope" is WRONG. UE 5.5 force-disables separate translucency for scene captures precisely so a
# pre-post capture still sees translucency, and scopetest=1 MEASURED a translucent primitive
# rendering into this pane. Whatever keeps shields/tracers out, it is not blending. See
# docs\BLAM_AIM_FINDINGS.md, 2026-08-14 (later).
#scopesrc=0
# scopeaa: DOES NOTHING. Left documented so it is not rediscovered as a lead. It was written to
# force the capture's anti-aliasing method via FPostProcessSettings, but UE 5.5 HAS NO
# AntiAliasingMethod FIELD IN THAT STRUCT at all (grep Engine/Classes/Engine/Scene.h) -- the key is
# inert by construction, not by any quirk of this game. The view's AA is decided in
# FSceneView::SetupAntiAliasingMethod (SceneView.cpp:1067), and a scene-colour capture lands on
# AAM_None regardless because EngineShowFlags.PostProcessing is force-disabled for it. Moving a
# capture's AA would have to go through the ShowFlagSettings array instead.
#scopeaa=-1
# 0 = ALSO pass the left trigger through to Blam while the scope feature is on. Native zoom then
# engages underneath (viewmodel hide, zoom HUD mask, halved look speed) -- research only, for
# watching the native state respond. The dev build logs the Blam zoom state on change
# ("SCOPEDEV blam zoom CHANGED": GetZoomLevelAbsolute/-Magnification on the player's
# BlamUnitComponent) whether or not this is set. [dev build]
#scopeeat=1
# Synthesize the scope's aim ray from the RENDERED VIEW instead of the controller. A FALLBACK for
# headless work, not a requirement: this was written when the null driver never validated a
# controller aim pose, which parked the real ray source. CORRECTED 2026-08-16 -- the scope has
# since been brought up repeatedly under SimVR with this key OFF, so the old claim that "without
# this the scope cannot be exercised headlessly at all" is FALSE. Reach for it only if the ray
# source actually parks. [dev build]
#scopedevray=0
# Hold the scope pane ON with no trigger input. Harness/support diagnostic, and likewise a
# FALLBACK rather than a necessity -- the left trigger has been reaching the toggle under SimVR in
# practice. Still the one automation channel that always works when input cannot get through,
# since the config file is re-read every ~2 s.
#scopeforce=0
# Capture cadence A/B: 0 = manual CaptureScene every scopediv ticks (the shipping perf valve),
# 1 = bCaptureEveryFrame while the pane is shown (render-rate; costlier, smoother).
#scopecapmode=0
# Scope geometry internals (the player face of the scope is in the user catalog). The capture
# camera must sit further out along the aim line than the pane (scopedist), or it films the
# pane's back and the lens goes black.
#scopecamdist=90
# Pane facing trim, degrees -- geometry only, relative to the controller; never for picture
# orientation (that is scopecamroll, user catalog).
#scoperotp=90
#scoperoty=0
#scoperotr=180
# 1 = pane mounted to the controller (default); 0 = the older aim-ray placement, kept as a
# fallback if a controller-relative offset ever sits oddly.
#scopemount=1
# What the scope CAMERA follows once attached to the rig. The PANE is a rigid child either way;
# this only decides what it shows. 0 = re-anchor to the live aim ray every tick (default: the
# in-pane reticle stays truthful, but residual aim jitter is visible and lens-magnified).
# 1 = anchor once and stay rigid like the pane (smoothest image, pure controller motion, but the
# view drifts off the true shot line as the aim-vs-rig delta changes). A/B this if the IMAGE
# still shimmers after the pane itself sits solid.
#scopecamtrack=0
# TRANSLUCENCY PROBE. Spawns a cube parented to the CAPTURE CAMERA (its local +X), so it is in
# frame without any aiming, and simultaneously in the MAIN view in front of the weapon -- which
# is the control. "Visible in the world, absent from the pane" is the whole measurement.
#   0 = off
#   1 = Widget3DPassThrough_Translucent (authored BLEND_Translucent)
#   2 = Widget3DPassThrough_Opaque      (the CONTROL for 1)
#   3 = EmissiveMeshMaterial at BLEND_Additive -- its AUTHORED mode. Additive is in the
#       translucency family and is what plasma/shield/tracer effects use.
#   4 = EmissiveMeshMaterial forced BLEND_Opaque (the CONTROL for 3, and the pane's own recipe)
# Forcing a blend mode at runtime does NOT recompile shaders, so only modes whose cooked shader
# exists are testable -- BLEND_Translucent on this material vanished from the MAIN view too.
# Two independent pairs on purpose: one pair could be defeated by something specific to one
# material. Live -- a mode change destroys and rebuilds the cube. [dev build]
#   5 = WorldGridMaterial -- LIT, OPAQUE, NO PARAMETERS. THE POSITIVE CONTROL. Run this FIRST:
#       modes 1-4 all need a texture parameter bound before they can be seen at all, and every
#       failure of this probe so far has been that binding rather than anything about captures.
#       Mode 5 cannot come out black for a plumbing reason. If it shows in the pane, captures
#       render AND shade our geometry and a null result from another mode means something. If it
#       does not, nothing measured through this probe has ever meant anything.
#   6 = MI_JackalShield -- THE REAL SHIELD MATERIAL, on a cube. The census found this exact
#       material on all 54 live shield primitives; it arrives with its own textures and parameters
#       already set by the game, so there is nothing of OURS to get wrong. This is the mode that
#       actually answers the question -- every other mode tests a stand-in and argues by analogy.
#       Visible in the pane => the material renders in captures fine, and the shields' absence is
#       about something else (ownership, a per-actor flag, a pass gate we have not found).
#       Invisible in the pane but visible in the main view => the material is what captures will
#       not draw, and that is the answer.
# MEASURED 2026-08-16: modes 3 and 4 came out black in the MAIN VIEW as well as the pane, so both
# A/B runs measured NOTHING and neither is citable. CHECK THE MAIN VIEW EVERY TIME -- a cube that
# is black in both is a broken instrument, not a finding.
# The first diagnosis of that -- "WhiteSquareTexture does not resolve, its pointer is in the module
# address range rather than the UObject heap" -- is itself WRONG and is recorded here so it is not
# made again: mode 5's WorldGridMaterial resolves into that same 0x00007FF4 range and
# is_live_uobject FINDS IT IN THE OBJECT ARRAY. On this build that address range is ordinary and
# says nothing about validity. Why the EmissiveMeshMaterial cubes are black is still OPEN (most
# likely the emissive PARAMETER NAME, not the texture object) -- mode 6 sidesteps it entirely.
# The probe now validates every material and texture against the object array and says "THIS RUN
# PROVES NOTHING" in the log rather than quietly drawing a black cube.
#scopetest=0
#scopetestdist=300
# Keep the cube SMALL ENOUGH TO SEE PAST. The engine Cube is 100 cm and the capture's FOV is
# scopebase/scopezoom -- only 7 deg at 10x, where a 50 cm cube at 300 cm subtends 9.5 deg and fills
# the frame completely. "The pane is black" and "the cube is black" are then the same picture. The
# placement log prints the subtended angle and warns when it fills the frame.
#scopetestsize=0.1
# ---- THE BLACK-FINAL-COLOUR LEVERS ---------------------------------------------------------
# The scope-FX question reduces to ONE unanswered thing. Scene-colour sources (scopesrc=0) render,
# but the engine FORCE-DISABLES post-processing for them (SceneCaptureRendering.cpp:853), so any
# effect whose look is produced in post cannot arrive. Final-colour sources keep post but come out
# SOLID BLACK here. Answer "why black" and the scope shows everything normally.
# These three are per-capture properties that plausibly cause that black and had never been tested.
# All three were verified as real Blueprint-accessible UPROPERTYs in the UE 5.5 source first, and
# all three log a READBACK -- so a null result means "not the cause", not "the write went nowhere".
# Use them WITH a post-processed source (scopesrc=8 or 2); against source 0 they measure nothing.
#
# bAlwaysPersistRenderingState. Shipped at 1 so exposure/TAA state survives between manual captures
# and a low-rate scope holds a steady image. But that persistent state IS a temporal history, and
# the reported symptom -- an unrecognisable image that then FADES to complete black -- is the
# signature of a history converging to black rather than a frame that renders black. 0 drops it.
#scopepersist=1
# bCameraCutThisFrame, forced every tick (the renderer clears it after each capture, so a one-shot
# write would measure nothing). Invalidates the temporal history every frame -- the same hypothesis
# as scopepersist, from the side that KEEPS the persistent state the exposure pin needs.
#scopecamcut=0
# PostProcessBlendWeight. At 0 the capture's own PostProcessSettings do not blend in at all, so if
# the black survives, nothing WE wrote into those settings caused it -- the control the exposure
# pin never had. -1 leaves the engine default untouched.
#scopeppweight=-1
# ---- SHIELD FX CENSUS ------------------------------------------------------------------------
# One-shot, chunked sweep for the LIVE shield primitives (Elite shield meshes, cover/portable
# shields), logged as "SHIELDFX". Answers why they reach the pane as unshaded outlines:
#   bHiddenInSceneCapture set  -> the game simply hides them from captures; one property write
#                                 fixes it and every other theory here is irrelevant. Checked
#                                 first because it has never been looked at.
#   bRenderCustomDepth set     -> they are drawn by a post-process pass keyed on depth/stencil,
#                                 which CONFIRMS the post-processing explanation outright and
#                                 explains the unlit projectiles in the same stroke.
#   material domain/blend/shading -> whether a capture-only stand-in could ever look right.
# Stand near a shielded enemy before enabling; shields stream in with their owners, so an empty
# result just means none were loaded (it re-sweeps as the object array grows, then stops). [dev build]
#scopeshieldcensus=0

# =============================================================== AIM DRIVE (the shipping actuation)
# Which hand aims (right/left). Per-hand calibration files, left seeded by mirroring the right.
# HIDDEN FROM PLAYERS: currently inert in effect -- the newer subsystems do not honour it end
# to end, so it stays here until left-handed support actually works.
#aimhand=right
# How pointing becomes aim. Two writers doing different halves of ONE job -- treat them as one
# setting: blamangles writes the simulation's own aim state (1:1, and what co-op peers see);
# aimdirect assigns the local view so what you see is steady. Either alone is a downgrade (one
# without the other reads as heavy jitter). Both 0 = fall back to steering a virtual stick --
# the lever if a game patch ever breaks the direct path. Ctrl+Page Up swaps the pair live.
#blamangles=1
#aimdirect=1
# Persist the located rotator across launches (halo_vr_aimcache.txt next to this file, keyed to
# the exe's build stamp): a relaunch on the same game build warm-starts through the normal hint
# validation instead of paying the watch hunt. The re-arm log names which cached anchor
# validated (pc-relative vs absolute). 0 = never read or write the cache. Deleting the file is
# always a safe reset -- it is a cache, not configuration.
#aimcache=1
# RUNG 1 -- resolve the aim rotator by DERIVATION instead of hunting it: walk
# PC+0x318 -> +0x3C8 (the owning object) -> +0x1C0 -> +0x20. Microseconds, no hardware
# watchpoints, no thread suspension, and no waiting for the player to move. The candidate still
# has to match the real aim before AND after the aim moves, so a patched struct offset falls back
# to the watch hunt rather than writing anywhere odd. Look for "resolved by CHAIN" in the log.
# 0 = skip the chain, which is both the live A/B and how the watch path stays exercised.
#aimchain=1
# Yaw sign of the simulation write. Flip to 1 only if aim mirrors left/right for the HOST in
# co-op while looking correct locally -- that asymmetry is this knob's one symptom.
#blamanglesysign=-1
# LAYOUT GUARD on the simulation write, 1 = on (the shipped default), 0 = off. UNLIKE the research
# keys in this file, this one is live in every build.
# The mod finds the aim function by SHAPE, so it survives the function moving. Nothing in that
# checks the STRUCT OFFSET it then writes through: if a patch moves the aim field a few bytes, every
# check still passes and the mod stamps aim into whatever now occupies the address. So before arming
# the write it watches whether that field tracks the game's own aim (~25 deg of looking around while
# neither aim driver is writing), and refuses to arm if it does not -- aim falls back to the stick
# loop and the log says WRONG OFFSETS.
# Costs a brief unarmed window when a level starts. What you SEE is unaffected: aimdirect owns the
# local view independently. Set 0 if the guard ever misjudges a build; that restores the old
# always-write behaviour, and it is the A/B to confirm the guard is what changed.
#blamlayout=1
# Recompute aim at input-sample rate (90+ Hz) instead of the ~32 Hz engine tick.
#aimrate=1
# Aim origin: 1 = standing origin (head motion does not move aim), 0 = HMD position.
# With hmdleash=0 the standing origin is no longer a body reference, so 1 uses the head anyway.
#aimorigin=1
# Sightline length in CENTIMETRES (hand translation contributes to aim, not just rotation).
# Was metres before 2026-08-12; a value under 50 is read as legacy metres and scaled, once, loudly.
# ONLY THE FALLBACK RANGE once aimconverge is on -- see below, which measures the range instead.
#xdist=1000

# ---- 6DoF AIM CONVERGENCE
# Aim at the point the reticule's trace HITS, rather than in a direction that is only correct at one
# assumed range. Shots leave from the game camera while you sight from your eye; those are parallel
# but displaced, so a commanded direction alone cannot land on a target at an arbitrary distance.
# Supplying the measured range makes it land. Needs aimreticuletrace, which is where the range comes
# from -- turning that off turns this off.
# NO EFFECT while the head is leashed: the eye and the camera coincide, and the correction declines
# to act below aimconvergemin. This exists for hmdleash=0.
#aimconverge=1
# Smoothing on the measured range, ms. The correction goes as 1/range, so sweeping off a near crate
# onto a distant wall is a STEP in aim; this makes it a glide. Longer reads as aim lagging when you
# change target, shorter and the sweep pops.
#aimconvergetau=120
# Eye-to-camera divergence below which nothing happens at all, cm. Keeps the leashed default
# numerically identical rather than merely nearly so.
#aimconvergemin=3
# Sanity rail on the bend, degrees. Past this the range or the offset is wrong, not the geometry.
#aimconvergemax=30
# Log the offset, the range and the resulting bend every N ticks. 0 = off. [dev build]
#aimconvlog=0
# Measure the game's actual turn rate and adapt the loop (tracks in-game sensitivity).
#gainadapt=1
# VIEW LOCK: cancel aim-induced yaw in VR space so aiming does not drag the head. 0 = the old
# behaviour (aiming turns the view). Structural to the whole control scheme -- not a preference.
#viewlock=1
# Ctrl+<key>: swap direct aim drive <-> steered fallback live (rig mode included). 0x21 = Page
# Up. The A/B lever for the actuation pair; findable by feel in the nav cluster.
#modekey=0x21

# =============================================================== AIM ACTUATION RESEARCH
# aimsrc has been REMOVED. It offered the GRIP pose as a "roll-invariant" aim source; 27,826
# measured samples say the opposite, so keeping the option would send the next reader the wrong
# way. Grip forward is steeply pitched -- mean 41.5 deg, past 60 deg in HALF of all samples -- so
# its yaw is an atan2 over a tiny horizontal projection and swings ~1.08 deg per degree of roll.
# The aim pose is near-level (mean 7.7 deg, past 60 deg in 0.3%) and moves ~0.19 deg/deg.
# Switching sources would have multiplied the coupling about fivefold.
#
# The residual ~0.19 deg/deg is real and physical: the aim pose's forward axis is not the axis your
# wrist rolls about, so rolling sweeps it around a cone. Fixing it needs a roll-invariant
# CONSTRUCTION, not a different pose -- see aimrollfix below.
#
# Log the roll->aim coupling every N calls, 0 = off. [dev build]
#aimrolllog=0
# Direct-path axis signs: +1 writes the setpoint, -1 mirrors about the calibration reference.
# Settled by live experiment; the stick path is unaffected.
#aimdirectsignx=1
#aimdirectsigny=1
# Also write the quaternion the Euler aim derives from. Measured WORSE (a deeper resync
# overwrites it and tracking is lost); kept because it is the correct place to write IF that
# deeper store is ever found and neutralised.
#aimquat=0
# Write the quaternion SOURCE field -- the one level where a resync could land on our value
# instead of reverting. Candidate fix for aim snapping back on firing.
#aimquatsrc=0
# Alternate the emitted stick value by one raw LSB per frame so the exe's change-gated input
# poll always dispatches it. Not yet measured live.
#stickdither=0
# 0 = drive yaw only; pitch stays on the HMD / game default.
#pitch=1

# =============================================================== FALLBACK STICK LOOP (plant + tuning)
# Only active when blamangles=0 / aimdirect=0 (the steered-stick fallback).
# Deadband in degrees: errors below this park the stick instead of hunting.
#dead=0.50
# Velocity feedforward. 0 = off; raise toward 1.0-1.2 if fast sweeps lag the hand.
#ffgain=0
# Damping against overshoot / rubber-banding after fast turns.
#dgain=0.40
# Smoothing TIME CONSTANTS in ms: ffsmoothms filters the target rate (costs responsiveness --
# keep small); dsmoothms filters the measured rate damping works from (nearly free; raise it
# if the stick buzzes at rest).
#ffsmoothms=16
#dsmoothms=31
# Stick deflection the game starts responding to (measured ~0.24 on this title).
#floor=0.28
# Aim error in degrees that saturates the virtual stick.
#full=6.0
# Ceiling on deflection. Keep 1.0: the response curve is steeply exponential and the top of
# the range is where large corrections actually close.
#max=1.0
# Deadband hysteresis (Schmitt trigger): once moving, re-park only below dead*deadhyst.
# 1.0 = no hysteresis. Kills threshold chatter kicking the yaw stick during pitch sweeps.
#deadhyst=0.5
# Scale yaw feedforward by cos(pitch): removes the projection-artefact yaw noise injected by
# steep pitch, without touching genuine horizontal tracking.
#ffpitchcomp=1
# Full-deflection turn rate, deg/s, anchoring the measured plant curve to the configured
# sensitivity. 363.6 measured at LookSensitivity90 / deadzone 0 / acceleration min.
# 0 = estimate live from the adaptive gain (serviceable but coarse).
#plantfulldps=363.6
# Pin the plant gain (deg/s per unit of stick) instead of measuring live; also makes the plant
# constant across a tuning run. ~226 measured on this title. 0 = measure.
#measrate=0
# Starting plant gain before anything is measured (0 = built-in reference). Writing a NEW
# value mid-session resets the learned gain and re-converges -- the deliberate way to
# reproduce the startup transient.
#gainseed=0
# Closing profiles (each 0 = off; they supersede the legacy linear error->deflection map):
#   aimtau      close ~63% of remaining error per tau seconds (cannot go below loop latency)
#   aimdecel    constant-deceleration arrival, deg/s^2 (crisp stop; tune on sweep-stop)
#   aimdeadbeat >0 = per-tick closing factor, 1.0 = true deadbeat (valid because the plant
#               measured memoryless 2026-08-06). Loses tau's tremor filtering -- smooth the
#               TARGET instead (aimtargetsmoothms).
#aimtau=0
#aimdecel=0
#aimdeadbeat=0
# Smoothing time constant in ms applied to the controller angles the loop chases. Costs target
# latency, not convergence speed. Try 20-40 if aim reads jittery in-headset.
#aimtargetsmoothms=0
# Report mean/max |yaw error| every N ticks, 0 = off. [dev build]
#aimstat=0

# =============================================================== BLAM SIM RESEARCH  [dev build]
# The diagnostics that located the aim solution; docs/BLAM_AIM_FINDINGS.md (private research
# tree) records the campaign and the refuted paths. All of these exist only in dev builds.
# One-shot: resolve the Blam object table and report which object's field matches the aim.
# Higher stages are redirect probes.
#blamaim=0
# Trim on the redirected shot direction, degrees (calibration + causality test, blamaim>=3).
#blamyaw=0
#blampitch=0
# Dump the head of projectile spawn params (first 40 spawns) -- locates the shooter field.
#blamdump=0
# Dump a Blam object's float fields by handle (~0.7 Hz), and how many bytes of it (the aim
# state sits past 0x200).
#blamobj=0
#blamobjlen=0x200
# One-shot: find the player's Blam object by matching a spawn's muzzle origin.
#blamfind=0
# Aim-field sweeps -- unit-vector scan / scalar Euler scan / sim-module writable globals.
# 1 = collect at this pose, 2 = verify after moving the aim.
#blamscan=0
#blamscan2=0
#blamscan3=0
# Log the base direction handed to the spread function vs ControlRotation (needs the write
# paths off, or it reads our own value back).
#blamnode=0
# BLAMCTL report cadence, writes between log lines, 0 = off. Prints commanded vs achieved vs
# record read-back at one instant -- the reticle-vs-shot divergence instrument. Parsed in
# every build; the report itself is dev-only.
#blamctllog=4000
# FAULT INJECTION -- bitmask. Breaks one rung of the address-resolution cascade ON PURPOSE so the
# rung BELOW it can be watched doing its job. Unlike every other key in this file this one is
# compiled out of the release DLL entirely, so in a shipping build it does nothing at all: it is
# for contributors running Scripts/Build-AimDriver.ps1, not for players.
# Why it exists: the fallbacks only ever run when a game patch has already moved something, i.e.
# never on a working machine. Untested recovery code is a guess. Injecting the fault is the only
# way to see the recovery actually recover -- it is how the watchdog's countdown was found to be
# 64x too slow to ever fire (it counted ~2 s ticks as if they were frames).
#   0x001 hook installs but is NEVER CALLED -> watchdog rules it dead, TEB scan takes over.
#         Must be set before the game starts; the hook-ran flag latches for the session.
#   0x002 getter signature matches nothing   -> falls back to the recorded RVA
#   0x004 getter signature matches twice     -> ambiguous, refuses it, falls back to the RVA
#   0x008 _tls_index sits at a different RVA -> "BUILD DIFFERS" (patch / other store's binary)
#   0x010 signature and recorded RVA disagree-> "getter MOVED", trusts the signature
#   0x020 PE TLS directory unreadable        -> sim aim write DISABLED, never aimed at a guess
#   0x040 announce the periodic re-resolve   -> normally silent unless the answer changed
#   0x080 corrupt AimDirect's cached offset  -> hint rejected, falls through to the watch
#   0x100 AimDirect locate always fails      -> gives up after 5 attempts, back to the stick loop
#   0x200 freeze the layout guard's field    -> the offset landing on something DEAD; the guard
#         must refuse to arm the sim write. Needs aimdirect=0 to have a sampling window.
#   0x800 read the aim ONE FIELD LATE        -> the offset landing on the NEIGHBOURING field, which
#         is what a patch that inserts a struct member actually does. This is the realistic failure
#         and the more important of the two: the neighbour moves just as much as the field we
#         wanted, so a check that only asks "does it move?" passes it. The guard compares VALUES
#         against the game's own aim, so it sees a ~139 deg disagreement instead. Same aimdirect=0
#         requirement.
#   0x400 starve AimDirect of evidence       -> nothing is ever caught, so each stage must run out
#         its ~24 s clock and take the TIMEOUT branch. Different path from 0x100, which lets a
#         candidate be found and then rejects it (fast, never reaches the timeout code).
# Combine freely (0x00C = 0x4|0x8). Scripts/Verify-BlamSignature.ps1 checks the signature offline
# against a patched exe without launching anything.
#blamfault=0

# =============================================================== MEMORY & TRACE TOOLS  [dev build]
# Aim-loop trace recorder: 0->1 arms, 1->0 writes halo_vr_trace_NNN.csv beside this file.
# Lag and jitter feel identical in a headset and separate trivially in a trace.
#aimtrace=0
# Heap value scan for Blam-side data that reflection cannot reach: comma-separated float
# signature, hit cap (0 = 512), then 0->1 starts one background scan.
#memscanvals=
#memscanmax=0
#memscan=0
# Differential scan: 1 snapshot, 2 changed-blocks -> candidates, 3+ narrow, 0 clear.
#memdiff=0
# AIMDIG: 0->1 with aimdirect resolved runs ONE off-thread derivation-chain report for the aim
# rotator (allocation census, exe-data static-root scan, pointer-graph walks from the sim TLS
# block and the quat-source object). Compare the AIMDIG lines across two launches: whatever stays
# constant is a per-launch anchor that could replace the watchpoint hunt. [dev build]
#aimdig=0
# Hardware write-watchpoint: logs the distinct instructions writing ControlRotation.Yaw, then
# auto-disarms. addr 0 = derive from the live PlayerController.
#aimwatch=0
#aimwatchaddr=0

# =============================================================== WEAPON RIG INTERNALS
# Master switch: drive the first-person arms/gun from the controller. 0 = the game's own weapon
# pose (aim itself still works).
#rig=1
# Drive the shield/overshield glow shell with the arms (0 leaves it where the game puts it).
#shell=1
# Visibility preferences, HIDDEN FROM PLAYERS until they hold in all scenarios; promote back to
# the user catalog once they do. showarms=0 hides the first-person arms at all times while
# keeping the attached weapon visible (the weapon subtree is re-shown via its root component
# after the propagated hide). showweapon=0 hides the weapon actor too (SetActorHiddenInGame --
# independent of the bVisible tree, so the two compose).
#showarms=1
#showweapon=1
# Frame of the rig's relative transform: 0 = aim error, 1 = absolute, 2 = parent-relative,
# 3 = DIRECT DRIVE (default) -- weapon held rigidly by the controller, pivot MEASURED rather
# than folded into the mount. Pairs with aimdirect; Ctrl+PageUp swaps both live.
#rigmode=3
# Drive translation as well as rotation.
#rigloc=1
# cm of rig movement per metre of hand movement. MUST include UEVR's world scale: the shipped
# profile runs VR_WorldScale=1.312, so a plain 100 under-translates ~24% and reads as BOTH
# "translation feels slow" AND "the pivot is off".
#rigscale=131.2
# Per-axis clamp on rig translation, cm. 0 = none -- a saturating axis rotates the offset
# vector, corrupting direction, not just reach.
#rigclamp=0
# Anchor hand translation to the body -- the STANDING ORIGIN, as UEVR's own controller
# attachments do -- rather than to a raw room point. 0 drops the anchor entirely (A/B only).
#riganchor=1
# Sign of the room->game view-yaw correction: 1 = apply, -1 = negated, 0 = off.
#rigviewyaw=1
# Subtract a captured neutral from the hand offset (displaces the rotation centre; A/B only).
#rigneutral=0
# Sign of the snap/smooth-turn correction in the rig frame, and separately for the aim
# mapping -- the two frames' sign conventions are independent, one in-headset A/B each.
#rigturn=1
#aimturn=1
# Re-apply the rig rotation at render rate (removes the ~14 deg inter-tick sawtooth felt as
# arm shake during aim turns).
#rigrender=1
# Write a constant Z offset of this many cm instead of tracking -- one unambiguous test of
# whether the write lever works at all. 0 = normal tracking.
#rigtest=0
# 0 = our rig driver writes the transform; 1 = hand the arms to UEVR's own UObjectHook
# motion-controller attachment (persistence stays ours either way).
#attachmode=0
#attachpermanent=0

# ---- Pivot tools. The pivot VALUES (pivauto, pivx/y/z) are calibration data in halo_vr.cfg.
# Which socket estimates the pivot before a second calibration sample measures it.
#pivsocket=PrimaryWeapon
# Manual nudge ADDED to the auto-read pivot, cm, component-local.
#pivadjx=0
#pivadjy=0
#pivadjz=0
# Pivot markers: shrink the rig itself onto the pivot (pivviz, at pivvizscale); debug-sphere
# radius in cm (pivdraw; inert in shipping builds); borrowed level prop parked on the pivot
# (pivcube, works where DrawDebug does not) scaled to pivcubescale cm.
#pivviz=0
#pivvizscale=0.05
#pivdraw=0
#pivcube=0
#pivcubescale=6

# =============================================================== MOVEMENT FRAME
# Rotate the left stick into the view frame so push-forward = walk where you look. 1 = apply,
# -1 = negated (measured correct on this title), 0 = off.
#moverot=-1
# View-yaw source for that frame: 0 = UEVR's post-stereo rotation, 1 = rebuilt as
# pinned + turn + HMD yaw.
#movesrc=0
# Where the aim term is sampled: 0 = tick-latched, 1 = live head + smoothed aim, 2 = live
# head + commanded aim, 3 = live head + SAMPLED aim (same call, no publication lag; default).
# Older configs said 4 -- every test is >=, so 3 and 4 behave identically.
#movelive=3
# Per-tick smoothing of the aim term, 0 = off. 0 is right for movelive=3: view and aim are
# sampled in the same call, so there is no inter-source lag left to damp.
#movesmooth=0
# Log the movement-frame residual every N applications, 0 = off. [dev build] The residual's
# SHAPE is the diagnosis: transient-and-settling = sampling lag; persistent and proportional
# to hand rotation = wrong frame or gain; ~0 while the walk still bends = the sim does not
# move in the aim frame at all.
#moveresid=0

# =============================================================== RETICULE INTERNALS
# What the reticule ray is built from: 0 = the GAME's aim -- truthful, shows the loop residual,
# USE THIS WHEN TUNING AIM. 1 = the controller setpoint -- smooth, but it lies exactly when the
# loop is impaired (auto-falls-back whenever the aim law is not armed).
#aimreticulesrc=0
# Divergence guard for src=1: snap back to the true aim once the gap exceeds divdeg degrees
# continuously for divms ms (releases at half divdeg -- hysteresis, cannot flap).
#aimreticuledivdeg=8
#aimreticuledivms=600
# Trace internals: collision channel (ETraceTypeQuery index; 1 = Camera, the shipping choice --
# ignores the invisible blocking/trigger volumes that 0 = Visibility hits) and how far to look
# for a surface at all, cm.
#aimreticuletracechannel=1
#aimreticuletracemax=15000
# Motion gate for the reticule smoothing filters, deg/s of controller swing: full strength at
# or below slow, none at or above fast (smoothing helps a still hand, only lags a sweep).
#aimreticulesmoothslow=20
#aimreticulesmoothfast=120
# Publish the aim ray as a Lua event for an external uevrlib-based script. No such script
# ships; with nothing listening it formats a JSON payload ~26x/s for no consumer.
#aimreticulelua=0
# Borrowed-level-prop marker (removes set dressing from the map; diagnostic) and its size, cm.
#aimreticulecube=0
#aimreticulecm=12
# Collapse the game's OWN flat crosshairs other than the hosted one -- mission transitions
# rebuild the HUD and paste a screen-space crosshair over the world-space one.
#aimhidenative=1

# =============================================================== CROSSHAIR WIDGET DIAGNOSTICS
# UMG draw size (square, px) and EWidgetBlendMode (0 opaque, 1 masked -- eats thin crosshair
# lines, 2 transparent).
#aimwidgetdraw=256
#aimwidgetblend=2
# Build our own translucent MID and bind the render target to it, instead of the stock
# pass-through material (the stock material + gain/tint is what ships).
#aimwidgetmat=0
# Adds 180 deg of yaw if the crosshair ever renders mirrored or edge-on.
#aimwidgetflip=0
# Extra alpha multiplier on the sampled widget.
#aimwidgetalpha=1.0
# Paint the widget quad's background opaque red. One run separates three causes: red+crosshair
# = fixed; red only = content not reaching the target; nothing = the quad is not rendering.
#aimwidgetbg=0
# Host a freshly created reticle instead of the HUD's live one (loses the hit marker;
# isolates re-parenting from component setup).
#aimwidgetfresh=0
# Host a DIFFERENT widget class by name substring (empty = the first-person reticle). A
# plainly-coloured widget rendering in colour proves the framework and indicts the reticle's
# own material.
#aimwidgetclass=
# Use the hosted widget's render target as the mesh reticule's texture -- shows the widget's
# TRUE pixels through a material that provably passes texture RGB. [dev build]
#aimrtwidget=0
# One-shot sweeps: cooked materials overriding a texture parameter AND exposing a colour
# (texhunt); cooked game materials with a colour parameter (mathunt); parameter-dump the
# comma-separated material paths (matdump). [dev build]
#texhunt=0
#mathunt=0
#matdump=
# Exact texture parameter name to bind the reticule texture under (from texhunt/matdump;
# empty = the candidate list), and a Texture2D object path to probe (empty = candidates).
#aimtexparam=
#aimtexpath=
# ---- Ring reticule plumbing (the ring's player-facing toggles/size/colour are in the user
# catalog). Which cooked GAME assets the ring is built from -- if a game patch moves or strips
# either path the ring stops appearing (log.txt shows the load failing); point aimmeshparent at
# another material, or rely on the hosted-widget crosshair. See docs/TROUBLESHOOTING.md.
#aimtex=1
#aimmeshpath=StaticMesh /Game/FX/Meshes/Primitives/Torus/SM_Torus_ThinDense_01.SM_Torus_ThinDense_01
#aimmeshparent=/Game/FX/Meshes/Debug/Materials/MI_Arrow.MI_Arrow
# Unlit pass-through keeps the ring readable against dark geometry.
#aimmeshunlit=1
# Ring orientation offset (the torus axis must face the viewer).
#aimtexrotp=-90
#aimtexroty=0
#aimtexrotr=0
# 0 = keep the ring mesh asset's own material instead of the override family.
#aimmeshmat=1
# Runtime-generated render target as the reticule texture (solid-fill proof of path), and its
# size in px.
#aimrt=0
#aimrtsize=128
# Park the mesh reticule on the VIEW axis, dead centre of frame, for automated measurement
# runs (an off-frame quad reads all-zero, indistinguishable from a real negative).
#aimparkview=0

# =============================================================== DEBUG DRAW (inert in shipping game builds)
# DrawDebugSphere reticule. UE compiles DrawDebug* out of shipping builds, so on this game the
# call succeeds and draws NOTHING -- kept for builds where it works.
#aimdraw=0
# Radius (cm at reticule distance), segments, seconds per draw (must exceed the ~31 ms tick or
# it strobes), line thickness, RGB 0-1.
#aimdrawr=5
#aimdrawseg=16
#aimdrawdur=0.05
#aimdrawth=3
#aimdrawcr=0.1
#aimdrawcg=1.0
#aimdrawcb=0.2

# =============================================================== FLAT-HUD RETICLE (legacy lane)
# Steer the game's own screen-space reticle via its UMG render translation instead of hosting
# a world-space widget. Superseded: the flat HUD quad spans only +/-20.7 x +/-12.0 deg while
# aim offsets reach 27 deg. Kept as a fallback. (hudhide lives in halo_vr.cfg.)
#hudfollow=0
# 1 = engine projection for the offset; 0 = the hudk * tan(angle) constant, clamped at hudmax
# px so a snap turn cannot fling the reticle off-canvas.
#hudproject=1
#hudk=1000
#hudmax=700
# Write FVector2D as float instead of double if a build ever misreads the UE5 LWC type (the
# symptom is the reticle jumping to a nonsense position).
#hudfloat=0
# Degrees subtracted from the measured offset -- trims a constant frame bias by observation.
#hudtrimyaw=0
#hudtrimpitch=0

# =============================================================== DISCOVERY DUMPS (one-shot)
# Log MeteoriteHudVisibility's properties (per-element HUD switches) / live widget classes
# with menu-ish names (corrects the menu match list from observation).
#huddump=0
#menudump=0

# =============================================================== STICK MODE & MENU DETECTION
# The machinery behind the automatic gamepad-controls switch; the player-facing recourse
# (`stickforce`) lives in the user catalog.
# Master switch for stick mode itself. 0 = motion aim stays on everywhere (vehicles become
# near-unplayable; A/B only).
#stickmode=1
# 0 = auto-detect, 1 = always stick mode, 2 = never. The field lever when the detector misses
# a seat (get the seat reported).
#stickforce=0
# Detector debounce, seconds: no-weapon must hold this long to enter; weapon back this long to
# leave. Raise stickon if weapon swaps ever false-trigger stick mode.
#stickon=0.75
#stickoff=0.05
# Keep motion aim while ON FOOT with no weapon (the campaign opens unarmed; "no weapon" is also
# what a vehicle seat looks like from outside). 0 = the pre-fix behaviour, and the fallback if
# a seat or scripted sequence ever keeps hand-aim engaged when it should not.
#stickonfoot=1
# Hide the empty T-POSED arms while on foot unarmed. Players must never see the T-pose, so this
# is not a player option -- 0 is the lever for arm-IK development, when seeing the unarmed arms
# is the point.
#hidearms=1
# Menu handling: suppress the gameplay-only remaps while a menu is up, and use the widget-based
# menu detector (pause menus keep the gameplay PlayerController, so the frontend test alone
# cannot see them).
#menusuppress=1
#menudetect=1

# =============================================================== CUTSCENE FLATTEN (unverified)
# Hidden from players until it works. Cutscenes are pre-rendered videos, doubled in raw stereo.
# 0 = off (shipping). 1 = UEVR's flat 2D Screen Mode for the scene -- on SteamVR's OpenXR
# runtime the screen may not composite in-headset (the desktop mirror always works, and the
# hint overlay says so in VR). 2 = mono collapse: fuses the world, not the movie. A grip
# squeeze force-releases a stuck flatten.
#cutscene2d=0
# The in-VR hint overlay (cutscene_hint.png): on/off, then cm from the head: ahead, drop, width.
#cuthint=1
#cuthintdist=180
#cuthintdrop=75
#cuthintw=110

# =============================================================== VEHICLE BRAKE DELIVERY
# How the grip hard brake reaches the game; the player-facing on/off (`brake`) stays in the
# user catalog. Field-tested 2026-08-01: synthesized keyboard does NOT reach this title's
# driving input, so the pad path is the shipping route.
#   3 = press the pad button in brakemask (0x1000 = A, this game's vehicle hard brake) - DEFAULT
#   2 = pull the left stick full back while gripping (this game reads it as reverse)
#   1 = hold the keyboard key in brakekey (does not reach this title's driving - reference only)
#   0 = off
# Master on/off for the grip hard brake.
#brake=1
#brakemode=3
#brakemask=0x1000
# Windows virtual-key code for mode 1. 0xA2 = Left Ctrl.
#brakekey=0xA2

# =============================================================== GAME SENSITIVITY PINNING
# Settings applied only WHILE MOTION AIM DRIVES; the player's own values return in stick mode
# and nothing is written to disk. The aim loop wants max look sensitivity / min deadzone
# (they are its authority ceiling and smallest step); a human driving a Warthog wants neither.
# EBlamLookSensitivity index (x5 = the menu's number; 18 = "90"). 0 = leave the player's.
#vrsens=0
# Look deadzone as a PERCENTAGE (the game's own unit). Negative = leave the player's.
#vrdeadzone=-1
# EBlamLookAcceleration index. 0 (minimum) is REQUIRED for any plant inversion to be valid;
# -1 = leave the player's.
#vraccel=-1
# Software compensation while in STICK MODE for the pinned-high sensitivity: scale the
# player's look stick, and re-impose a deadzone the game no longer applies.
#stickscale=1.0
#stickdz=0

# =============================================================== SESSION / HARNESS
# THE KILL SWITCH. enabled=0 stands the whole driver down on the next tick: stick neutral, view
# lock and remaps released, stereo continues. Deliberately NOT a player option: with motion
# controllers in hand there is nothing left to aim with (it does not fall back to a
# native-gamepad-aim profile), so it only confuses -- it exists for support and testing.
# Ctrl+Home toggles it live (game window must be focused).
#enabled=1
# The Ctrl+<key> kill-switch hotkey, virtual-key code. 0x24 = Home; 0 disables the hotkey.
#killkey=0x24
# Require is_hmd_active() before driving. 0 for headless runs under a null/simulated SteamVR
# driver (SimVR), which reports the HMD inactive regardless.
#requirehmd=1
# Raise UEVR's motion-controls inactivity timeout at startup (prevents the "suddenly 3DoF until
# a button press" pose freeze). 100 = the slider maximum; 0 = leave UEVR's setting alone.
#vrinactivity=100
# Edge-triggered: write any NEW number to re-capture the neutral where your hand is right now
# (a sticky boolean cannot work in a file re-read every 2 s).
#recenter=0
# Edge-triggered: force a full view-lock re-prime from the CURRENT camera yaw -- reproduces
# the mid-mission-injection state from an ordinary menu-injected session. [dev build]
#lockreprime=0
# Scenario marker echoed into RIGTRACK log lines so a measurement harness can label poses
# instead of correlating by wall clock. [dev build]
#dbgmark=0

# =============================================================== VIEW-CONSUMER FIXES (experimental)
# Aim steers the game's camera; the view lock cancels that for the EYES only. The audio
# listener and the screen-space waypoint projection still read the game camera, so both are
# wrong by the aim-vs-view delta on foot -- and already correct in vehicles, where the lock
# stands down. Both fixes engage only while the lock is cancelling and RELEASE on stick mode /
# frontend / kill switch. Experimental: promote to the player catalog once a headset session
# confirms each one.
#
# Drive the audio listener to the rendered view (SetAudioListenerOverride via reflection).
# SETTLED 2026-08-12: resolves and applies on this build but does NOT move what Wwise hears
# (panning kept tracking the controller with it engaged). Kept because it may cover UE-side
# non-Wwise sounds; the real lane is audiocomp below.
#audiofix=0
# Drive the game's OWN listener -- the HaloAudioListenerComponent on BP_BlamCameraManager_C,
# found by the audiodump survey -- to the rendered view (world write per tick; the authored
# relative transform is restored on release, so vehicles/cutscenes hear exactly as shipped).
# Watch for "AUDIOCOMP: listener resolved/DRIVEN"; judge by ear with the controller held still
# and the head turning -- panning should now track the head and ignore the hand.
#audiocomp=0
# One-shot survey of Ak/Audio/Listener/Wwise objects (edge-triggered: change the value to
# re-run; 0 disarms). Finds the live Wwise listener component for the fallback lane. [dev build]
#audiodump=0
#
# Shift the game's screen-space navpoint/waypoint layer back onto the rendered view.
# First-order: exact at the view centre, approximate off-centre; edge-clamped off-screen
# markers will still sit wrong. Watch for "NAVFIX: N navpoint container(s) resolved" -- 0 with
# navfix=1 means the navclass guess below is wrong (menudump=1 lists live widget names).
#navfix=0
# Widget class-name substring collected as the navpoint layer (pak-inventory guess, unconfirmed).
#navclass=WBP_Navpoints
# 1 = derive the shift from the game's own projection (no constant to calibrate);
# 0 = navk*tan(delta) fallback, dial navk in by observation (same meaning as hudk).
#navproject=1
# 1 = apply at render rate from the stereo callback, yaw-only, with the projection probe
# demoted to calibrating pixels-per-tan (the tick-rate writer lagged the delta and read as
# jitter -- player-tested). 0 = the old tick-rate direct write, kept for A/B.
#navrender=1
#
# WORLD-SPACE NAVPOINTS -- the lane with no angular ceiling (the flat HUD quad spans only
# ±20.7°×±12°, so no screen-space math can pin a marker on an enemy 30° off-centre). One unlit
# mesh marker per live navpoint, placed along the world direction recovered by inverting the
# game's own projection (self-calibrating; watch "NAVWORLD: N marker(s) world-placed").
# Supersedes the navfix shift while on -- the flat layer stays game-native beneath it. Markers
# the game already edge-clamped (its off-screen arrows) carry no recoverable direction and are
# skipped; the flat layer's arrows still cover those.
#navworld=0
# PLACEMENT: exact direction, managed distance. The objective's TRUE world position is known
# (navworldsrc=2), but drawing the marker AT it buries it behind terrain and shrinks it to a
# speck at range -- so it is drawn along the true direction at min(true, navworldmax), pulled in
# front of intervening geometry by a trace, with apparent size held constant. Direction (the
# information) stays exact; the range it is drawn at is not meant to be readable.
# 400 cm: drawing CLOSE is what makes occlusion a non-problem. A single trace ray only clears
# what that ray hits -- a vehicle beside it or a rock lip under it still occludes a quad that has
# width -- so the marker rides 4 m out along the true direction, where almost nothing can get in
# front of it, at constant angular size. Raise it if markers start feeling detached from depth.
#navworldmax=400
#navworldtrace=1
# Stand-off from a traced surface: the larger of this and 20% of the hit distance.
#navworldsurf=60
# The widget class each marker hosts; empty = WBP_NavpointObjective_C. That one is authored for
# a HUD canvas (icon PLUS distance/label block) so it frames oddly hosted alone -- a bare name
# is enough to A/B the alternatives live: WBP_NavpointWidgetPlayer_C, WBP_TrackedTargetNavpoint_C,
# WBP_NavpointWidgetBase_C, WBP_NavpointDestination_C. The creation log prints the widget's
# desired size and the draw size actually used.
#navworldclass=
# Draw size px for the hosted quad (0 = 128).
#navworlddraw=0
# PER-KIND SIZE, multiplying navworldscale. Kind comes from the navpoint's own widget class, so
# it follows the game's typing: an objective should read from across the level, a last-known
# enemy mark is situational, a floor weapon should not compete with either.
#navsizeobj=0.8
# Co-op partners / allies. A PLACEHOLDER, not a measured preference -- co-op has not been played
# through this. Above enemy because a partner marker is navigational rather than situational.
#navsizeally=0.17
#navsizeenemy=0.25
#navsizeitem=0.2
# Unclassified navpoints. Defaults to the objective size deliberately: an unknown kind drawing
# LARGER than every known one is the wrong failure. If the log shows [kind=other] on something,
# tell me the class name and it gets classified properly.
#navsizeother=0.8
# PER-CLASS override, "ClassSubstring:mult" comma-separated -- beats the kind defaults. The kind
# buckets are a guess at this game's taxonomy and one was already wrong (WBP_NavpointDestination_C
# filed as an objective at x0.8 when the field reads it as an enemy mark). Read the class names
# straight off the "NAVWORLD: slot N = ..." log lines and size them directly:
#navsizeclass=WBP_NavpointDestination_C:0.25
# Draw the marker this many cm SHORT of the thing it marks (the reticule's surface offset, aimed
# at the objective instead of a wall). Only bites when the objective is nearer than navworldmax.
#navworldback=50
# WHICH image child to host when a navpoint layout carries more than one (on-screen icon vs
# off-screen arrow). The creation log prints how many were found and which was taken.
#navworldimg=0
# Image collection lane. 1 (default) = verify-then-trust: the FIRST host of each marker class
# runs both the object-array walk and the reflection tree walk, serves the array result, and
# certifies the tree lane only when both sequences match exactly ("NAVWORLD: tree lane VERIFIED"
# in the log) -- later hosts of that class then collect in microseconds instead of a ~10 ms
# array pass. 0 = array walk everywhere: the live A/B, and the drill that keeps the fallback
# lane proven. The creation log names the lane used (lane=tree/array/...).
#navwtree=1
# Hide the game's flat navpoint layer while world markers are placed. Tied to markers actually
# existing, so any failure of the world lane restores the game's own markers.
#navhideflat=1
# Legacy fixed distance -- lanes 0/1 only, ignored by navworldsrc=2.
#navworlddist=1500
#navworldscale=0.5
#navworldcr=1.0
#navworldcg=0.85
#navworldcb=0.1
# Per-marker inversion samples in the log, every ~2 s. [dev build]
#navworldlog=0
# THE WAYPOINT-POSITION HUNT (one 5-minute in-headset protocol; the plugin reads your position
# itself -- you never type a coordinate). Stand ON/AT an active objective, then step through:
#   navscan=1   (wait for "MEMSCAN done" in the log, ~10-30 s)   then navscan=0
#   navscan=2   (wait)                                            then navscan=0
#   navscan=3   (wait)                                            then navscan=0
# Walk 20+ metres away, and repeat the same six edits. Done -- the offline analysis crosses the
# two capture sets to find the record that stored the OBJECTIVE's position rather than yours.
# 1/2/3 are unit hypotheses (UE cm / Blam world units / metres), all float X,Y. [dev build]
# navscan=4 = the TLS-GRAPH WALK: stand at the objective and set it once -- searches the pointer
# graph reachable from the sim's TLS root for the objective's world-unit pair, logging each hit
# WITH ITS CHAIN ("TLSNAV HIT L2: block+0x.. -> +0x.. -> .."). A chained hit is the stable anchor
# the marker placement needs; the heap scans (1..3) proved the value only otherwise appears in a
# relocating event buffer. Requires blamangles to have resolved once (it publishes the root).
#navscan=0
# Include the pitch term. Set 0 if markers overshoot vertically -- UEVR's DecoupledPitchUIAdjust
# already moves the whole UI quad for pitch, and the two may double-count.
#navpitch=1
#navk=1000
# Shift clamp, px.
#navmax=2000
#
# THE CULLING FIX (settled live 2026-08-12, player-confirmed): re-applies
# Blam.Synchronization.Relevancy.OutOfViewCullDistance=culldist per level (+ ~1/min insurance;
# level loads reset cvars). The distance term ALONE fixes aim-keyed body culling. Its sibling
# CullByBlamVisibility is deliberately left stock -- zeroing it froze ambient animation (birds)
# and the FP arms, because the visibility term WAKES actors as well as culling them. No un-exec:
# cullfix=0 stops re-applying, restart restores stock. Default off pending the perf soak.
#cullfix=0
#culldist=9999999
# LADDER RESULTS 2026-08-15 (restart-disciplined, in-headset) -- READ BEFORE RE-LITIGATING:
#   * cullhead REFUTED both ways: with a verified baseline repro, cullhead=1 alone from boot
#     neither kept bodies visible (cull side) nor woke aimed-away creatures (wake side, proven
#     in both directions via the displacement method). The terms are registered and writes
#     land; they just do not govern these behaviours on this build.
#   * The WAKE freeze (birds etc., aim-keyed) survives the ENTIRE named cvar surface:
#     Blam.EffectThrottling.Enabled 0, Blam.Synchronization.Relevancy.DisableAnimationOnNoMotion 0,
#     Blam.Synchronization.Throttling.Enabled 0 -- all exec'd live (log-verified), no change.
#     Post-release lane: hunt the facing-weight state in Blam memory (the NAVSCAN playbook).
#   * SHIPPED: cullfix=1 culldist=40000 as compiled defaults (user decision) -- cures body
#     culling, bounds the perf cost. Release notes must mention it.
#cullhead=0
#
# One-shot navpoint/CHUD recon dump (edge-triggered: change the value to re-run) -- lists live
# Navpoint/Waypoint/HudDataAsset objects and each class's property names+offsets, looking for
# the camera-rotation input that feeds the marker projection. [dev build]
#navdump=0
#
# Console-command harness: each key holds ONE command, executed when its value CHANGES at the
# ~2 s config poll and logged loudly ("DEVEXEC[n] ACTIVE"). No un-exec exists -- clearing a key
# only stops it re-applying; set the inverse command or restart to revert. Built for the
# culling hunt: the Blam relevancy cvars are strings in the binary whose READS return garbage,
# so a write experiment is the only way to learn if they are live. Candidates, in order:
#   Blam.Synchronization.Relevancy.CullByBlamVisibility 0

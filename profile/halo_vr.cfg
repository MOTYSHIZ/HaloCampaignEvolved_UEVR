# halo_vr.cfg - configuration for the Halo: Campaign Evolved VR plugin (halo_vr.dll)
#
# This file is RE-READ LIVE every ~2 seconds while the game runs. Edit, save, and the change
# applies without restarting. Lines starting with # are comments. Values shown are the defaults.

# ================================================================= AIM
# The aim loop steers Halo's own aim (via synthesized right-stick input) to follow your controller.

# Master switch for the whole driver.
enabled=1

# Render-rate control: recompute the aim law at the rate the game samples input, from a fresh
# controller pose, instead of once per (slower) engine tick. 0 restores tick-rate control.
aimrate=1

# Stick deflection the game starts responding to (measured ~0.24 on this title).
floor=0.280
# Aim error (degrees) that saturates the virtual stick. The adaptive gain rescales this live.
full=6.00
# Deadband in degrees: errors below this leave the stick parked...
dead=0.50
# ...and once moving, the aim re-parks only below dead*deadhyst (hysteresis stops edge chatter).
deadhyst=0.50

# Velocity feedforward: drives the stick to MATCH your hand's angular rate outright, so tracking
# does not need a standing error. Raise toward 1.2 if fast sweeps lag; lower toward 0.8 if they
# overshoot. 0 disables (pure proportional).
ffgain=0
# Damping against overshoot / rubber-banding after fast turns.
dgain=0.40
# ---- SMOOTHING, GROUP 1 OF 2: THE AIM LOOP ---------------------------------
# These two filter the loop's INPUTS. They change how the gun tracks your hand.
# For the reticule's own filters -- which change only what you SEE -- see
# group 2, further down under the reticule section.
#
# ALL smoothing here is a TIME CONSTANT IN MILLISECONDS: how long the filter
# takes to close ~63% of a gap. LOWER = more responsive, HIGHER = calmer and
# laggier, 0 = no filtering at all. Being a time, it means the same thing at
# every frame rate -- the older 0..1 blend fractions did not, and smoothed about
# three times harder at 30 fps than at 90. Those old key names are still
# accepted and converted assuming 90 fps, so an existing config keeps its feel.
#
# ffsmoothms - the TARGET rate, i.e. how fast the loop thinks your hand is
#   moving (the feedforward input). Raise if fast sweeps feel buzzy; lower if
#   they feel like they start late. Costs responsiveness directly, so keep small.
ffsmoothms=16
# dsmoothms - the MEASURED aim rate that damping works from. Deliberately
#   heavier than ffsmoothms: this is where stick buzz actually comes from, and
#   filtering it costs almost no responsiveness. Raise if the stick buzzes when
#   you hold still.
dsmoothms=31
# Reduce yaw feedforward when aiming steeply up/down (compensates quaternion yaw noise at pitch).
ffpitchcomp=1

# Adapt the loop gain to the game's actual turn rate (tracks in-game sensitivity settings).
gainadapt=1
# Full-deflection turn rate, deg/s -- anchors the measured plant curve to your sensitivity.
# 363.6 measured at LookSensitivity90. 0 = estimate from the adaptive gain.
plantfulldps=363.6

# Aim origin: 1 = standing origin (head motion does NOT move aim), 0 = HMD position.
aimorigin=1
# WHICH HAND AIMS: right (default) or left.
# Each hand keeps its OWN calibration file, so switching back and forth never destroys the
# other hand's tuning. The first time you select left, it is seeded by mirroring your right-
# hand calibration -- close enough to judge, but re-run the End / Page Down calibrations for
# a proper fit. Note the game's arms and weapons are authored right-handed, so the weapon
# will be in your left hand while still looking like a right-handed weapon.
aimhand=right
# Convergence distance in metres for the hand-translation part of aiming.
xdist=10.0

# ================================================================= HEAD TRANSLATION
# The game camera does not follow your physical head, so every centimetre you step is a centimetre
# of divergence between where your eye is and where the simulation thinks you are. With the traced
# reticule that divergence is an AIMING error directly: the marker sits on a world surface while
# your shots leave from the game camera, so moving your head pulls them apart. It is also why the
# offset used to clear the moment you reset your play area.
#
# The leash slides the standing origin to absorb any head displacement past its radius.
#   hmdleashlat=0  -- lateral translation fully negated (the default). Head ROTATION is untouched,
#                     which is where nearly all VR nausea actually comes from; incidental sideways
#                     head movement in a seated shooter is small, and cancelling it keeps aim
#                     honest. Judged in-headset as feeling good, not merely tolerable.
#   raise it       -- e.g. 0.30 gives you a 30 cm bubble of true 1:1 roomscale before it resists,
#                     at the cost of up to 30 cm of aiming divergence inside that bubble.
hmdleash=1
hmdleashlat=0
# Vertical is 0 too: physically ducking no longer lowers your view. Crouching in this game is a
# BUTTON, and that moves the simulated player -- which is what cover and being shot at care about.
hmdleashvert=0

# ================================================================= VIEW & TURNING
# Aiming does not drag your head: the view stays put while the gun moves.
viewlock=1
locksign=1
# Turning is your own right stick: 1 = snap, 2 = smooth, 0 = off.
turnmode=1
snapdeg=45
smoothdps=90
turndz=0.30
# Keep the aim reference correct across snap turns.
aimturn=1

# ================================================================= HOW AIM IS DRIVEN
# Two writers, doing different jobs. Both default ON; these lines are here so they are visible and
# switchable, not because the defaults need restating.
#
# blamangles -- writes the simulation's own aim angles directly. This is what makes pointing 1:1:
# the game's aim acceleration, deadzone and magnetism are all applied BEFORE this point, so there
# is no response curve to fight and no filtering to undo. It is also the value the game sends to
# the host, so in co-op other players see where you are really pointing.
#   0 = off (fall back to steering the stick)   1 = drive from the controller
blamangles=1
# Sign of the yaw mapping. The simulation stores yaw negated relative to the engine's convention,
# so this is -1. Change it only if aim mirrors left/right for the HOST while looking correct in
# your own headset -- that asymmetry is the symptom this knob exists for.
blamanglesysign=-1
#
# aimdirect -- assigns your local view instead of steering it, so what you see is steady rather
# than chasing. Local only; it is not what replicates. Turning it off while blamangles is on reads
# as heavy jitter, because the aim is then both steered and assigned at once.
aimdirect=1

# ================================================================= VEHICLES (STICK MODE)
# Halo binds the vehicle chase camera to your AIM, so hand-aim would swing the whole camera.
# Stick mode suspends motion aim whenever the game stops rendering your first-person weapon
# (vehicle seats, cutscenes, death): the sticks then work exactly like a gamepad's -- right
# stick = camera/aim, left stick = drive -- and everything re-anchors when you dismount.
stickmode=1
# Force: 0 = auto-detect, 1 = always stick mode, 2 = never. Use 1 if some seat is missed by
# the detector (please report it); this file is live, so it works mid-ride.
stickforce=0
# Detector debounce, seconds: how long the no-weapon state must hold to enter stick mode, and
# how long the weapon must be back to leave it. A weapon swap briefly looks like boarding, but
# the plugin re-checks aggressively the instant the weapon vanishes; raise stickon if swaps
# ever false-trigger stick mode.
stickon=0.75
stickoff=0.05

# HARD BRAKE: hold EITHER controller grip while seated. The quick-turn handbrake stays on the
# game's own left-trigger hold, unchanged.
brake=1
# How the brake is delivered:
#   3 = press the pad button in brakemask. 0x1000 = A, this game's vehicle hard brake - DEFAULT
#   2 = pull the left stick full back while gripping (this game reads it as reverse)
#   1 = hold the keyboard key in brakekey (does NOT reach this title's driving - reference only)
brakemode=3
brakemask=0x1000
brakekey=0xA2

# ================================================================= CUTSCENES
# This game's cutscenes are pre-rendered movies drawn outside the stereo render, so raw stereo
# shows them doubled. The mod can switch UEVR to its flat 2D Screen Mode while one plays and
# switch back when gameplay returns.
#   0 = off (CURRENT DEFAULT): cutscenes play as the game presents them (doubled)
#   1 = switch to UEVR's 2D Screen Mode
#   2 = mono collapse: kill eye separation instead -- fuses the world but NOT the movie
#
# WHY THE DEFAULT IS OFF RIGHT NOW. Mode 1 caused the view to oscillate on cutscene EXIT: the
# detector engaged and released several times a second, and each flip reallocates the whole view
# target, which in a headset is genuinely unpleasant to look at. The cause was ours and is fixed
# (engage and release now derive from one signal, plus a rate limit and a breaker that latches
# the feature off if transitions ever pile up). The default stays 0 only until a cutscene exit
# has been watched in a headset on the fixed build -- flip it to 1 to help verify that.
#
# KNOWN ISSUE for mode 1, separate from the above: over SteamVR's OpenXR runtime the 2D screen
# may not display in the headset (the picture is always fine on the desktop mirror). When that
# state is possible a hint panel is shown in VR -- SteamVR composites it above everything, so it
# displays even when the screen does not.
cutscene2d=0
# The in-VR hint panel (cutscene_hint.png, next to this file). 0 disables it; the rest position
# it in metres relative to your head: distance ahead, drop below eye level, panel width.
cuthint=1
cuthintdist=1.8
cuthintdrop=0.75
cuthintw=1.1
# The switch back to normal VR is automatic when the scene ends. If it ever fails to switch
# back, squeeze a controller grip -- that forces the flat view off immediately.

# ================================================================= MOVEMENT
# Rotate the left stick into your VIEW frame: push forward = walk where you look.
moverot=-1
movelive=4
movesmooth=0
movesrc=0

# ================================================================= WEAPON RIG (visual arms/gun)
rig=1
rigloc=1
rigmode=3
rigscale=131.2
rigclamp=0
riganchor=1
rigviewyaw=1
rigneutral=0
rigturn=1
# ---- SHIPPED CALIBRATION ---------------------------------------------------------
# Results of the pose-match (End) and aim-ray (Page Down) calibrations, promoted from a
# tuned profile so a fresh install starts somewhere usable instead of at zero.
#
# Measured on Quest Touch controllers, so it encodes one particular grip. If the weapon
# sits wrong in your hand, or shots do not go where you point, just recalibrate -- the
# README's "Custom calibration" section has the two-key procedure.
#
# IMPORTANT once you have calibrated yourself: your results are written to
# halo_vr_calib.cfg, which is parsed AFTER this file and therefore overrides everything
# below. Editing these lines will not change anything for you until you delete that file.
grip=-74.345
gripyaw=-44.775
griproll=46.123
# Schema stamp for the MESH trim above. 2 = measured relative to the view-lock frame, so it
# does not encode where this calibration was injected and travels between machines.
calibver=2
offx=2.527
offy=8.945
offz=-7.355
aimoffyaw=-8.659
aimoffpitch=-17.686
# SCHEMA STAMP for the two aim-offset values above. 1 = ABSOLUTE (the view-lock frame is NOT
# applied); 2 = measured RELATIVE to that frame, so the value does not encode where the person who
# made it happened to be facing when they injected, and it travels between machines.
#
# These are 2 because they were produced by the Page Down gesture, which subtracts the frame on
# write and has it added back on use. Never stamp a value 2 that was not measured that way -- the
# frame then gets added to an offset that never had it subtracted, which is a constant yaw error
# that changes every session and survives a restart once it reaches disk.
aimcalibver=2
# Same fit again for the DIRECT-DRIVE rig (rigmode=3, the default above). Mode 3 composes against
# its own trim rather than inheriting mode 2's fitted pivot, so it needs its own copy -- the End
# calibration writes both together and they only differ if you hand-edit one.
dirgrip=-74.345
dirgripyaw=-44.775
dirgriproll=46.123
# Keep these SMALL. A large direct-mode mount means the pivot is being absorbed into the offset
# again, which is the mode-2 failure rigmode=3 exists to avoid.
diroffx=2.527
diroffy=8.945
diroffz=-7.355
# ---- THE PIVOT, PINNED BY THE CALIBRATION ----------------------------------------
# G, the vector from the rig origin to the grip point. The mount offset above is fitted AGAINST
# this value -- the weapon is placed at (pose + R_ctrl*mount - R_gun*G) -- so if G changes, the
# mount is describing a geometry that no longer exists and the arms move by |R_gun * dG|.
#
# And it DID change. pivauto=1 re-read the PrimaryWeapon socket on every rig resolve, off the live
# ANIMATED skeleton, so it sampled whatever the arms were mid-pose. Measured across one mission
# restart: (61.6,13.1,-23.5) -> (20.2,12.6,-37.5). A 43.7 cm swing, which is exactly the "arms are
# offset after Restart Mission" bug. Aim was untouched because nothing in the aim path reads G,
# which is what made it look like a rig problem rather than a shared one.
#
# So the calibration owns it now: End freezes the G it fitted against and writes pivauto=0 with
# these three values. Do not set pivauto=1 unless you are also going to recalibrate -- turning it
# back on re-derives G underneath a mount that was fitted for a different one.
pivauto=0
pivx=61.467
pivy=13.062
pivz=-23.498


# --- CALIBRATION FRAME ------------------------------------------------------------------------
# Make the saved calibration independent of WHERE YOU INJECTED.
#
# `gripyaw` and `aimoffyaw` above are measured against the yaw the view lock pins the world to.
# That yaw is captured once per session, from the game camera on the first stereo frame after
# injection -- so it depends on your injection point:
#   * inject at the MAIN MENU (what the README tells you to do): the menu camera, which is 0 and
#     the same every launch. The values above are correct and this key changes nothing.
#   * inject MID-MISSION: whatever direction your character is facing at that moment. Arbitrary
#     every time, so the saved calibration is wrong by exactly that heading -- the weapon and
#     reticle sit off to one side, and re-calibrating only fixes it until you relaunch.
#
# DEFAULT 1, and it needs no recalibration. The values above were calibrated at the main menu,
# where the frame measures 0.0 -- and at frame 0 "absolute" and "frame-relative" are the same
# numbers, so they are already valid relative values. Menu injection keeps adding 0 and is
# unchanged; mid-mission injection finally gets the frame it was always missing.
#
# Measured 2026-08-03 in a live session, hand held still while the frame was moved underneath it:
#   frame   0.0  ->  aim - controller - frame = -4.00
#   frame +164.4 ->                             -4.00
#   frame  -31.2 ->                             -3.10     (aimoffyaw is -3.503; loop residual ~0.5)
# i.e. the calibration no longer moves with the injection point.
#
# Set to 0 only to reproduce the pre-2026-08-03 behaviour.
calibrelative=1

# ================================================================= RETICULE
# The game's own crosshair, lifted out of the flat HUD and drawn in the world at the true aim
# point (where bullets go), so the native hit marker keeps working. An optional geometric ring
# can be drawn there too (aimmesh below), off by default.

# Geometric ring, OFF. It was a visibility crutch from when the game's own crosshair rendered
# near-black, and the gain and tint below now carry the crosshair on their own -- with those
# settings the ring is redundant and reads as clutter sitting on top of the real reticle.
# Set aimmesh=1 to bring it back if you prefer a marker exactly at the true aim point.
aimmesh=0
aimmeshpath=StaticMesh /Game/FX/Meshes/Primitives/Torus/SM_Torus_ThinDense_01.SM_Torus_ThinDense_01
aimtex=1
aimmeshparent=/Game/FX/Meshes/Debug/Materials/MI_Arrow.MI_Arrow
aimmeshscale=0.14
# Ring colour, RGB 0-1. Live: edit and watch it change.
aimmeshcr=0.20
aimmeshcg=0.60
aimmeshcb=1.0
# Ring orientation offset (the torus axis must face you).
aimtexrotp=-90
aimtexroty=0
aimtexrotr=0
# Optional custom art: a PNG (white shape on transparent) shown instead of the material's own
# pattern, loaded straight from disk. Example ships as reticle_ring.png in the profile folder.
#aimtexfile=%APPDATA%\UnrealVRMod\HaloCampaignEvolved\reticle_ring.png
aimtexfile=

# Distance of the reticule from you, in cm.
# ---- TRACED RETICULE ------------------------------------------------------------
# Put the reticule ON the surface you are aiming at instead of at a guessed distance.
#
# A world-space marker at a FIXED distance only lines up with the impact point when viewed from
# where the shot leaves. In VR your eye is not there and does not stay put -- it travels with
# your head while the game camera does not -- so a fixed-distance marker drifts off your shots as
# you move, and snaps back when you reset your play area. Tracing removes the guess entirely.
aimreticuletrace=1
# How far to look for a surface, cm. Past this counts as a miss.
aimreticuletracemax=15000
# Collision channel (ETraceTypeQuery index). 0 = Visibility, which is blocked by things a BULLET
# ignores -- invisible blocking volumes, triggers -- so the reticule stops in mid-air on nothing.
# 1 = Camera, authored to ignore clutter, and the better default here. 2+ = this project's own
# channels in declaration order, if one of them turns out to be the weapon channel.
aimreticuletracechannel=1
# CAP on how far the reticule is ever drawn, cm. A marker on a hillside is correct and useless:
# too small, too washed out, stops reading as your reticule. Past this it parks at the cap, still
# on the ray. A miss uses this too, so panning onto sky does not pop it between two depths.
aimreticulemaxdist=600
# Pull the reticule this many cm back off the surface so it sits in FRONT of the wall rather than
# clipping into it. Applied only at a real hit -- past the cap there is nothing there to clip into,
# so the marker parks at the cap exactly, not at (cap - offset).
aimreticulesurfaceoff=50
# ---- SIZE WITH DISTANCE ---------------------------------------------------------
# The reticule now lands anywhere from arm's reach to the cap, and at a fixed world size apparent
# size goes as 1/distance -- overwhelming up close, invisible far away. So the mesh is scaled
# between TWO anchors, linearly, clamped at both ends:
#
#   minscale at minscaledist   ..   maxscale at aimreticulemaxdist
#
# The near anchor keeps the ring from filling your view when the muzzle is against a wall; at 0 it
# fades out entirely inside minscaledist, which is often what you want. The far anchor is the size
# the reticule always had before tracing existed, so at full distance nothing has changed.
#
# Anchoring BOTH ends matters. An earlier version fixed only the near end and let the ramp run
# free upward, which reached 7x at a 700 cm cap -- correct by its own formula and visibly absurd.
# To resize the reticule overall, move maxscale. aimmeshscale / aimwidgetscale set the base.
aimreticuleminscale=0
aimreticuleminscaledist=70
aimreticulemaxscale=1.0

aimreticuledist=500
# Reticule distance while seated in a vehicle or turret, in cm. Pushed further out than the
# on-foot distance so the ring clears your own bodywork and sits at a depth that suits driving.
# Its on-screen SIZE does not change with this - that is compensated - so tune it for depth and
# occlusion alone. 0 = use the on-foot distance above.
aimreticuledistveh=2200
# Seated reticule SIZE, as a fraction of your on-foot size. The distance above does not change the
# size (that is compensated), so this is the only size dial for vehicles - and it leaves the
# infantry reticule alone. 0.5 = half the on-foot size.
aimreticulescaleveh=0.5
aimreticule=1

# Host the game's own crosshair widget at the aim point (brings the hit marker along).
aimwidget=1
aimwidgetfresh=0
aimwidgetscale=0.24
aimwidgetdraw=256
aimwidgetblend=2
# Emissive gain for the hosted crosshair. Unlit widget output is still multiplied by the scene's
# pre-exposure before tonemapping, so Halo's authored cyan reads near-black outdoors; this lifts it
# back. Live-tunable while playing: raise if it is still dark, lower if it blows out. Automatically
# forced to 1.0 if an exposure-compensated widget material is in use.
#
# Tuned by eye in-headset across bright beach and deep shade. The scene term this fights varies by
# roughly 64x (about 6 stops) between those two, so no single value is right everywhere: this pair
# is the compromise that stays readable on the beach without blowing out in shade. Ceiling 1024.
aimwidgetgain=5

aimwidgetmat=0
aimwidgetflip=0

# Collapse the flat screen-space crosshair once you trust the world-space one.
hudhide=0
# Legacy flat-HUD reticle steering (superseded by the world-space reticule).
hudfollow=0
hudproject=1

# ================================================================= CONTROLS
# Masks are XInput button bits. Quest mapping: right A=0x1000, right B=0x4000 (reload),
# left X=0x2000, left Y=0x8000.

# Hold right-stick-up: left stick becomes the d-pad.
mapdpadshift=1
mapdpaddz=0.50
maprstickdz=0.65
# Right-stick-down = crouch (left X's native action), left X freed for equipment (LB).
maprstickdown=0x2000
mapfrom=0x2000
mapto=0x0100
# In menus: right B acts as Back, gameplay remaps stand down.
mapmenuback=0x4000
menusuppress=1
menudetect=1

# ================================================================= SYSTEM
# Raise UEVR's motion-controls inactivity timeout to its maximum at startup (prevents the
# "suddenly 3DoF until I press a button" state). 0 leaves UEVR's own setting alone.
vrinactivity=100
requirehmd=1

# Calibration bindings (virtual-key codes): End = pose-match, PageDown = aim align.
calibkey=0x23
#
#
aimcalibkey=0x22

# ================================================================= DIAGNOSTICS (leave off)
mapbtnlog=0
huddump=0
menudump=0
mathunt=0
aimparkview=0
aimrt=0
aimmeshunlit=1
aimdraw=0

# Widget render-target diagnostics (leave off; see docs)
aimrtwidget=0
aimwidgetbg=0
texhunt=0
matdump=
aimtexparam=

# Publish the aim ray as a Lua event for an external uevrlib-based reticule script.
# OFF because no such script ships here, and with nothing listening the plugin was formatting and
# dispatching a JSON payload ~26 times a second for no consumer. Harmless but pointless.
# Set to 1 if you install uevrlib and a script that draws the ray -- the mesh + widget reticules
# above are the shipping visual and need none of this.
aimreticulelua=0

# Frame-time instrumentation for the periodic work in update(). Off by default.
# Set to 1 and play for a minute or two, then look for the "PERF window=600 ticks" blocks in
# log.txt: each lists, per periodic site, how many times it ran in the window and its worst and
# mean cost in milliseconds. On a 90 Hz headset the frame budget is 11.1 ms, so any single site
# reporting a max above ~2 ms is a hitch you can feel.
# This is the tool for a periodic-microstutter report -- turn it on, capture, turn it back off.
perflog=0

# Rig resolution fast path. 1 (default) re-derives the first-person rig through a cached weapon
# actor; 0 falls back to searching the whole object array every ~2 seconds, which is what earlier
# builds did and is measurably more expensive.
# Set to 0 only to A/B a stutter against the old behaviour, or if the arms ever stop following
# your hand after a weapon swap -- and please report it if they do.
rigfast=1

# Crosshair tint multiplier, applied to the widget's TintColorAndOpacity on top of aimwidgetgain
# above. The two multiply, so the brightness you see is gain x tint.
#
# Ceiling is 1024 (as aimwidgetgain). If raising this stops making any difference at all, check
# that you are not sitting on the ceiling before looking for another cause -- the clamp is silent.
#
# Raise it for BRIGHT exteriors, which is where the crosshair goes dark: auto-exposure stops the
# scene down and the reticle is multiplied down with it. Shade is the opposite problem, so a value
# tuned on a beach can blow out indoors.
aimwidgettint=1024

# ---------------------------------------------------------------------------
# RETICULE SOURCE AND SMOOTHING
#
# aimreticulesrc - what the reticule is drawn from.
#   0 = the GAME's aim (ControlRotation). Truthful: it shows where shots really
#       go, including the aim loop's residual. That residual is visible as
#       jitter, but it is also the only on-screen readout of loop error, so SET
#       THIS TO 0 IF YOU ARE TUNING the aim actuator.
#   1 = the CONTROLLER's setpoint -- where you are pointing, rather than where
#       the loop has got to. Smooth, and the default because the residual is
#       barely detectable at the muzzle while being distracting on screen.
#       Falls back to 0 automatically whenever the aim law is not armed, so a
#       stale setpoint is never drawn as if it were live.
aimreticulesrc=0

# ---- SMOOTHING, GROUP 2 OF 2: THE RETICULE ---------------------------------
# These filter only what you SEE. They cannot affect where shots land -- for
# that, see group 1 (ffsmoothms / dsmoothms) up in the aim-loop section.
#
# Same units as group 1: a TIME CONSTANT IN MILLISECONDS. LOWER = snappier,
# HIGHER = calmer but laggier, 0 = raw/no filtering.
#
# Two values because the two sources carry different noise, and whichever source
# is actually in use picks its own. Tune the one matching aimreticulesrc above.
#
# aimreticulesmoothms - the GAME-AIM source (src=0). Carries the loop's
#   residual: coarse, and worth watching rather than hiding while tuning aim.
aimreticulesmoothms=0
# aimreticulesmoothctrlms - the CONTROLLER source (src=1). Carries hand tremor
#   and tracking noise: fine and fast, so it needs only a light touch. Raise a
#   few ms if the reticule shimmers while you hold still; lower if it feels like
#   it trails your hand.
aimreticulesmoothctrlms=8

# Motion gate for the two reticule filters above, in deg/s of controller swing.
# Smoothing only helps while the hand is near-still; during a deliberate swing
# it only adds lag. The time constant therefore fades to 0 between these rates:
# full strength at or below `slow`, off entirely at or above `fast`, linear in
# between. Does NOT apply to the group-1 aim-loop filters.
aimreticulesmoothslow=20
aimreticulesmoothfast=120

# Divergence guard, src=1 only. The setpoint lies when the loop cannot keep up,
# and lies most confidently when something is wrong. If it sits more than
# `divdeg` from the real aim for a continuous `divms`, the reticule snaps back
# to the true aim until the gap falls under half `divdeg` (hysteresis, so it
# cannot flap between sources).
#   8 deg  - above anything normal play produces (the deadband alone is 0.5)
#   500 ms - twice the loop's ~250 ms settle, so a whip turn never trips it
aimreticuledivdeg=8
aimreticuledivms=600

# ---------------------------------------------------------------- MELEE BY SWING
# Swing the aim hand and the game melees. Detection runs on the game thread and
# publishes a deadline; the XInput hook only compares a clock against it, so the
# controller poll path stays free of any real work.
#
# WHY SPEED AND NOT ROTATION. The false positive to beat is a fast aim turn: the
# hand moves quickly but you meant to look, not hit. A turn is mostly rotation
# about the wrist with little travel; a strike is mostly travel. So the trigger
# is metres per second of controller movement, not degrees per second.
#
# Never fires in stick mode (vehicles, cutscenes, death) or during calibration.
meleeswing=1

# Controller speed that counts as a strike, m/s. Conservative on purpose: a
# missed melee costs one swing, a spurious one shoves at the wrong moment.
meleespeed=1.50

# How much of the motion must lie along your view direction, 0..1, measured as
# |dot(velocity, hmd_forward)| so a backhand counts too. 0 disables the check.
# This is what rejects the sideways sweep of a turn.
meleefwd=0.0

# Rate the arm must be EXTENDING at, m/s -- d/dt of head-to-hand distance.
# THIS is the discriminator. A thrust grows it fast; an aim turn orbits the body
# at constant radius so it reads ~0; walking moves head and hand together, ~0.
meleeext=1.50

# How far the hand must be from the head when it fires, metres. Stops a fast
# twitch near the chest counting as a punch -- the arm has to actually be out.
# Relaxed hand ~0.30-0.40, committed thrust past 0.60.
meleereach=0.30

# Sanity ceiling on relative speed, m/s. The first live session logged a 26 m/s
# "swing", which no arm produces -- a tracking discontinuity. Above this the
# velocity history is dropped rather than fired on, because the next sample
# after a teleport is derived from the same bad position.
meleemaxspeed=12.0
# Sanity ceiling on reach, metres. After a 97 m/s spike, head-to-hand distance
# read 2.45-2.51 m for several samples -- the velocity guard caught the jump but
# the POSITION stayed wrong. No human arm is this long.
meleemaxreach=1.20

# Velocity smoothing time constant, ms. Long enough to kill tracking noise,
# short enough not to blunt the leading edge of a real strike.
meleetau=20

# Refractory period after a melee fires, ms. Halo's melee animation is not
# interruptible, so one swing crossing the threshold on several consecutive
# ticks must still produce exactly one press.
meleecooldown=500

# How long the synthetic button is held, ms. A single poll can land between the
# game's own input samples and be missed, so the press spans several.
meleehold=80

# Pad mask ORed in to melee. 0x0080 = RTHUMB (right stick click), this profile's
# melee. Confirm against your own mapping with mapbtnlog=1 before changing it.
meleemask=0x0080

# Prints every swing's peak speed and whether it fired -- the tuning instrument
# for meleespeed and meleefwd. Set it, swing a dozen times, read the log, turn
# it off.
meleelog=0

# ---------------------------------------------------------------- TWO-ARM RECON
# Dumps the first-person skeleton -- every bone with its parent -- and reports
# which bone functions this build actually exposes. Read-only: nothing is
# written to the game, no bone is hidden, no transform is touched.
#
# Fires on the RISING EDGE (0 -> 1), so leaving it set does not re-dump every
# time the config reloads. To dump again, set it back to 0, wait ~2 s, set 1.
#
# Set it while standing in NORMAL GAMEPLAY WITH A WEAPON DRAWN. The rig does not
# exist in menus, in vehicles, during cutscenes, or for about 5 seconds after a
# level load, and the dump will just report "no rig component".
#
# This is the instrument that decides whether independent left/right arms are
# buildable. Results go to the UEVR log as BONEDUMP lines.
bonedump=0

# ---------------------------------------------------------------- LEFT ARM HIDE
# Hides the left arm chain, so an independently tracked left hand can replace
# it. Fully reversible -- set back to 0 and the arm comes straight back.
#
# The bone dump established this is possible: HideBoneByName and
# UnHideBoneByName are both PRESENT, and Shoulder_L is the single root of all
# 34 left bones (hiding a bone hides its children). Weapon_M hangs off Chest_M
# rather than either wrist, so the gun is NOT dragged along with the arm.
#
# Right now this exists as PROOF, not as a feature: present in the reflection
# table is not the same as working on this mesh. Rig.cpp documents a relative
# rotation write that is present and silently does nothing, which is the whole
# reason rigmode 3 exists. Verify before anything gets built on top.
armhide=0

# Which bone to hide:
#   Shoulder_L  the entire arm
#   Elbow_L     forearm and hand, upper arm stays
#   Wrist_L     just the hand
armhidebone=Shoulder_L

# Apply to every first-person skeletal mesh, not just the arms. ON by default:
# the dump found THREE carrying this pose -- BPC_FP_SkeletalMesh_C,
# BPC_FP_TranslucentSkeletalMesh_C (the shield shell, which runs its own
# instance of the same anim blueprint) and BPC_FP_ShadowSkeletalMesh_C. Hiding
# only the arms leaves a floating shield limb and an arm-shaped shadow.
# Set 0 only to isolate which mesh is which while testing.
armhideall=1

# ---------------------------------------------------------------- VR RELOAD
# Two-stage reload. Press reload to DROP the mag -- the game is NOT told to
# reload yet -- then physically fetch a fresh one from your belt and bring it
# to the gun. The game's reload fires at the moment the mag goes in.
#
# Halo's reload is one atomic animation with no magazine object to manipulate,
# so the physicality cannot come from the game. It comes from step one taking
# the gun away: while the mag is out the trigger is dead and you have to do
# something about it.
#
#   IDLE     -- press reload      --> MAG_OUT   (fire suppressed)
#   MAG_OUT  -- left hand at belt + grip --> MAG_HELD
#   MAG_OUT  -- press reload again --> IDLE     (cancel, mag re-seats)
#   MAG_HELD -- release grip      --> MAG_OUT   (dropped it)
#   MAG_HELD -- hand to the gun   --> reload fires, back to IDLE
#
# No timeout: it holds indefinitely. But it always releases on the kill switch,
# in vehicles/cutscenes/death, and during calibration.
reloadvr=0

# UNCONFIRMED MASKS -- verify both with mapbtnlog=1 before trusting them. This
# profile's mapping is not obvious (mapfrom=0x2000 -> mapto=0x0100,
# mapmenuback=0x4000), and a wrong mask means reload never starts or steals a
# button you needed.
# 0x4000 = X, this game's reload.
reloadmask=0x4000
# Left grip -- what you hold to keep hold of the magazine.
reloadgrip=0x0100

# BELT ZONE, measured from your head (the only body reference VR gives us).
# How far BELOW head height the hand must be, metres.
reloadbeltdrop=0.55
# ...and how close to your body's vertical axis, metres. A hand dropped at your
# side counts; one flung out sideways does not.
reloadbeltrad=0.50

# How close the left hand must come to the aim hand to seat the mag, metres.
# Hand-to-hand, not hand-to-weapon: the gun is a separate actor whose grip
# point moves per weapon, while both controllers are always known.
reloadjoin=0.30

# Swallow the trigger while the mag is out. This is what gives it stakes --
# 0 makes the whole gesture cosmetic.
reloadnofire=1

# Pressing reload again while the mag is out re-seats it and aborts. OFF,
# because that is not how VR reloading works -- Onward, Pavlov, H3VR: once the
# mag is out you deal with it. A cancel is a menu concept, not a physical one,
# and a double-tap silently skipped the whole gesture.
#
# The involuntary cases are still covered without it: kill switch, vehicles,
# cutscenes, death and calibration all reset and release the trigger. What is
# NOT covered is a gesture you cannot physically complete -- if that happens,
# enabled=0 is the way out.
reloadcancel=0

# Log every state transition -- the tuning instrument for the belt zone and
# join distance.
reloadlog=1

# HOW to hide. HideBoneByName reported success on all three meshes and changed
# nothing visible, so per-bone hiding may simply be inert on this build -- the
# same silent no-op Rig.cpp records for the relative rotation write.
#
#   0 = HideBoneByName        per-bone. Keeps the right arm. What we want if it works.
#   1 = SetVisibility(false)  whole component. Takes BOTH arms.
#   2 = SetHiddenInGame(true) whole component, different path to the same thing.
#
# Modes 1 and 2 are blunt, but they are the route to genuinely independent
# hands: SetBoneTransformByName is ABSENT on this build, so the game's arms
# cannot be posed at all. The only way to two free arms is to remove the
# game's pair and attach our own to the controllers. Both pass
# bPropagateToChildren=false, so the weapon actor stays where it is.
armhidemode=2

# ---------------------------------------------------------------- OUR OWN HANDS
# With the game's first-person meshes hidden there is nothing on screen but a
# floating gun. These are the replacement: spawned meshes attached to the motion
# controllers through UObjectHook, the same mechanism the weapon rig uses.
#
# Spawned rather than borrowed because the bone dump closed every other route --
# SetBoneTransformByName is ABSENT on this build, so the game's own hand bones
# cannot be posed at all.
#
# The default mesh is an engine primitive. It is a placeholder and looks like
# one: Halo ships no standalone hand asset we can borrow. Point handmesh at
# something better if you find one.
handsvr=0

# Object path to a StaticMesh, e.g.
#   handmesh=StaticMesh /Engine/BasicShapes/Sphere.Sphere
# Empty falls back to an engine sphere.
handmesh=

# Uniform scale. The engine sphere is 100 cm radius, hence the small number.
handscale=0.06

# Offset from the controller, centimetres, in the controller's own frame. The
# tracked point sits behind and below a real palm, so a mesh at the raw pose
# floats off the wrist.
handoffx=0.0
handoffy=0.0
handoffz=0.0

# Also show a mesh on the AIM hand. Off by default -- the weapon already tracks
# that controller, so a second object there mostly intersects the gun.
handshowaim=0

# ---------------------------------------------------------------- THE MAGAZINE
# Visible only while the reload state machine has one in your hand. Hidden
# rather than destroyed between reloads: spawning a component per reload would
# churn objects on the game thread for nothing.
magshow=1
magmesh=
magscale=0.04
magoffx=0.0
magoffy=0.0
magoffz=0.0

# How long to hold the reload button before it stops being a reload and becomes
# the game's own action, milliseconds.
#
# Both buttons this feature borrows already have jobs. The reload button is ALSO
# Interact and Enter Vehicle -- swallowing it unconditionally cost a whole
# chapter of vehicles -- and the left grip is Throw Grenade, so every magazine
# grab was lobbing a frag.
#
#   TAP  the reload button -> VR reload starts, the game never sees it
#   HOLD the reload button -> passes through, Interact / Enter Vehicle as normal
#
# The grip is only swallowed while a magazine is expected or in hand, so
# grenades work normally whenever you are not mid-reload.
reloadhold=500

# The left grip belongs to US, not the game. It is the VR interaction button --
# magazine grabs now, weapon holding later -- and a button that throws a grenade
# when you reach for something cannot carry physical interactions.
#
# With this on THE GAME NEVER SEES THE GRIP, so grenades need rehoming below.
# Set 0 for the narrower rule: grip swallowed only mid-reload.
gripexclusive=1

# GRENADE, moved off the grip. Pure remap: press grenadefrom, the plugin injects
# grenadeaction in its place.
#
# BOTH MASKS MUST BE MEASURED, not guessed. Controller buttons and XInput masks
# do not line up here -- your right controller B reports as 0x4000, which the
# game labels X. Set mapbtnlog=1, press your LEFT controller X, and read the
# mask; that is grenadefrom. grenadeaction should be whatever the grip used to
# report, since that is the mask the game already treats as throw.
#
# 0 disables the remap.
grenadefrom=0x0000
grenadeaction=0x0100

# Force hidden skeletal meshes to keep evaluating their pose.
#
# UE defaults to OnlyTickPoseWhenRendered, so a HIDDEN mesh can stop animating
# entirely -- and the weapon rig positions the gun from this mesh's
# PrimaryWeapon SOCKET. A frozen pose therefore means a frozen socket and a gun
# parked wherever the animation stopped, showing up intermittently depending on
# when the hide lands relative to the rig resolving.
#
# Set 0 to test whether the arm hide is what is moving your weapon.
armkeeppose=1

# ---------------------------------------------------------------- PER-WEAPON OFFSETS
# One calibration cannot fit a pistol, an assault rifle and a rocket launcher --
# they do not share a grip geometry. These adjust the calibrated base PER
# WEAPON, so pose-match calibration still does the work and you only add an
# entry where a specific weapon disagrees.
#
# A weapon with no entry behaves exactly as it does now, so turning this on
# changes nothing until you tune something.
wpnoffsets=0

# Logs which weapon you are holding and which entry matched. Turn it on once to
# harvest the class names, then off.
wpnlog=1

# wpnoff=<match>,<dx>,<dy>,<dz>,<dgrip>,<dyaw>,<droll>
#
#   match   substring of the weapon actor class -- "AssaultRifle" matches
#           BP_AssaultRifle_WeaponActor_C. First match wins, so put specific
#           entries above general ones.
#   dx/dy/dz        centimetres, ADDED to offx/offy/offz
#   dgrip/dyaw/droll  degrees, ADDED to grip/gripyaw/griproll
#
# Trailing values are optional: "wpnoff=Pistol,1.5" only nudges X.
# Repeatable, up to 24 entries. Examples, commented out:
#
# wpnoff=Pistol,0.0,0.0,-2.0
# wpnoff=AssaultRifle,0.0,0.0,1.5,-3.0
# wpnoff=RocketLauncher,0.0,-1.0,3.0

# PER-WEAPON CAPTURE KEY. Same gesture as the global calibration on END: hold
# it, the weapon freezes, line your controller up with where it should sit,
# release. The only difference is the destination -- this stores a DELTA for
# the weapon in your hands and leaves the global calibration alone.
#
# Captures are written to halo_vr_weapons.cfg, which the plugin owns and
# rewrites in full. Hand-written wpnoff lines stay here in halo_vr.cfg and keep
# their comments; both files feed the same table.
#
#   HOME=0x24  INSERT=0x2D  DELETE=0x2E  PGUP=0x21  PGDN=0x22   (0 disables)
wpncalibkey=0x24

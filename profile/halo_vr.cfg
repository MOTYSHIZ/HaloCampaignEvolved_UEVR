# halo_vr.cfg -- SHIPPED CALIBRATION DATA for the Halo: Campaign Evolved VR plugin (halo_vr.dll)
#
# This is the one shipped file the mod still reads values from, and it holds ONLY the shipped
# weapon calibration below. DO NOT EDIT IT: recalibrate instead (hold End for the pose match,
# then Page Down for the aim ray, in a mission) -- your results are saved to halo_vr_calib.cfg,
# which overrides this file, and deleting halo_vr_calib.cfg brings this shipped fit back.
# A mod update overwrites this file.
#
# SETTINGS DO NOT LIVE HERE. The defaults are built into the plugin itself; change a setting by
# putting the key in halo_vr_user.cfg -- that file is YOURS: updates never touch it, and
# deleting it resets every setting to the built-in defaults. The full catalog of what is
# available, with each key's default, is halo_vr_user_reference.txt. Internal/research knobs
# live in halo_vr_dev.cfg. All of these files are re-read live (~2 s) while the game runs.

# ================================================================ SHIPPED FIT
# Results of the pose-match (End) and aim-ray (Page Down) calibrations, promoted from a tuned
# profile so a fresh install starts somewhere usable instead of at zero. Measured on Quest
# Touch controllers, so they encode one particular grip: if the weapon sits wrong in your hand
# or shots miss where you point, RECALIBRATE (README, "Custom calibration") rather than
# hand-editing numbers here.

# How the weapon sits in the hand (pitch / yaw / roll trim), fitted by End.
grip=-74.345
gripyaw=-44.775
griproll=46.123
# Schema stamp for the trim above. 2 = measured relative to the view-lock frame, so the values
# do not encode where the calibration was injected and travel between machines. NEVER
# hand-stamp a value 2 that the gesture did not produce -- that certifies a rebase that never
# happened, which is a constant yaw error that survives restarts once it reaches disk.
calibver=2
# Mount offset (cm) and the hand-to-aim offset (degrees), fitted by End / Page Down.
offx=2.527
offy=8.945
offz=-7.355
aimoffyaw=-8.659
aimoffpitch=-17.686
# Separate stamp for the two aim offsets above -- same 1=absolute / 2=frame-relative meaning.
# The two gestures rebase different values, so each certifies only its own.
aimcalibver=2
# The same fit again for the direct-drive rig (the default drive mode composes against its OWN
# trim and mount). End writes both sets together; they only differ if hand-edited. Keep the
# dir offsets SMALL -- a large direct-mode mount means the pivot is being folded into the
# offset again, which is the failure direct drive exists to avoid.
dirgrip=-74.345
dirgripyaw=-44.775
dirgriproll=46.123
diroffx=2.527
diroffy=8.945
diroffz=-7.355
# THE PIVOT: the grip point the weapon rotates about, in rig-local cm, frozen by the End
# calibration (pivauto=0). The mount above is fitted AGAINST this value, so do not set
# pivauto=1 unless you recalibrate immediately after -- re-deriving the pivot under a mount
# fitted for a different one is exactly the "arms offset after Restart Mission" bug.
pivauto=0
pivx=61.467
pivy=13.062
pivz=-23.498
# Store/apply yaw calibrations relative to the session's view-lock frame, so a calibration no
# longer encodes WHERE YOU INJECTED. Menu injection (the README instruction) measures frame 0
# and is bit-for-bit unchanged; mid-mission injection finally gets the frame it was always
# missing. 0 only to reproduce the pre-2026-08-03 behaviour.
calibrelative=1

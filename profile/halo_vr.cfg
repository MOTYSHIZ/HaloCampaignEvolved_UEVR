# halo_vr.cfg - configuration for the Halo: Campaign Evolved VR plugin (halo_vr.dll)
#
# This file is RE-READ LIVE every ~2 seconds while the game runs. Edit, save, and the change
# applies without restarting. Lines starting with # are comments. Values shown are the defaults.

# ================================================================= AIM
# The aim loop steers Halo's own aim (via synthesized right-stick input) to follow your controller.

# Master switch for the whole driver.
enabled=1

# Render-rate control: recompute the aim law at the rate the game samples input, from a fresh
# controller pose, instead of once per (slower) engine tick. 0 restores tick-rate control.
aimrate=1

# Stick deflection the game starts responding to (measured ~0.24 on this title).
floor=0.280
# Aim error (degrees) that saturates the virtual stick. The adaptive gain rescales this live.
full=6.00
# Deadband in degrees: errors below this leave the stick parked...
dead=0.50
# ...and once moving, the aim re-parks only below dead*deadhyst (hysteresis stops edge chatter).
deadhyst=0.50

# Velocity feedforward: drives the stick to MATCH your hand's angular rate outright, so tracking
# does not need a standing error. Raise toward 1.2 if fast sweeps lag; lower toward 0.8 if they
# overshoot. 0 disables (pure proportional).
ffgain=1.0
# Damping against overshoot / rubber-banding after fast turns.
dgain=0.15
# Smoothing of the target rate (feedforward input) and the measured aim rate (damping input).
ffsmooth=0.5
dsmooth=0.30
# Reduce yaw feedforward when aiming steeply up/down (compensates quaternion yaw noise at pitch).
ffpitchcomp=1

# Adapt the loop gain to the game's actual turn rate (tracks in-game sensitivity settings).
gainadapt=1

# Aim origin: 1 = standing origin (head motion does NOT move aim), 0 = HMD position.
aimorigin=1
# Convergence distance in metres for the hand-translation part of aiming.
xdist=10.0

# ================================================================= VIEW & TURNING
# Aiming does not drag your head: the view stays put while the gun moves.
viewlock=1
locksign=1
# Turning is your own right stick: 1 = snap, 2 = smooth, 0 = off.
turnmode=1
snapdeg=45
smoothdps=90
turndz=0.30
# Keep the aim reference correct across snap turns.
aimturn=1

# ================================================================= MOVEMENT
# Rotate the left stick into your VIEW frame: push forward = walk where you look.
moverot=-1
movelive=1
movesmooth=0.25
movesrc=0

# ================================================================= WEAPON RIG (visual arms/gun)
rig=1
rigloc=1
rigmode=2
rigscale=131.2
rigclamp=0
riganchor=1
rigviewyaw=1
rigneutral=0
rigturn=1
# ---- SHIPPED CALIBRATION ---------------------------------------------------------
# Results of the pose-match (End) and aim-ray (Page Down) calibrations, promoted from a
# tuned profile so a fresh install starts somewhere usable instead of at zero.
#
# Measured on Quest Touch controllers, so it encodes one particular grip. If the weapon
# sits wrong in your hand, or shots do not go where you point, just recalibrate -- the
# README's "Custom calibration" section has the two-key procedure.
#
# IMPORTANT once you have calibrated yourself: your results are written to
# halo_vr_calib.cfg, which is parsed AFTER this file and therefore overrides everything
# below. Editing these lines will not change anything for you until you delete that file.
grip=-64.603
gripyaw=-10.676
griproll=4.622
offx=1.171
offy=-7.300
offz=49.329
aimoffyaw=-3.503
aimoffpitch=-4.347

# ================================================================= RETICULE
# A colored ring at the true aim point (where bullets go), plus the game's own crosshair hosted
# beside it so the native hit marker keeps working.

# The ring: game torus mesh + a game material with a live colour parameter.
aimmesh=1
aimmeshpath=StaticMesh /Game/FX/Meshes/Primitives/Torus/SM_Torus_ThinDense_01.SM_Torus_ThinDense_01
aimtex=1
aimmeshparent=/Game/FX/Meshes/Debug/Materials/MI_Arrow.MI_Arrow
aimmeshscale=0.14
# Ring colour, RGB 0-1. Live: edit and watch it change.
aimmeshcr=0.20
aimmeshcg=0.60
aimmeshcb=1.0
# Ring orientation offset (the torus axis must face you).
aimtexrotp=-90
aimtexroty=0
aimtexrotr=0
# Optional custom art: a PNG (white shape on transparent) shown instead of the material's own
# pattern, loaded straight from disk. Example ships as reticle_ring.png in the profile folder.
#aimtexfile=%APPDATA%\UnrealVRMod\HaloCampaignEvolved\reticle_ring.png
aimtexfile=

# Distance of the reticule from you, in cm.
aimreticuledist=500
aimreticule=1

# Host the game's own crosshair widget at the aim point (brings the hit marker along).
aimwidget=1
aimwidgetfresh=0
aimwidgetscale=0.24
aimwidgetdraw=256
aimwidgetblend=2
aimwidgetmat=0
aimwidgetflip=0

# Collapse the flat screen-space crosshair once you trust the world-space one.
hudhide=0
# Legacy flat-HUD reticle steering (superseded by the world-space reticule).
hudfollow=0
hudproject=1

# ================================================================= CONTROLS
# Masks are XInput button bits. Quest mapping: right A=0x1000, right B=0x4000 (reload),
# left X=0x2000, left Y=0x8000.

# Hold right-stick-up: left stick becomes the d-pad.
mapdpadshift=1
mapdpaddz=0.50
maprstickdz=0.65
# Right-stick-down = crouch (left X's native action), left X freed for equipment (LB).
maprstickdown=0x2000
mapfrom=0x2000
mapto=0x0100
# In menus: right B acts as Back, gameplay remaps stand down.
mapmenuback=0x4000
menusuppress=1
menudetect=1

# ================================================================= SYSTEM
# Raise UEVR's motion-controls inactivity timeout to its maximum at startup (prevents the
# "suddenly 3DoF until I press a button" state). 0 leaves UEVR's own setting alone.
vrinactivity=100
requirehmd=1

# Calibration bindings (virtual-key codes): End = pose-match, PageDown = aim align.
calibkey=0x23
aimcalibkey=0x22

# ================================================================= DIAGNOSTICS (leave off)
mapbtnlog=0
huddump=0
menudump=0
mathunt=0
aimparkview=0
aimrt=0
aimmeshunlit=1
aimdraw=0

# Widget render-target diagnostics (leave off; see docs)
aimrtwidget=0
aimwidgetbg=0
texhunt=0
matdump=
aimtexparam=

# Publish the aim ray as a Lua event for an external uevrlib-based reticule script.
# OFF because no such script ships here, and with nothing listening the plugin was formatting and
# dispatching a JSON payload ~26 times a second for no consumer. Harmless but pointless.
# Set to 1 if you install uevrlib and a script that draws the ray -- the mesh + widget reticules
# above are the shipping visual and need none of this.
aimreticulelua=0

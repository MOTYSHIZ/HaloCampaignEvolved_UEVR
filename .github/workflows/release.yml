# Build on every push; publish a GitHub Release with the profile zip on tag push.
# Pattern follows mutars/stalker2-uevr's dev-release workflow.
name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    # Declared explicitly for two reasons. Publishing a Release writes to the repo, and GITHUB_TOKEN
    # defaults to read-only on repositories created since early 2023 -- without this the build would
    # pass and only the publish step would 403. Naming ANY scope also drops every scope not listed to
    # `none`, so this simultaneously caps what a compromised third-party action could reach.
    # `write` implies `read`, which is all actions/checkout needs.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Pinned to the nightly this mod targets (nightly-01138 = 158232a).
      #
      # The ref MUST be the full 40-character SHA. actions/checkout fetches by ref, and GitHub's
      # fetch-by-SHA rejects the abbreviated form -- `git fetch origin 158232a` fails with
      # "couldn't find remote ref", while the full SHA succeeds. A short SHA only resolves locally,
      # where the object is already present, which is why COMPILING.md can use the short form.
      - name: Fetch UEVR SDK (pinned to the nightly this mod targets)
        uses: actions/checkout@v4
        with:
          repository: praydog/UEVR
          ref: 158232aa0703f39014931a8a2320e0633c3c47d4
          path: sdk-uevr

      - name: Build + package
        id: pkg
        shell: pwsh
        run: |
          $env:UEVR_SDK = "$PWD\sdk-uevr"
          scripts\package.ps1
          # Publish the hash of the file CI actually built. It is never byte-identical to a local
          # build -- the runner's MSVC toolset differs from any dev machine, and git checks text
          # files out as CRLF here -- so a hand-copied local hash makes every user's verification
          # fail, which looks exactly like tampering.
          $zip  = 'build/HaloCampaignEvolved.zip'
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "$hash  HaloCampaignEvolved.zip" | Out-File "$zip.sha256" -Encoding ascii
          Write-Host "SHA-256  $hash"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: HaloCampaignEvolved
          path: build/HaloCampaignEvolved.zip

      # Pinned to a commit SHA, not the `v2` tag. Tags are mutable: the upstream author can retag at
      # any time, and this action runs with GITHUB_TOKEN in our job. Retagging a version people had
      # pinned is how tj-actions/changed-files leaked secrets from thousands of repos in 2025.
      # A SHA cannot be moved. Bump it deliberately (or let Dependabot do it) rather than drifting.
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            build/HaloCampaignEvolved.zip
            build/HaloCampaignEvolved.zip.sha256
          generate_release_notes: true
          # append_body, NOT body: this adds the hash to whatever notes are already on the release
          # instead of replacing them. Hand-written release notes survive a re-run of the same tag.
          append_body: true
          body: |

            ---
            **SHA-256** of `HaloCampaignEvolved.zip`, computed by CI from the exact file attached above:
            ```
            ${{ steps.pkg.outputs.sha256 }}
            ```
            A local build will hash differently and that is expected — verify against this value.
